  var si=(sy*W+sx)*4;
  var r0=d[si], g0=d[si+1], b0=d[si+2], a0=d[si+3];
  tol=(tol==null?32:tol);
  var t2=tol*tol*3;
  var seen=new Uint8Array(W*H);
  var stack=[sy*W+sx];
  var minX=W, minY=H, maxX=0, maxY=0, count=0;
  while(stack.length){
    var idx=stack.pop();
    if(seen[idx]) continue;
    var x=idx%W, y=(idx-x)/W;
    var i4=idx*4;
    var dr=d[i4]-r0, dg=d[i4+1]-g0, db=d[i4+2]-b0, da=d[i4+3]-a0;
    if(dr*dr+dg*dg+db*db>t2||Math.abs(da)>tol+24) continue;
    seen[idx]=1; count++;
    if(x<minX) minX=x; if(x>maxX) maxX=x;
    if(y<minY) minY=y; if(y>maxY) maxY=y;
    if(x>0) stack.push(idx-1);
    if(x<W-1) stack.push(idx+1);
    if(y>0) stack.push(idx-W);
    if(y<H-1) stack.push(idx+W);
    if(count>W*H) break;
  }
  if(!count){ toast('Nichts getroffen'); return; }
  var bw=maxX-minX+1, bh=maxY-minY+1;
  var m=mkMaskCv(bw,bh), mg=m.getContext('2d');
  var mi=mg.createImageData(bw,bh), md=mi.data;
  for(var yy=0;yy<bh;yy++) for(var xx=0;xx<bw;xx++){
    if(!seen[(yy+minY)*W+(xx+minX)]) continue;
    var o=(yy*bw+xx)*4;
    md[o]=255; md[o+1]=255; md[o+2]=255; md[o+3]=255;
  }
  mg.putImageData(mi,0,0);
  sel={x:minX,y:minY,w:bw,h:bh,mask:m,poly:null};
  sel.poly=maskContours(m,minX,minY);
  toast('Ausgewählt: '+count.toLocaleString('de-DE')+' Punkte');
}
function selAllDoc(){ selFromRect(0,0,doc.w,doc.h); }
function selInvert(){
  if(selEmpty()){ selAllDoc(); return; }
  var m=mkMaskCv(doc.w,doc.h), g=m.getContext('2d');
  g.fillStyle='#fff'; g.fillRect(0,0,doc.w,doc.h);
  g.save();
  g.globalCompositeOperation='destination-out';
  if(sel.mask) g.drawImage(sel.mask,sel.x,sel.y);
  else g.fillRect(sel.x,sel.y,sel.w,sel.h);
  g.restore();
  sel={x:0,y:0,w:doc.w,h:doc.h,mask:m,poly:null};
  sel.poly=maskContours(m,0,0);
  toast('Auswahl umgekehrt');
}
/* Umriss der Auswahl zeichnen */
function drawSelOutline(g){
  if(selEmpty()) return;
  g.save();
  /* Schwebt die Auswahl, zeigt der Rahmen die Verwandlung — sonst die echte Form */
  if(floatPix){
    var fw=floatPix.w||floatPix.cv.width, fh=floatPix.h||floatPix.cv.height;
    g.translate(floatPix.x+fw/2,floatPix.y+fh/2);
    if(floatPix.rot) g.rotate(floatPix.rot);
    g.lineWidth=1.6/view.scale;
    g.setLineDash([7/view.scale,5/view.scale]);
    g.strokeStyle='#ffffff'; g.strokeRect(-fw/2,-fh/2,fw,fh);
    g.setLineDash([]); g.lineWidth=1/view.scale;
    g.strokeStyle=LENS[lens].c;
    g.strokeRect(-fw/2-1/view.scale,-fh/2-1/view.scale,fw+2/view.scale,fh+2/view.scale);
    g.restore(); return;
  }
  function trace(){
    if(sel.poly&&sel.poly.length){
      sel.poly.forEach(function(c){
        if(c.length<2) return;
        g.beginPath(); g.moveTo(c[0].x,c[0].y);
        for(var i=1;i<c.length;i++) g.lineTo(c[i].x,c[i].y);
        g.closePath(); g.stroke();
      });
    } else {
      g.beginPath(); g.rect(sel.x,sel.y,sel.w,sel.h); g.stroke();
    }
  }
  g.lineWidth=2/view.scale; g.strokeStyle='#0a0a0aaa'; g.setLineDash([]);
  trace();
  g.lineWidth=1.4/view.scale; g.strokeStyle='#ffffff';
  g.setLineDash([7/view.scale,5/view.scale]);
  trace();
  g.setLineDash([]);
  g.restore();
}
/* ══════════ AUSWAHL VERSCHIEBEN, SKALIEREN, DREHEN ══════════ */
function selHandles(){
  if(selEmpty()) return [];
  var s=8/view.scale;
  return [
    {id:'nw',x:sel.x,y:sel.y},
    {id:'ne',x:sel.x+sel.w,y:sel.y},
    {id:'se',x:sel.x+sel.w,y:sel.y+sel.h},
    {id:'sw',x:sel.x,y:sel.y+sel.h},
    {id:'rot',x:sel.x+sel.w/2,y:sel.y-28/view.scale}
  ];
}
function hitSelHandle(pt){
  var r=14/view.scale;
  var hs=selHandles();
  for(var i=0;i<hs.length;i++)
    if(Math.hypot(hs[i].x-pt.x,hs[i].y-pt.y)<r) return hs[i];
  return null;
}
function drawSelHandles(g){
  if(selEmpty()||(tool()!=='move'&&!floatPix)) return;
  var s=7/view.scale;
  g.save();
  g.lineWidth=1.6/view.scale;
  selHandles().forEach(function(h){
    g.fillStyle=h.id==='rot'?LENS[lens].c:'#ffffff';
    g.strokeStyle='#0a0a0a';
    g.beginPath();
    if(h.id==='rot'){ g.arc(h.x,h.y,s,0,Math.PI*2); g.fill(); g.stroke(); }
    else { g.fillRect(h.x-s,h.y-s,s*2,s*2); g.strokeRect(h.x-s,h.y-s,s*2,s*2); }
  });
  g.strokeStyle=LENS[lens].c+'99';
  g.setLineDash([4/view.scale,4/view.scale]);
  g.beginPath();
  g.moveTo(sel.x+sel.w/2,sel.y); g.lineTo(sel.x+sel.w/2,sel.y-28/view.scale); g.stroke();
  g.setLineDash([]);
  g.restore();
}
function beginSelTransform(h,pt,pid,l){
  if(!floatPix) liftPix(l);
  if(!floatPix) return;
  drag={kind:'selT',l:l,h:h.id,start:pt,id:pid,
        orig:{x:floatPix.x,y:floatPix.y,w:floatPix.w,h:floatPix.h,rot:floatPix.rot||0}};
}
function selTransform(pt){
  if(!drag||!floatPix) return;
  var o=drag.orig;
  if(drag.h==='rot'){
    var cx=o.x+o.w/2, cy=o.y+o.h/2;
    floatPix.rot=Math.atan2(pt.y-cy,pt.x-cx)+Math.PI/2;
  } else {
    var nx=o.x, ny=o.y, nw=o.w, nh=o.h;
    if(drag.h==='se'){ nw=Math.max(8,pt.x-o.x); nh=Math.max(8,pt.y-o.y); }
    else if(drag.h==='nw'){ nx=Math.min(pt.x,o.x+o.w-8); ny=Math.min(pt.y,o.y+o.h-8); nw=o.x+o.w-nx; nh=o.y+o.h-ny; }
    else if(drag.h==='ne'){ ny=Math.min(pt.y,o.y+o.h-8); nw=Math.max(8,pt.x-o.x); nh=o.y+o.h-ny; }
    else if(drag.h==='sw'){ nx=Math.min(pt.x,o.x+o.w-8); nw=o.x+o.w-nx; nh=Math.max(8,pt.y-o.y); }
    floatPix.x=nx; floatPix.y=ny; floatPix.w=nw; floatPix.h=nh;
    sel.x=nx; sel.y=ny; sel.w=nw; sel.h=nh;
  }
  req();
}

/* ══════════════════════════════════════════════════════════════════════
   LINEALE FREI SETZEN — Fluchtpunkt, Ellipse, Ursprung der Geraden
   ══════════════════════════════════════════════════════════════════════ */
/* ══════════ MATERIAL ANPASSEN ══════════
   Referenzbilder liegen unabhängig von der Blattgröße und lassen sich
   verschieben, skalieren und wieder einpassen.                        */
var matEdit=null;
function matRect(l){
  if(!l.data.rect){
    var iw=(l.data.img&&l.data.img.width)||doc.w, ih=(l.data.img&&l.data.img.height)||doc.h;
    var k=Math.min(doc.w/iw,doc.h/ih);
    l.data.rect={x:(doc.w-iw*k)/2,y:(doc.h-ih*k)/2,w:iw*k,h:ih*k};
  }
  return l.data.rect;
}
function matStart(l){
  matEdit={l:l};
  matRect(l);
  setPanel(panelZu);
  toast('Material anpassen \u2014 Ecken ziehen, Fl\u00E4che verschieben');
  req();
}
function matEnde(){ if(matEdit){ matEdit=null; autosaveSoon(); req(); } }
function matHandles(){
  if(!matEdit) return [];
  var r=matRect(matEdit.l);
  return [{id:'nw',x:r.x,y:r.y},{id:'ne',x:r.x+r.w,y:r.y},
          {id:'se',x:r.x+r.w,y:r.y+r.h},{id:'sw',x:r.x,y:r.y+r.h}];
}
function hitMatHandle(pt){
  var hs=matHandles(), rr=16/view.scale;
  for(var i=0;i<hs.length;i++) if(Math.hypot(hs[i].x-pt.x,hs[i].y-pt.y)<rr) return hs[i];
  if(matEdit){
    var r=matRect(matEdit.l);
    if(pt.x>r.x&&pt.x<r.x+r.w&&pt.y>r.y&&pt.y<r.y+r.h) return {id:'move',x:pt.x,y:pt.y};
  }
  return null;
}
function matMove(h,pt,o){
  var r=matRect(matEdit.l), asp=o.w/Math.max(1,o.h);
  if(h==='move'){ r.x=o.x+(pt.x-o.px); r.y=o.y+(pt.y-o.py); }
  else {
    var nw,nh;
    if(h==='se'){ nw=Math.max(20,pt.x-o.x); nh=nw/asp; r.x=o.x; r.y=o.y; }
    else if(h==='nw'){ nw=Math.max(20,(o.x+o.w)-pt.x); nh=nw/asp; r.x=o.x+o.w-nw; r.y=o.y+o.h-nh; }
    else if(h==='ne'){ nw=Math.max(20,pt.x-o.x); nh=nw/asp; r.x=o.x; r.y=o.y+o.h-nh; }
    else { nw=Math.max(20,(o.x+o.w)-pt.x); nh=nw/asp; r.x=o.x+o.w-nw; r.y=o.y; }
    r.w=nw; r.h=nh;
  }
  invalidate('material'); req();
}
function matEinpassen(art){
  if(!matEdit) return;
  var l=matEdit.l, iw=(l.data.img&&l.data.img.width)||doc.w, ih=(l.data.img&&l.data.img.height)||doc.h;
  var k=(art==='fuellen')?Math.max(doc.w/iw,doc.h/ih):Math.min(doc.w/iw,doc.h/ih);
  l.data.rect={x:(doc.w-iw*k)/2,y:(doc.h-ih*k)/2,w:iw*k,h:ih*k};
  invalidate('material'); autosaveSoon(); req();
  toast(art==='fuellen'?'Material f\u00FCllt das Blatt':'Material eingepasst');
}
function drawMatFrame(g){
  if(!matEdit) return;
  var r=matRect(matEdit.l), s=8/view.scale;
  g.save();
  g.strokeStyle=TYPC.material; g.lineWidth=2/view.scale;
  g.setLineDash([9/view.scale,6/view.scale]);
  g.strokeRect(r.x,r.y,r.w,r.h);
  g.setLineDash([]);
  matHandles().forEach(function(h){
    g.fillStyle='#ffffff'; g.strokeStyle='#0a0a0a'; g.lineWidth=1.6/view.scale;
    g.fillRect(h.x-s,h.y-s,s*2,s*2); g.strokeRect(h.x-s,h.y-s,s*2,s*2);
  });
  g.restore();
}

function guideHandles(){
  var out=[];
  if(guide.rule==='persp'){
    var vp=ensureVp();
    out.push({id:'vp',x:vp.x,y:vp.y,nm:'Fluchtpunkt'});
  } else if(guide.rule==='ellipse'){
    var el=ensureEl();
    out.push({id:'ec',x:el.cx,y:el.cy,nm:'Mitte'},
             {id:'erx',x:el.cx+el.rx,y:el.cy,nm:'Breite'},
             {id:'ery',x:el.cx,y:el.cy+el.ry,nm:'Höhe'});
  } else if(guide.rule==='gerade'){
    var o=guideOrg();
    out.push({id:'go',x:o.x,y:o.y,nm:'Ursprung'},
             {id:'ga',x:o.x+Math.cos(guide.ang*Math.PI/180)*160,
                     y:o.y+Math.sin(guide.ang*Math.PI/180)*160,nm:'Winkel'});
  } else if(guide.rule==='winkel'){
    var ow=guideOrg();
    out.push({id:'go',x:ow.x,y:ow.y,nm:'Ursprung'});
  } else if(guide.mirror==='radial'||guide.mirror==='x'||guide.mirror==='xy'){
    var c=guideCenter();
    out.push({id:'mc',x:c.x,y:c.y,nm:'Spiegelmitte'});
  }
  return out;
}
function hitGuideHandle(pt){
  var r=18/view.scale, hs=guideHandles();
  for(var i=0;i<hs.length;i++)
    if(Math.hypot(hs[i].x-pt.x,hs[i].y-pt.y)<r) return hs[i];
  return null;
}
function drawGuideHandles(g){
  var hs=guideHandles();
  if(!hs.length) return;
  var s=7/view.scale;
  g.save();
  g.lineWidth=1.8/view.scale;
  hs.forEach(function(h){
    g.strokeStyle='#0a0a0a'; g.fillStyle=LENS[lens].c;
    g.beginPath(); g.arc(h.x,h.y,s,0,Math.PI*2); g.fill(); g.stroke();
    g.strokeStyle='#ffffffcc';
    g.beginPath(); g.arc(h.x,h.y,s+3/view.scale,0,Math.PI*2); g.stroke();
  });
  g.restore();
}
function moveGuideHandle(id,pt){
  if(id==='vp'){ guide.vp={x:pt.x,y:pt.y}; }
  else if(id==='ec'){ var e=ensureEl(); e.cx=pt.x; e.cy=pt.y; }
  else if(id==='erx'){ var e2=ensureEl(); e2.rx=Math.max(10,Math.abs(pt.x-e2.cx)); }
  else if(id==='ery'){ var e3=ensureEl(); e3.ry=Math.max(10,Math.abs(pt.y-e3.cy)); }
  else if(id==='go'){ guide.org={x:pt.x,y:pt.y}; }
  else if(id==='ga'){
    var o=guide.org||{x:doc.w*0.2,y:doc.h*0.5};
    guide.ang=Math.round(Math.atan2(pt.y-o.y,pt.x-o.x)*180/Math.PI);
  }
  else if(id==='mc'){ guide.mc={x:pt.x,y:pt.y}; }
  try{ localStorage.setItem('koslinse_guide',JSON.stringify(guide)); }catch(e){}
  renderBadges(); req();
}

/* ══════════════════════════════════════════════════════════════════════
   LAYOUT — Anschnitt, Raster, Textumbruch, Schriftwahl
   ══════════════════════════════════════════════════════════════════════ */
var FONTS=[
  {id:'archivo',nm:'Archivo',css:'"Archivo","Roboto Condensed",sans-serif',w:'700'},
  {id:'archivo400',nm:'Archivo mager',css:'"Archivo","Roboto",sans-serif',w:'400'},
  {id:'roboto',nm:'Roboto',css:'"Roboto",system-ui,sans-serif',w:'400'},
  {id:'robotoc',nm:'Roboto Condensed',css:'"Roboto Condensed","Roboto",sans-serif',w:'700'},
  {id:'mono',nm:'JetBrains Mono',css:'"JetBrains Mono",ui-monospace,monospace',w:'400'},
  {id:'aspal',nm:'Aspal',css:'"Aspal","Archivo",sans-serif',w:'400'},
  {id:'shadows',nm:'Shadows Into Light',css:'"Shadows Into Light Two",cursive',w:'400'}
];
function fontCss(e){
  var f=FONTS.filter(function(x){return x.id===(e.font||'archivo');})[0]||FONTS[0];
  return (e.weight||f.w)+' '+e.size+'px '+f.css;
}
/* Text im Rahmen umbrechen — Rückgabe: Zeilen */
function wrapText(g,e){
  var txt=String(e.text==null?'':e.text);
  if(e.wrap===false) return txt.split('\n');
  var maxW=Math.max(20,e.w);
  var tr=(e.track||0)*e.size*0.06;
  var out=[];
  txt.split('\n').forEach(function(para){
    var words=para.split(' '), line='';
    words.forEach(function(word){
      var probe=line?line+' '+word:word;
      var wpx=textWidth(g,probe,tr);
      if(wpx>maxW&&line){ out.push(line); line=word; }
      else line=probe;
    });
    out.push(line);
  });
  return out;
}
function textWidth(g,s,tr){
  var w=0;
  String(s).split('').forEach(function(ch){ w+=g.measureText(ch).width+tr; });
  return w;
}
function drawTextEl(g,e,col){
  g.fillStyle=col;
  g.font=fontCss(e);
  var tr=(e.track||0)*e.size*0.06;
  var lh=e.size*(e.lh||1.18);
  var lines=wrapText(g,e);
  lines.forEach(function(line,li){
    var cx=e.x;
    if(e.align==='center') cx=e.x+(e.w-textWidth(g,line,tr))/2;
    else if(e.align==='right') cx=e.x+e.w-textWidth(g,line,tr);
    var by=e.y+e.size*0.82+li*lh;
    String(line).split('').forEach(function(ch){
      g.fillText(ch,cx,by);
      cx+=g.measureText(ch).width+tr;
    });
  });
  if(e.autoH!==false) e.h=Math.max(e.size*1.1,lines.length*lh);
}
/* Anschnitt und Raster */
function drawSheetAids(g){
  var b=doc.bleed||0;
  if(b>0){
    g.save();
    g.strokeStyle='#d9262699'; g.lineWidth=1.4/view.scale;
    g.setLineDash([9/view.scale,7/view.scale]);
    g.strokeRect(b,b,doc.w-2*b,doc.h-2*b);
    g.setLineDash([]);
    var m=Math.min(40,b*1.6)/1;
    g.strokeStyle='#0a0a0acc'; g.lineWidth=1.2/view.scale;
    [[b,0,b,-m],[doc.w-b,0,doc.w-b,-m],[0,b,-m,b],[0,doc.h-b,-m,doc.h-b],
     [b,doc.h,b,doc.h+m],[doc.w-b,doc.h,doc.w-b,doc.h+m],
     [doc.w,b,doc.w+m,b],[doc.w,doc.h-b,doc.w+m,doc.h-b]].forEach(function(s){
      g.beginPath(); g.moveTo(s[0],s[1]); g.lineTo(s[2],s[3]); g.stroke();
    });
    g.restore();
  }
  var gr=doc.grid;
  if(gr&&gr.on&&gr.size>4){
    g.save();
    g.strokeStyle='#93a5ae2e'; g.lineWidth=1/view.scale;
    for(var x=gr.size;x<doc.w;x+=gr.size){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,doc.h); g.stroke(); }
    for(var y=gr.size;y<doc.h;y+=gr.size){ g.beginPath(); g.moveTo(0,y); g.lineTo(doc.w,y); g.stroke(); }
    g.strokeStyle='#93a5ae55';
    g.beginPath(); g.moveTo(doc.w/2,0); g.lineTo(doc.w/2,doc.h); g.stroke();
    g.beginPath(); g.moveTo(0,doc.h/2); g.lineTo(doc.w,doc.h/2); g.stroke();
    g.restore();
  }
}
function snapGrid(pt){
  var gr=doc.grid;
  if(!gr||!gr.on||!gr.snap||gr.size<4) return pt;
  return {x:Math.round(pt.x/gr.size)*gr.size, y:Math.round(pt.y/gr.size)*gr.size, p:pt.p};
}
</script>
<script>
'use strict';
/* ══════════ WERKZEUGRAD (Prototyp VII) ══════════
   Modi: folgend (erscheint, wo der Stift 0,5 s ruht; Berühren blendet aus)
         fest    (immer da; beim Zeichnen 30 % Deckkraft; Kern halten+ziehen)
         aus
   Stiftknopf = Radierer (Ausnahme — holt nie das Rad).
   Kern gedrückt halten fixiert (→ fest), antippen löst (→ folgend).
   Zwei Wertregler links/rechts. 5 Werkzeuge + Alle. Fächer bei erneutem
   Antippen des aktiven Werkzeugs. Doppeltipp = Fenster.                  */
var rad={
  mode:'folgend',            /* folgend | fest | aus */
  x:0,y:0, shown:false, open:false, fan:null, big:false,
  hoverT:0, hx:0, hy:0, lastTap:{t:0,id:''}
};
try{ var rm=localStorage.getItem('koslinse_radmode'); if(rm) rad.mode=rm; }catch(e){}
var radEl=$('rad');

var hintT=0;
function showHint(txt,ms){
  var el=$('hint');
  if(!el) return;
  if(txt) el.textContent=txt;
  el.classList.add('show');
  clearTimeout(hintT);
  hintT=setTimeout(function(){ el.classList.remove('show'); },ms||4500);
}
var RADHINT={
  folgend:'2 Finger tippen = zur\u00FCck \u00B7 3 = wieder vor \u00B7 Rad nach 0,3 s Ruhe',
  fest:'2 Finger tippen = zur\u00FCck \u00B7 3 = wieder vor \u00B7 Kern halten verschiebt das Rad',
  aus:'2 Finger tippen = zur\u00FCck \u00B7 3 = wieder vor \u00B7 Rad aus (Taste K)'
};
function setRadMode(m){
  rad.mode=m;
  showHint(RADHINT[m]||'');
  if(typeof syncViewBtn==='function') syncViewBtn();
  try{ localStorage.setItem('koslinse_radmode',m); }catch(e){}
  $('rmF').classList.toggle('on',m==='folgend');
  $('rmX').classList.toggle('on',m==='fest');
  $('rmO').classList.toggle('on',m==='aus');
  try{ localStorage.setItem('koslinse_radmode',m); }catch(e){}
  if(m==='aus'){ hideRad(); }
  else if(m==='fest'){ if(!rad.x){ centerRad(); } showRad(); }
  else { hideRad(); }
}
function centerRad(){
  /* Rechtshändig: das Rad liegt links unter der Zeichenhand, nicht darunter */
  var r=$('stagewrap').getBoundingClientRect();
  rad.x=Math.max(120,r.width*0.24);
  rad.y=Math.min(r.height-140,r.height*0.68);
}
function showRad(){ rad.shown=true; radRelayout(); }
function hideRad(){ rad.shown=false; rad.open=false; rad.fan=null; rad.big=false; radRelayout(); }

/* Ruhe-Erkennung (Stift schwebt oder Maus steht) */
function radOnHover(e){
  if(rad.mode!=='folgend'||drag||gest||touchMode) return;
  if(e.pointerType==='touch') return;
  var moved=Math.hypot(e.clientX-rad.hx,e.clientY-rad.hy)>6;
  if(moved){
    rad.hx=e.clientX; rad.hy=e.clientY;
    clearTimeout(rad.hoverT);
    if(!rad.shown){
      rad.hoverT=setTimeout(function(){
        var r=$('stagewrap').getBoundingClientRect();
        rad.x=rad.hx-r.left; rad.y=rad.hy-r.top;
        rad.open=true; showRad();
      },300);            /* 0,3 s — Rad kommt schneller nach dem Absetzen */
    }
  }
}
function radOnTouch(){ /* Berühren zeichnet — Rad ist sofort weg (folgend) bzw. dimmt (fest) */
  document.body.classList.add('zeichnet');
  clearTimeout(rad.hoverT);
  if(rad.mode==='folgend'){ if(rad.shown) hideRad(); }
  else if(rad.mode==='fest'){ radEl.classList.add('dim'); rad.open=false; rad.fan=null; rad.big=false; radRelayout(); }
}
stage.addEventListener('pointerup',function(){
  radEl.classList.remove('dim');
  document.body.classList.remove('zeichnet');
});
stage.addEventListener('pointercancel',function(){ document.body.classList.remove('zeichnet'); });

/* Tipp-Bindung: unabhängig davon, ob der Browser einen Klick nachliefert.
   Berührung, Stift und Maus lösen gleich zuverlässig aus.                */
function tapBind(el,fn){
  var st=null;
  el.addEventListener('pointerdown',function(e){
    e.stopPropagation(); e.preventDefault();
    st={x:e.clientX,y:e.clientY,t:Date.now()};
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
  });
  el.addEventListener('pointerup',function(e){
    e.stopPropagation(); e.preventDefault();
    if(!st) return;
    var moved=Math.hypot(e.clientX-st.x,e.clientY-st.y)>14;
    var s=st; st=null;
    if(!moved) fn(e,s);
  });
  el.addEventListener('pointercancel',function(){ st=null; });
  el.addEventListener('click',function(e){ e.stopPropagation(); e.preventDefault(); });
}

/* ══════════ AUFBAU ══════════ */
function radRelayout(){
  radEl.innerHTML='';
  radEl.classList.toggle('fixed',rad.mode==='fest');
  if(!rad.shown||rad.mode==='aus'){ radEl.style.display='none'; return; }
  radEl.style.display='';
  radEl.style.left=rad.x+'px'; radEl.style.top=rad.y+'px';
  /* Kern */
  var core=document.createElement('div');
  core.className='rk';
  core.innerHTML='<span>'+(TOOLDEF[tool()]||{}).g+'</span><span class="pin">&#128204;</span>';
  bindCore(core);
  radEl.appendChild(core);
  if(!rad.open) return;
  var R=86;
  if(!rad.big){
    /* 5 Werkzeuge (oben, r-oben, r-unten, l-unten, l-oben) */
    var defs=RING[lens];
    var angs=[-90,-30,30,150,210];
    defs.forEach(function(t,i){
      var a=angs[i]*Math.PI/180;
      radEl.appendChild(mkSat(t,Math.cos(a)*R,Math.sin(a)*R));
      if(t===tool()){
        var lb=document.createElement('div'); lb.className='rlbl';
        lb.style.left=Math.cos(a)*R+'px'; lb.style.top=(Math.sin(a)*R+32)+'px';
        lb.textContent=(TOOLDEF[t]||{}).nm;
        radEl.appendChild(lb);
      }
    });
  }
  /* Unterer Sektor ist in jeder Linse „Alle“ — und schließt den großen Ring wieder */
  var all=document.createElement('div');
  all.className='rs all'+(rad.big?' on':'');
  all.style.left='0px'; all.style.top=R+'px';
  all.textContent=rad.big?'Zu':'Alle';
  tapBind(all,function(){ rad.big=!rad.big; rad.fan=null; radRelayout(); });
  (function(){                       /* „Alle" lange drücken: Belegung ändern */
    var t=0;
    all.addEventListener('pointerdown',function(){
      clearTimeout(t);
      t=setTimeout(function(){ ringSel=0; openWin('winRing'); toast('Ringbelegung \u2014 Platz und Werkzeug w\u00E4hlen'); },600);
    });
    ['pointerup','pointercancel','pointerleave'].forEach(function(e){
      all.addEventListener(e,function(){ clearTimeout(t); });
    });
  })();
  radEl.appendChild(all);
  /* Regler links/rechts in der Lücke */
  radEl.appendChild(mkSlider('v1',-R*0.52,0));
  radEl.appendChild(mkSlider('v2',R*0.52,0));
  if(rad.fan) buildFan();
  if(rad.big) buildBig();
}
function mkSat(t,x,y,size){
  var el=document.createElement('div');
  var isCol=(t==='pick');
  var isAct=!!(TOOLDEF[t]&&TOOLDEF[t].act);
  el.className='rs'+(t===tool()&&!isAct?' on':'')+(isAct?' cmd':'');
  el.style.left=x+'px'; el.style.top=y+'px';
  if(size){ el.style.width=size+'px'; el.style.height=size+'px'; el.style.fontSize=Math.max(11,size*0.36)+'px'; }
  if(isCol){ el.style.background=color; el.style.borderColor='#0a0a0a55'; el.innerHTML='<span class="bnd" style="--c:'+color+'"></span>'; el.title='Farbe'; }
  else { el.textContent=(TOOLDEF[t]||{}).g; el.title=(TOOLDEF[t]||{}).nm; }
  (function(){                       /* Werkzeug im Ring lange drücken: diesen Platz neu belegen */
    var ht=0;
    el.addEventListener('pointerdown',function(){
      clearTimeout(ht);
      if(rad.big) return;
      ht=setTimeout(function(){
        var i=RING[lens].indexOf(t);
        if(i<0) return;
        ringSel=i; openWin('winRing');
        toast('Platz \u201E'+RING_SLOTS[i]+'\u201C \u2014 Werkzeug w\u00E4hlen');
      },600);
    });
    ['pointerup','pointercancel','pointerleave'].forEach(function(e){
      el.addEventListener(e,function(){ clearTimeout(ht); });
    });
  })();
  tapBind(el,function(){
    var now=Date.now();
    var dbl=(now-rad.lastTap.t<420&&rad.lastTap.id===t);
    rad.lastTap={t:now,id:t};
    if(dbl&&(t==='brush'||t==='pen'||t==='pick'||t==='curve')){ openToolWin(t); return; }
    if(isAct){ TOOLDEF[t].act(); rad.fan=null; rad.big=false; radRelayout(); return; }
    if(isCol){
      if(rad.fan==='color'){ rad.fan=null; } else { rad.fan='color'; rad.big=false; }
      radRelayout(); return;
    }
    if(t===tool()){ /* aktives Werkzeug nochmal: Fächer */
      var f=fanKind(t);
      rad.fan=(rad.fan===f)?null:f; rad.big=false; radRelayout(); return;
    }
    setTool(t); rad.fan=null; radRelayout();
  });
  return el;
}
function fanKind(t){
  if(t==='brush'||t==='pen') return 'tips';
  if(t==='ruler') return 'ruler';
  return null;
}
/* Regler: aufsetzen und senkrecht ziehen */
function mkSlider(key,x,y){
  var el=document.createElement('div');
  el.className='rr'; el.style.left=x+'px'; el.style.top=y+'px';
  var s=VALS[lens][key];
  var f=document.createElement('div'); f.className='fill';
  f.style.height=Math.round((s.val-s.min)/(s.max-s.min)*100)+'%';
  el.appendChild(f);
  el.title=s.nm;
  var st=null, valEl=null;
  el.addEventListener('pointerdown',function(e){
    e.stopPropagation(); e.preventDefault();
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    st={y:e.clientY,val:VALS[lens][key].val};
    valEl=document.createElement('div'); valEl.className='rval';
    valEl.style.left='0px'; valEl.style.top='-92px';
    radEl.appendChild(valEl); updV();
  });
  el.addEventListener('pointermove',function(e){
    if(!st) return;
    var sp=VALS[lens][key];
    var range=sp.max-sp.min;
    setVal(key,st.val+(st.y-e.clientY)*range/140);
    f.style.height=Math.round((sp.val-sp.min)/range*100)+'%';
    updV();
  });
  function updV(){ if(valEl) valEl.textContent=VALS[lens][key].nm+' '+fmtVal(VALS[lens][key]); }
  function done(){ st=null; if(valEl){ valEl.remove(); valEl=null; } autosaveSoon(); }
  el.addEventListener('pointerup',done);
  el.addEventListener('pointercancel',done);
  return el;
}
/* Kern: tippen = Ring auf/zu bzw. Fixierung lösen · halten = fixieren + ziehen */
function bindCore(core){
  var st=null,fixT=0;
  core.addEventListener('pointerdown',function(e){
    e.stopPropagation(); e.preventDefault();
    try{ core.setPointerCapture(e.pointerId); }catch(err){}
    st={x:e.clientX,y:e.clientY,ox:rad.x,oy:rad.y,moved:false,fixed:false};
    fixT=setTimeout(function(){
      if(!st) return;
      st.fixed=true;
      if(rad.mode!=='fest') setRadMode('fest');
      showRad();
      toast('Rad fixiert — ziehen zum Platzieren, antippen löst');
    },480);
  });
  core.addEventListener('pointermove',function(e){
    if(!st) return;
    var dx=e.clientX-st.x, dy=e.clientY-st.y;
    if(!st.moved&&Math.hypot(dx,dy)>7){ st.moved=true; clearTimeout(fixT); if(rad.mode!=='fest'){ setRadMode('fest'); } }
    if(st.moved||st.fixed){
      rad.x=st.ox+dx; rad.y=st.oy+dy;
      radEl.style.left=rad.x+'px'; radEl.style.top=rad.y+'px';
    }
  });
  core.addEventListener('pointerup',function(){
    clearTimeout(fixT);
    if(!st) return;
    var s=st; st=null;
    if(s.fixed||s.moved){ persistRad(); return; }
    if(rad.mode==='fest'&&!rad.open&&!rad.big&&!rad.fan){ rad.open=true; radRelayout(); return; }
    if(rad.mode==='fest'&&(rad.open||rad.big||rad.fan)){
      /* kurz antippen löst die Fixierung */
      setRadMode('folgend'); hideRad(); toast('Fixierung gelöst — Rad folgt dem Stift');
      return;
    }
    rad.open=!rad.open; rad.fan=null; rad.big=false; radRelayout();
  });
  core.addEventListener('pointercancel',function(){ clearTimeout(fixT); st=null; });
}
function persistRad(){ try{ localStorage.setItem('koslinse_radpos',JSON.stringify({x:rad.x,y:rad.y})); }catch(e){} }
try{ var rp=JSON.parse(localStorage.getItem('koslinse_radpos')||'null'); if(rp){ rad.x=rp.x; rad.y=rp.y; } }catch(e){}

/* ══════════ FÄCHER ══════════ */
function buildFan(){
  var items=[];
  if(rad.fan==='color'){
    var pinned=pinCols.slice(0,4);
    var rest=recentCols.filter(function(c){return pinned.indexOf(c)<0&&c!=='#111111'&&c!=='#ffffff';});
    var cols=pinned.concat(rest).slice(0,4).concat(['#111111','#ffffff']);
    items=cols.map(function(c){ return {kind:'col',v:c,pin:pinCols.indexOf(c)>=0}; });
  } else if(rad.fan==='tips'){
    var av=brushList(curWhich()).map(function(x){return x.id;});
    var pt2=pinTips.filter(function(t){return av.indexOf(t)>=0;}).slice(0,5);
    var rt=recentTips.filter(function(t){return pt2.indexOf(t)<0&&av.indexOf(t)>=0;});
    items=pt2.concat(rt,av).filter(function(v,i,a){return a.indexOf(v)===i;}).slice(0,3)
      .map(function(t){ return {kind:'tip',v:t,pin:pinTips.indexOf(t)>=0}; });
    items.push({kind:'dots'});
  } else if(rad.fan==='ruler'){
    items=[{kind:'rul',v:'Gerade',r:'gerade'},{kind:'rul',v:'Winkel',r:'winkel'},{kind:'rul',v:'Persp.',r:'persp'},{kind:'dots'}];
  } else return;
  var R=150, a0=-150, step=32;
  items.forEach(function(it,i){
    var a=(a0+i*step)*Math.PI/180;
    var el=document.createElement('div');
    el.className='fan'+(it.pin?'':'');
    el.style.left=Math.cos(a)*R+'px'; el.style.top=Math.sin(a)*R+'px';
    if(it.kind==='col'){ el.style.background=it.v; el.style.borderColor=it.v==='#ffffff'?'#999':it.v;
      if(it.v===color) el.classList.add('on');
      if(it.pin) el.innerHTML='<span class="pindot"></span>';
      tapBind(el,function(){ setColor(it.v); rad.fan=null; radRelayout(); });
    } else if(it.kind==='tip'){
      var bo=getBrush(it.v,curWhich());
      el.textContent=bo.name[0].toUpperCase();
      if(it.v===curBrush().id) el.classList.add('on');
      if(it.pin) el.innerHTML+='<span class="pindot"></span>';
      el.title=bo.name;
      tapBind(el,function(){ setBrush(it.v); rad.fan=null; radRelayout(); });
    } else if(it.kind==='rul'){
      el.textContent=it.v[0];
      el.title=it.v;
      if(guide.rule===it.r) el.classList.add('on');
      tapBind(el,function(){
        setGuide('rule',guide.rule===it.r?'aus':it.r);
        toast('Lineal: '+(guide.rule==='aus'?'aus':it.v));
        rad.fan=null; radRelayout();
      });
    } else { /* … = Fenster */
      el.classList.add('dots'); el.textContent='\u22EF'; el.title='Fenster öffnen';
      tapBind(el,function(){
        openToolWin(rad.fan==='tips'?(lens==='vektor'?'pen':'brush'):'ruler'); });
    }
    radEl.appendChild(el);
  });
}
function setTip(t){ if(typeof setBrush==='function') setBrush(t); else curTip=t; }

/* ══════════ GROSSER RING (Alle) — klappt an Ort und Stelle auf ══════════ */
/* Bildschirmrechteck des Blattes (dagegen wird gemessen, nicht gegen das Fenster) */
function sheetRect(){
  var ps=[{x:0,y:0},{x:doc.w,y:0},{x:doc.w,y:doc.h},{x:0,y:doc.h}].map(w2s);
  var xs=ps.map(function(p){return p.x;}), ys=ps.map(function(p){return p.y;});
  return {x0:Math.min.apply(null,xs),y0:Math.min.apply(null,ys),
          x1:Math.max.apply(null,xs),y1:Math.max.apply(null,ys)};
}
/* Großer Ring: im Uhrzeigersinn ab oben, Lücke zwischen den Gruppen,
   Radius und Zielgröße nach Anzahl, Beschriftungen versetzt.
   Klappt an Ort und Stelle auf und rückt nur ein, wenn er sonst
   über den Blattrand ragen würde.                                    */
function buildBig(){
  var groups=ALLTOOLS[lens], slots=[];
  groups.forEach(function(gr,gi){
    if(gi) slots.push(null);                 /* Lücke */
    gr[1].forEach(function(t){ slots.push({t:t,g:gi}); });
  });
  var n=slots.length;
  var step=360/n;                            /* 15–30° je nach Anzahl */
  var R=Math.round(clamp(52+n*7.0,120,240));
  var size=Math.round(clamp(46-n*0.45,34,44));
  var need=R+size/2+34;
  var sr=sheetRect(), vp=$('stagewrap').getBoundingClientRect();
  var bx0=sr.x0,by0=sr.y0,bx1=sr.x1,by1=sr.y1;
  if(bx1-bx0<2*need||by1-by0<2*need){ bx0=0; by0=0; bx1=vp.width; by1=vp.height; }
  var cx=clamp(rad.x,bx0+need,bx1-need);
  var cy=clamp(rad.y,by0+need,by1-need);
  rad.x=cx; rad.y=cy;
  radEl.style.left=cx+'px'; radEl.style.top=cy+'px';
  var lastG=-1;
  slots.forEach(function(f,i){
    if(!f) return;
    var a=(-90+i*step)*Math.PI/180;
    radEl.appendChild(mkSat(f.t,Math.cos(a)*R,Math.sin(a)*R,size));
    var lr=R+(i%2?38:22);                    /* versetzt, damit lange Namen nicht überlagern */
    var lb=document.createElement('div');
    lb.className='rlbl';
    lb.style.left=Math.cos(a)*lr+'px';
    lb.style.top=Math.sin(a)*lr+'px';
    lb.textContent=(TOOLDEF[f.t]||{}).nm;
    radEl.appendChild(lb);
    if(f.g!==lastG){                          /* Gruppenname am Anfang jeder Gruppe */
      lastG=f.g;
      var gl=document.createElement('div');
      gl.className='rlbl grp';
      gl.style.left=Math.cos(a-step*0.5*Math.PI/180)*(R+62)+'px';
      gl.style.top=Math.sin(a-step*0.5*Math.PI/180)*(R+62)+'px';
      gl.textContent=groups[f.g][0].toUpperCase();
      radEl.appendChild(gl);
    }
  });
}

/* ══════════════════════════════════════════════════════════════════
   FENSTER — frei beweglich, skalierbar, feststellbar, rollbar.
   Lage, Größe und Feststellung bleiben je Fenster gespeichert.
   ══════════════════════════════════════════════════════════════════ */
var WINS=['winColor','winBrush','winRuler','uebmenu','winfile','winText','winLayer','winRing','winSheet','winHist'];
var WINTITLE={winColor:'FARBE',winBrush:'PINSEL',winRuler:'HILFSLINIEN',uebmenu:'\u00DCBERGABE',
              winfile:'DATEI',winText:'ELEMENT',winLayer:'EBENE',winRing:'RINGBELEGUNG',
              winSheet:'BLATT',winHist:'ZUR\u00DCCK'};
var winGeo={};
try{ winGeo=JSON.parse(localStorage.getItem('koslinse_wins')||'{}')||{}; }catch(e){ winGeo={}; }
function saveWinGeo(){ try{ localStorage.setItem('koslinse_wins',JSON.stringify(winGeo)); }catch(e){} }
function isPinned(id){ return !!(winGeo[id]&&winGeo[id].pin); }
/* Inhalt in einen rollbaren Rumpf setzen und Leiste + Griff ergänzen.
   Die Knoten werden verschoben, nicht neu erzeugt — Ereignisse bleiben. */
function dressWin(id){
  var w=$(id);
  if(!w) return;
  var body=document.createElement('div');
  body.className='winbody';
  while(w.firstChild) body.appendChild(w.firstChild);
  var bar=document.createElement('div');
  bar.className='winbar';
  var t=document.createElement('span');
  t.className='wt'; t.textContent=WINTITLE[id]||'FENSTER';
  var pin=document.createElement('button');
  pin.innerHTML='\u{1F4CC}';
  pin.title='Fenster festhalten \u2014 bleibt offen, bis du es schlie\u00DFt';
  if(isPinned(id)) pin.classList.add('on');
  var cl=document.createElement('button');
  cl.innerHTML='\u2715'; cl.title='Schlie\u00DFen';
  bar.appendChild(t); bar.appendChild(pin); bar.appendChild(cl);
  var grip=document.createElement('div');
  grip.className='wgrip'; grip.title='Gr\u00F6\u00DFe \u00E4ndern';
  w.appendChild(bar); w.appendChild(body); w.appendChild(grip);
  w.classList.toggle('pinned',isPinned(id));
  pin.addEventListener('pointerdown',function(e){ e.stopPropagation(); });
  pin.addEventListener('click',function(e){
    e.stopPropagation();
    winGeo[id]=winGeo[id]||{};
    winGeo[id].pin=!winGeo[id].pin;
    saveWinGeo();
    pin.classList.toggle('on',winGeo[id].pin);
    w.classList.toggle('pinned',winGeo[id].pin);
    toast(winGeo[id].pin?'Fenster festgehalten':'Fenster wieder frei');
  });
  cl.addEventListener('pointerdown',function(e){ e.stopPropagation(); });
  cl.addEventListener('click',function(e){ e.stopPropagation(); w.classList.remove('show'); });
  dragWin(w,bar,id);
  sizeWin(w,grip,id);
  applyWinGeo(id);
}
function winArea(){
  var r=$('stagewrap').getBoundingClientRect();
  return {w:r.width||900,h:r.height||600};
}
function applyWinGeo(id){
  var w=$(id), g=winGeo[id];
  if(!w) return;
  var a=winArea();
  w.style.transform='none';
  if(g&&typeof g.x==='number'){
    w.style.width=(g.w||270)+'px';
    if(g.h) w.style.height=g.h+'px';
    w.style.left=clamp(g.x,0,Math.max(0,a.w-90))+'px';
    w.style.top=clamp(g.y,0,Math.max(0,a.h-60))+'px';
    w.style.right='auto'; w.style.bottom='auto';
    return;
  }
  var wd=w.offsetWidth||270;
  w.style.left=Math.max(8,(a.w-wd)/2)+'px';
  w.style.top='58px';
  w.style.right='auto';
}
function rememberWin(id){
  var w=$(id);
  winGeo[id]=winGeo[id]||{};
  winGeo[id].x=parseFloat(w.style.left)||0;
  winGeo[id].y=parseFloat(w.style.top)||0;
  winGeo[id].w=parseFloat(w.style.width)||w.offsetWidth||270;
  winGeo[id].h=parseFloat(w.style.height)||w.offsetHeight||0;
  saveWinGeo();
}
function dragWin(w,handle,id){
  var st=null;
  handle.addEventListener('pointerdown',function(e){
    if(e.target.tagName==='BUTTON') return;
    e.preventDefault(); e.stopPropagation();
    try{ handle.setPointerCapture(e.pointerId); }catch(err){}
    st={x:e.clientX,y:e.clientY,l:parseFloat(w.style.left)||0,t:parseFloat(w.style.top)||0};
    w.style.transform='none';
  });
  handle.addEventListener('pointermove',function(e){
    if(!st) return;
    e.preventDefault();
    var a=winArea();
    w.style.left=clamp(st.l+(e.clientX-st.x),-w.offsetWidth+80,a.w-70)+'px';
    w.style.top=clamp(st.t+(e.clientY-st.y),0,a.h-44)+'px';
  });
  ['pointerup','pointercancel'].forEach(function(evn){
    handle.addEventListener(evn,function(){ if(st){ st=null; rememberWin(id); } });
  });
}
function sizeWin(w,grip,id){
  var st=null;
  grip.addEventListener('pointerdown',function(e){
    e.preventDefault(); e.stopPropagation();
    try{ grip.setPointerCapture(e.pointerId); }catch(err){}
    st={x:e.clientX,y:e.clientY,
        w:parseFloat(w.style.width)||w.offsetWidth||270,
        h:parseFloat(w.style.height)||w.offsetHeight||320};
  });
  grip.addEventListener('pointermove',function(e){
    if(!st) return;
    e.preventDefault();
    var a=winArea();
    w.style.width=clamp(st.w+(e.clientX-st.x),210,Math.max(240,a.w-20))+'px';
    w.style.height=clamp(st.h+(e.clientY-st.y),140,Math.max(180,a.h-20))+'px';
    w.style.maxHeight='none';
  });
  ['pointerup','pointercancel'].forEach(function(evn){
    grip.addEventListener(evn,function(){ if(st){ st=null; rememberWin(id); } });
  });
}
function openWin(id){
  closeWins();
  var el=$(id);
  if(id==='winColor') buildColorWin();
  else if(id==='winBrush') buildBrushWin();
  else if(id==='winRuler') buildRulerWin();
  else if(id==='winRing') buildRingWin();
  else if(id==='winSheet') buildSheetWin();
  else if(id==='winHist') buildHistWin();
  else if(!el.querySelector('.winbar')) dressWin(id);
  el.classList.add('show');
  applyWinGeo(id);
  rad.fan=null; rad.big=false; radRelayout();
}
/* schließt nur, was nicht festgehalten ist */
function closeWins(force){
  WINS.forEach(function(w){
    if(!force&&isPinned(w)) return;
    $(w).classList.remove('show');
  });
}
function openToolWin(t){
  if(t==='pick') openWin('winColor');
  else if(t==='brush'||t==='pen'||t==='curve') openWin('winBrush');
  else if(t==='ruler') openWin('winRuler');
}
function buildColorWin(){ buildColorPanel(); }
function buildBrushWin(){ buildBrushPanel(); }
function buildBrushWinAlt(){
  var w=$('winBrush');
  var html='<button class="wx" data-close="winBrush">\u2715</button><h5>SPITZE \u00B7 '+(lens==='vektor'?'PROFIL':'PINSEL')+'</h5><div class="tiprow">';
  TIPS.forEach(function(t){
    var inFan=pinTips.concat(recentTips).slice(0,3).indexOf(t.id)>=0;
    html+='<div class="tip'+(t.id===curTip?' on':'')+(inFan?' infan':'')+'" data-tip="'+t.id+'">'
        +'<canvas width="240" height="44" data-prev="'+t.id+'"></canvas><span class="nm">'+t.nm+'</span>'
        +'<span class="st'+(pinTips.indexOf(t.id)>=0?' on':'')+'" data-pintip="'+t.id+'">\u2605</span></div>';
  });
  html+='</div>';
  w.innerHTML=html;
  w.querySelectorAll('[data-prev]').forEach(function(cv){ drawTipPreview(cv); });
  w.querySelectorAll('[data-tip]').forEach(function(el){
    el.addEventListener('click',function(e){
      if(e.target.dataset.pintip) return;
      setTip(el.dataset.tip); buildBrushWin();
    });
  });
  w.querySelectorAll('[data-pintip]').forEach(function(el){
    el.addEventListener('click',function(e){
      e.stopPropagation();
      var t=el.dataset.pintip, i=pinTips.indexOf(t);
      if(i>=0) pinTips.splice(i,1);
      else if(pinTips.length>=5){ toast('F\u00E4cher voll \u2014 erst ein anderes <b>Sternchen l\u00F6sen</b>'); return; }
      else pinTips.push(t);
      buildBrushWin();
    });
  });
  wireClose(w);
}
function drawTipPreview(cv){
  var g=cv.getContext('2d'); if(!g) return;
  g.clearRect(0,0,cv.width,cv.height);
  g.strokeStyle=color; g.lineCap='round';
  var id=cv.dataset.prev;
  for(var x=8;x<cv.width-8;x+=3){
    var t=(x-8)/(cv.width-16);
    var wgt={tinte:6+10*Math.sin(t*Math.PI),weich:12,marker:14,airbrush:16,kohle:10,aquarell:14,kreide:9,punkt:5}[id]||8;
    g.globalAlpha={airbrush:0.25,aquarell:0.3,kreide:0.6}[id]||0.9;
    g.lineWidth=wgt*0.5;
    g.beginPath(); g.moveTo(x,22+Math.sin(t*6)*8); g.lineTo(x+3,22+Math.sin((t+0.02)*6)*8); g.stroke();
  }
  g.globalAlpha=1;
}
function buildRulerWin(){
  var w=$('winRuler');
  function grp(items,cur,key){
    return '<div class="frow">'+items.map(function(it){
      return '<button class="hbtn'+(cur===it[0]?' on':'')+'" data-set="'+key+'" data-v="'+it[0]+'"'

    }).join('')+'</div>';
  }
  var html='<button class="wx" data-close="winRuler">\u2715</button>'
    +'<h5>LINEAL</h5>'
    +grp([['aus','Aus'],['gerade','Gerade'],['winkel','Winkel'],['persp','Persp.']],guide.rule,'rule')
    +'<h5>WINKEL DER GERADEN</h5>'
    +grp([[0,'0\u00B0'],[15,'15\u00B0'],[30,'30\u00B0'],[45,'45\u00B0'],[90,'90\u00B0']],guide.ang,'ang')
    +'<h5>SCHABLONE</h5>'
    +grp([['ellipse','Ellipse'],['kreis','Kreis']],guide.rule,'rule')
    +'<h5>SPIEGEL</h5>'
    +grp([['aus','Aus'],['x','Achse 1'],['xy','Achse 2'],['radial','Radial']],guide.mirror,'mirror')
    +'<h5>RADIALACHSEN</h5>'
    +grp([[4,'4'],[6,'6'],[8,'8'],[12,'12']],guide.axes,'axes')
    +'<div class="mono" style="font-size:11px;color:var(--tx3);margin-top:9px">Wirkt in Pixel und Pfaden. Gespiegelte Striche entstehen mit.</div>';
  w.innerHTML=html;
  w.querySelectorAll('[data-set]').forEach(function(b){
    b.addEventListener('click',function(){
      var k=b.dataset.set, v=b.dataset.v;
      setGuide(k,(k==='ang'||k==='axes')?Number(v):v);
      buildRulerWin();
      toast(k==='mirror'?('Spiegel: '+b.textContent):('Lineal: '+b.textContent));
    });
  });
  wireClose(w);
  dressWin('winRuler');
}
/* ══════════ RINGBELEGUNG ÄNDERN ══════════
   Platz antippen, dann Werkzeug wählen. Bereits belegte Werkzeuge
   tauschen den Platz, statt doppelt zu erscheinen.                 */
var ringSel=0;
function buildRingWin(){
  var w=$('winRing'), k=lens;
  var alle=[];
  ALLTOOLS[k].forEach(function(g){ g[1].forEach(function(t){ if(alle.indexOf(t)<0) alle.push(t); }); });
  RING[k].forEach(function(t){ if(alle.indexOf(t)<0) alle.push(t); });
  var angs=[-90,-30,30,150,210], R=72;
  var html='<h5>RINGBELEGUNG \u00B7 '+LENS[k].nm+'</h5>'
    +'<div class="ringmap"><div class="mid"></div>';
  RING[k].forEach(function(t,i){
    var a=angs[i]*Math.PI/180;
    var d=TOOLDEF[t]||{};
    html+='<div class="rslot'+(ringSel===i?' sel':'')+'" data-slot="'+i+'"'
      +' style="left:'+(50+Math.cos(a)*R/2.1)+'%;top:'+(50+Math.sin(a)*R/1.5)+'%">'
      +'<span>'+(d.g||'?')+'</span><span class="sn">'+RING_SLOTS[i]+'</span></div>';
  });
  html+='<div class="rslot allsl" style="left:50%;top:'+(50+R/1.5)+'%">Alle</div></div>'
    +'<h5>WERKZEUG F\u00DCR \u201E'+RING_SLOTS[ringSel].toUpperCase()+'\u201C</h5>'
    +'<div class="rpick">'
    +alle.map(function(t){
      var d=TOOLDEF[t]||{}, used=RING[k].indexOf(t);
      return '<div class="rt'+(RING[k][ringSel]===t?' on':'')+(used>=0&&used!==ringSel?' used':'')
        +'" data-tool="'+t+'" title="'+(d.nm||t)+(used>=0&&used!==ringSel?' \u2014 liegt auf \u201E'+RING_SLOTS[used]+'\u201C, wird getauscht':'')+'">'+(d.g||'?')+'</div>';
    }).join('')
    +'</div>'
    +'<div class="mono" style="font-size:11px;color:var(--tx3);margin-top:8px">'
    +'Der untere Sektor ist in jeder Linse <b>Alle</b> \u2014 diese Richtung bleibt fest. '
    +'Jede Linse hat ihre eigene Belegung.</div>'
    +'<div class="frow"><button class="hbtn" id="ringReset">Vorgabe wiederherstellen</button></div>';
  w.innerHTML=html;
  w.querySelectorAll('[data-slot]').forEach(function(el){
    el.addEventListener('click',function(){ ringSel=Number(el.dataset.slot); buildRingWin(); });
  });
  w.querySelectorAll('[data-tool]').forEach(function(el){
    el.addEventListener('click',function(){
      var t=el.dataset.tool;
      var was=RING[k].indexOf(t);
      setRingSlot(k,ringSel,t);
      buildRingWin();
      toast(was>=0&&was!==ringSel
        ? 'Pl\u00E4tze getauscht: '+RING_SLOTS[ringSel]+' \u2194 '+RING_SLOTS[was]
        : (TOOLDEF[t].nm+' liegt jetzt auf \u201E'+RING_SLOTS[ringSel]+'\u201C'));
    });
  });
  $('ringReset').addEventListener('click',function(){
    resetRing(k); buildRingWin(); toast('Vorgabe wiederhergestellt');
  });
  dressWin('winRing');
  applyWinGeo('winRing');
}
function wireClose(w){
  var x=w.querySelector('.wx');
  if(x) x.addEventListener('click',function(){ w.classList.remove('show'); });
}
</script>
<script>
'use strict';
/* ══════════════════════════════════════════════════════════════════════
   RETUSCHE & VERLAUF (Wischfinger, Weichzeichnen, Aufhellen, Abdunkeln)
   Weiche runde Marke mit Abstand entlang der Bahn statt eines Rasters —
   der Wischfinger nimmt Farbe auf und trägt sie weiter (Farbtopf).
   ══════════════════════════════════════════════════════════════════════ */
var fxPot=null, fxPotSide=0, fxPotReady=false;

function fxStart(l,pt,pres){
  var rad=fxRadius(pres);
  fxPotSide=Math.max(3,Math.ceil(rad*2)+1);
  fxPot=new Float32Array(fxPotSide*fxPotSide*4);
  fxPotReady=false;
}
function fxRadius(pres){
  return Math.max(2,VALS.draw.v1.val*(0.35+0.65*(pres==null?1:pres))/2);
}
/* Marke an einer Stelle — weicher Rand, kein Kastenrand mehr */
function fxDab(l,pt,pres){
  var fx=(drag&&drag.fx)||'smudge';
  var g=l.data.cv.getContext('2d');
  var rad=fxRadius(pres);
  var side=Math.max(3,Math.ceil(rad*2)+1);
  var ox=Math.round(pt.x-side/2), oy=Math.round(pt.y-side/2);
  var sx=Math.max(0,ox), sy=Math.max(0,oy);
  var ex=Math.min(doc.w,ox+side), ey=Math.min(doc.h,oy+side);
  var w=ex-sx, h=ey-sy;
  if(w<1||h<1) return;
  if(!selEmpty()){                                   /* außerhalb der Auswahl nichts tun */
    if(ex<=sel.x||sx>=sel.x+sel.w||ey<=sel.y||sy>=sel.y+sel.h) return;
  }
  var img;
  try{ img=g.getImageData(sx,sy,w,h); }catch(e){ return; }
  var d=img.data;
  var selL=selEmpty()?null:sel;
  var str=clamp(VALS.draw.v2.val/100,0.02,1);
  var hard=0.55;
  if(fx==='oil'||fx==='wc'){
    /* Nass in nass: der Pinsel trägt Pigment auf und nimmt zugleich auf.
       Wasser verdünnt, Pigment deckt — beides aus der Spitze.            */
    var bo=(brushRun&&brushRun.b)||{};
    var pig=(bo.pig==null?1:bo.pig);
    var wat=(fx==='wc')?(bo.water==null?0.6:bo.water):0.12;
    var col=hexToRgb(color)||{r:0,g:0,b:0};
    if(!fxPot||fxPotSide!==side){ fxPot=new Float32Array(side*side*4); fxPotSide=side; fxPotReady=false; }
    var potW=fxPot, aufn=clamp(0.10+0.35*wat,0.05,0.45);
    for(var wy=0;wy<h;wy++) for(var wx=0;wx<w;wx++){
      var wpx=sx+wx, wpy=sy+wy;
      if(selL&&(wpx<selL.x||wpx>=selL.x+selL.w||wpy<selL.y||wpy>=selL.y+selL.h)) continue;
      var wdx=(wpx+0.5)-pt.x, wdy=(wpy+0.5)-pt.y;
      var wdist=Math.hypot(wdx,wdy)/rad;
      if(wdist>1) continue;
      var wf=Math.pow(1-wdist,1+2*hard)*str;
      var wi=(wy*w+wx)*4;
      var wbi=((wpy-oy)*side+(wpx-ox))*4;
      if(wbi<0||wbi+3>=potW.length) continue;
      var wa=d[wi+3]/255;
      var pr0=d[wi]*wa, pg0=d[wi+1]*wa, pb0=d[wi+2]*wa, pa0=d[wi+3];
      if(!fxPotReady){ potW[wbi]=pr0; potW[wbi+1]=pg0; potW[wbi+2]=pb0; potW[wbi+3]=pa0; }
      /* Pinselfarbe = frisches Pigment, gemischt mit dem, was er trägt */
      var mr=col.r*pig+potW[wbi]*(1-pig);
      var mg=col.g*pig+potW[wbi+1]*(1-pig);
      var mb=col.b*pig+potW[wbi+2]*(1-pig);
      var deck=wf*(1-wat*0.55);
      var nr2=pr0+(mr-pr0)*deck;
      var ng2=pg0+(mg-pg0)*deck;
      var nb2=pb0+(mb-pb0)*deck;
      var na2=pa0+(255-pa0)*deck;
      potW[wbi]  +=(pr0-potW[wbi])*aufn*wf;
      potW[wbi+1]+=(pg0-potW[wbi+1])*aufn*wf;
      potW[wbi+2]+=(pb0-potW[wbi+2])*aufn*wf;
      potW[wbi+3]+=(pa0-potW[wbi+3])*aufn*wf;
      var an2=na2/255;
      d[wi]  =an2>0.002?Math.round(nr2/an2):0;
      d[wi+1]=an2>0.002?Math.round(ng2/an2):0;
      d[wi+2]=an2>0.002?Math.round(nb2/an2):0;
      d[wi+3]=Math.round(clamp(na2,0,255));
    }
    fxPotReady=true;
  } else if(fx==='smudge'){
    if(!fxPot||fxPotSide!==side){ fxPot=new Float32Array(side*side*4); fxPotSide=side; fxPotReady=false; }
    /* Aufnahme bewusst träge: der Topf trägt die Farbe über eine längere
       Strecke mit — sonst ist sie nach wenigen Marken schon verbraucht.
       Bei kräftigem Wischen (hohe Deckkraft) hält er sie noch länger.    */
    var pot=fxPot, pick=clamp(0.16*(1-str*0.55),0.05,0.16);
    for(var y=0;y<h;y++) for(var x=0;x<w;x++){
      var px=sx+x, py=sy+y;
      if(selL&&(px<selL.x||px>=selL.x+selL.w||py<selL.y||py>=selL.y+selL.h)) continue;
      var dx=(px+0.5)-pt.x, dy=(py+0.5)-pt.y;
      var dist=Math.hypot(dx,dy)/rad;
      if(dist>1) continue;
      var fall=Math.pow(1-dist,1+2*hard);
      var wgt=fall*str;
      var i=(y*w+x)*4;
      var bi=((py-oy)*side+(px-ox))*4;
      if(bi<0||bi+3>=pot.length) continue;
      /* mit Alpha vorgewichtet rechnen: keine dunklen Ränder */
      var a=d[i+3]/255;
      var r0=d[i]*a, g0=d[i+1]*a, b0=d[i+2]*a, a0=d[i+3];
      if(!fxPotReady){ pot[bi]=r0; pot[bi+1]=g0; pot[bi+2]=b0; pot[bi+3]=a0; continue; }
      var nr=r0+(pot[bi]-r0)*wgt;
      var ng=g0+(pot[bi+1]-g0)*wgt;
      var nb=b0+(pot[bi+2]-b0)*wgt;
      var na=a0+(pot[bi+3]-a0)*wgt;
      pot[bi]  +=(r0-pot[bi])*pick*wgt;                 /* Farbe aufnehmen */
      pot[bi+1]+=(g0-pot[bi+1])*pick*wgt;
      pot[bi+2]+=(b0-pot[bi+2])*pick*wgt;
      pot[bi+3]+=(a0-pot[bi+3])*pick*wgt;
      var an=na/255;
      d[i]  =an>0.002?Math.round(nr/an):0;
      d[i+1]=an>0.002?Math.round(ng/an):0;
      d[i+2]=an>0.002?Math.round(nb/an):0;
      d[i+3]=Math.round(clamp(na,0,255));
    }
    fxPotReady=true;
  } else if(fx==='blur'){
    var src=new Uint8ClampedArray(d);
    for(var y2=1;y2<h-1;y2++) for(var x2=1;x2<w-1;x2++){
      var px2=sx+x2, py2=sy+y2;
      var ddx=(px2+0.5)-pt.x, ddy=(py2+0.5)-pt.y;
      var dd=Math.hypot(ddx,ddy)/rad;
      if(dd>1) continue;
      var wg=Math.pow(1-dd,1+2*hard)*str;
      var i2=(y2*w+x2)*4;
      for(var c=0;c<4;c++){
        var avg=(src[i2+c]*2+src[i2-4+c]+src[i2+4+c]+src[i2-w*4+c]+src[i2+w*4+c])/6;
        d[i2+c]=src[i2+c]+(avg-src[i2+c])*wg;
      }
    }
  } else {                                   /* aufhellen / abdunkeln */
    var f=(fx==='dodge'?1:-1)*str*48;
    for(var y3=0;y3<h;y3++) for(var x3=0;x3<w;x3++){
      var px3=sx+x3, py3=sy+y3;
      var e1=(px3+0.5)-pt.x, e2=(py3+0.5)-pt.y;
      var e3=Math.hypot(e1,e2)/rad;
      if(e3>1) continue;
      var wg3=Math.pow(1-e3,1+2*hard);
      var i3=(y3*w+x3)*4;
      if(!d[i3+3]) continue;
      d[i3]  =clamp(d[i3]  +f*wg3,0,255);
      d[i3+1]=clamp(d[i3+1]+f*wg3,0,255);
      d[i3+2]=clamp(d[i3+2]+f*wg3,0,255);
    }
  }
  g.putImageData(img,sx,sy);
  fxMark(sx,sy,w,h);
}
/* Marken dicht an dicht entlang der Bahn: keine Lücken bei schneller Hand */
function fxRun(l,a,b,pres){
  var rad=fxRadius(pres);
  var step=Math.max(1,rad*0.22);
  var dist=Math.hypot(b.x-a.x,b.y-a.y);
  var n=Math.max(1,Math.ceil(dist/step));
  for(var i=1;i<=n;i++){
    fxDab(l,{x:a.x+(b.x-a.x)*i/n, y:a.y+(b.y-a.y)*i/n},pres);
  }
}
function fxMark(x,y,w,h){
  if(!drag) return;
  var bb=drag.bb;
  if(!bb) drag.bb={x0:x,y0:y,x1:x+w,y1:y+h};
  else {
    bb.x0=Math.min(bb.x0,x); bb.y0=Math.min(bb.y0,y);
    bb.x1=Math.max(bb.x1,x+w); bb.y1=Math.max(bb.y1,y+h);
  }
}

/* ══════════════════════════════════════════════════════════════════════
   ZURÜCK / WIEDERHOLEN
   Pixel: nur der veränderte Ausschnitt wird gesichert (wie Draw v29).
   Pfade, Layout, Stapel: knappe Abbilder als JSON.
   ══════════════════════════════════════════════════════════════════════ */
var undoStack=[], redoStack=[], undoBytes=0;
var UNDO_MAX=40, UNDO_BUDGET=140e6;
var preCv=null, preCx=null;                 /* Abzug der Ebene vor dem Strich */
function entryBytes(e){
  if(e.t==='pixels') return e.w*e.h*4;
  return 4000;
}
function trimUndo(){
  while(undoStack.length>UNDO_MAX||undoBytes>UNDO_BUDGET){
    var o=undoStack.shift();
    if(!o) break;
    undoBytes-=entryBytes(o);
  }
}
var undoLabelNext='';
function pushUndo(e){
  if(undoLabelNext){ e.label=undoLabelNext; undoLabelNext=''; }
  undoStack.push(e);
  undoBytes+=entryBytes(e);
  redoStack.length=0;
  trimUndo();
}
/* Abzug der Ebene anlegen, bevor ein Pixelstrich beginnt */
function preSnap(l){
  if(!preCv||preCv.width!==doc.w||preCv.height!==doc.h){
    preCv=document.createElement('canvas');
    preCv.width=doc.w; preCv.height=doc.h;
    preCx=preCv.getContext('2d');
  }
  preCx.setTransform(1,0,0,1,0,0);
  preCx.clearRect(0,0,doc.w,doc.h);
  preCx.drawImage(l.data.cv,0,0);
}
/* Ausschnitt aus dem Abzug sichern */
function pushPixelUndo(l,bb){
  if(!bb||!preCx) return;
  var x=clamp(Math.floor(bb.x0)-2,0,doc.w-1), y=clamp(Math.floor(bb.y0)-2,0,doc.h-1);
  var w=clamp(Math.ceil(bb.x1-bb.x0)+4,1,doc.w-x), h=clamp(Math.ceil(bb.y1-bb.y0)+4,1,doc.h-y);
  try{
    pushUndo({t:'pixels',layerId:l.id,x:x,y:y,w:w,h:h,data:preCx.getImageData(x,y,w,h)});
  }catch(e){}
}
function snapLayer(l,label){
  if(!l) return;
  if(label) undoLabelNext=label;
  if(l.typ==='pfade') pushUndo({t:'paths',layerId:l.id,data:JSON.stringify(l.data.paths)});
  else if(l.typ==='layout') pushUndo({t:'els',layerId:l.id,data:JSON.stringify(l.data.els,function(k,v){return k==='img'?undefined:v;})});
  else if(l.typ==='pixel'){
    preSnap(l);
    pushPixelUndo(l,{x0:0,y0:0,x1:doc.w,y1:doc.h});
  }
}
function snapStack(label){
  if(label) undoLabelNext=label;
  pushUndo({t:'stack',order:doc.stack.slice(),active:JSON.stringify(activeByLens),
            groups:JSON.stringify(doc.groups||[])});
}
function applyEntry(e){
  var back=null;
  if(e.t==='pixels'){
    var l=layerById(e.layerId);
    if(!l||l.typ!=='pixel') return null;
    var g=l.data.cv.getContext('2d');
    try{
      back={t:'pixels',layerId:e.layerId,x:e.x,y:e.y,w:e.w,h:e.h,data:g.getImageData(e.x,e.y,e.w,e.h)};
      g.putImageData(e.data,e.x,e.y);
    }catch(err){ return null; }
    invalidate('pixel');
  } else if(e.t==='paths'){
    var l2=layerById(e.layerId);
    if(!l2) return null;
    back={t:'paths',layerId:e.layerId,data:JSON.stringify(l2.data.paths)};
    l2.data.paths=JSON.parse(e.data);
    invalidate('pfade');
  } else if(e.t==='els'){
    var l3=layerById(e.layerId);
    if(!l3) return null;
    back={t:'els',layerId:e.layerId,data:JSON.stringify(l3.data.els,function(k,v){return k==='img'?undefined:v;})};
    l3.data.els=JSON.parse(e.data);
    invalidate('layout');
  } else if(e.t==='stack'){
    back={t:'stack',order:doc.stack.slice(),active:JSON.stringify(activeByLens),
          groups:JSON.stringify(doc.groups||[])};
    doc.stack=e.order.slice();
    if(e.groups){ try{ doc.groups=JSON.parse(e.groups); }catch(err){} }
    try{ var a=JSON.parse(e.active); Object.keys(a).forEach(function(k){ activeByLens[k]=a[k]; }); }catch(err){}
    ['pixel','pfade','layout'].forEach(invalidate);
  }
  overlaySel=null;
  if(e.t==='pixels'&&typeof sel!=='undefined'&&sel&&sel.mask===null&&!sel.poly){ /* Rechteck darf bleiben */ }
  return back;
}
function doUndo(quiet){
  if(drag){ if(!quiet) toast('Erst den Strich beenden'); return; }
  if(typeof discardFloat==='function') discardFloat();   /* Schwebendes verwerfen, nicht absetzen */
  var e=undoStack.pop();
  if(!e){ if(!quiet) toast('Nichts r\u00FCckg\u00E4ngig zu machen'); return; }
  undoBytes-=entryBytes(e);
  var back=applyEntry(e);
  if(back){ back.label=e.label; redoStack.push(back); }
  renderStack(); autosaveSoon(); req();
  if(!quiet) toast('Zur\u00FCck: '+undoLabel(e));
}
function doRedo(quiet){
  if(drag) return;
  if(typeof discardFloat==='function') discardFloat();
  var e=redoStack.pop();
  if(!e){ if(!quiet) toast('Nichts zu wiederholen'); return; }
  var back=applyEntry(e);
  if(back){ back.label=e.label; undoStack.push(back); undoBytes+=entryBytes(back); trimUndo(); }
  renderStack(); autosaveSoon(); req();
  if(!quiet) toast('Wieder vor: '+undoLabel(e));
}
</script>

/* ══════════ STEMPEL (Pixel) ══════════ */
var stampCache=new Map();
function makeStamp(b,colHex,px){
  var key=b.id+'|'+colHex+'|'+px+'|'+Math.round((b.hard||0)*100)+'|'+Math.round((b.aspect==null?1:b.aspect)*100);
  var hit=stampCache.get(key);
  if(hit) return hit;
  var R=Math.max(1,Math.ceil(px/2)), S=R*2;
  var asp=clamp(b.aspect==null?1:b.aspect,0.05,1);
  var c=document.createElement('canvas');
  c.width=S; c.height=Math.max(2,Math.round(S*asp));
  var g=c.getContext('2d');
  var col=hexToRgb(colHex)||{r:0,g:0,b:0};
  var cy=c.height/2, ry=c.height/2;
  if(b.grain>0){
    var seed=0;
    for(var si=0;si<b.id.length;si++) seed=(seed*31+b.id.charCodeAt(si))|0;
    var hash=function(x,y){
      var n=(x*374761393+y*668265263+seed)|0;
      n=((n^(n>>>13))*1274126177)|0; n^=n>>>16;
      return (n>>>0)/4294967295;
    };
    var gs=Math.max(1,b.gs||1);
    var img=g.createImageData(S,c.height), d=img.data;
    for(var y=0;y<c.height;y++) for(var x=0;x<S;x++){
      var nx=Math.floor(x/gs), ny=Math.floor(y/gs), n=hash(nx,ny);
      var edge=1+(hash(nx+911,ny+577)-0.5)*(b.gstyle==='chalk'?0.55:0.10);
      var dx=(x-R)/R, dy=(y-cy)/ry, r2=(dx*dx+dy*dy)/edge;
      var a=0;
      if(r2<=1){
        var fall=1-Math.pow(Math.sqrt(r2),1+3*clamp(b.hard||0,0,1));
        var kk=(b.gstyle==='pencil1')?(0.35+0.65*n):(b.gstyle==='pencil'?(0.5+0.5*n):(0.25+0.75*n));
        a=Math.round(255*clamp(fall*kk,0,1));
      }
      var i4=(y*S+x)*4;
      d[i4]=col.r; d[i4+1]=col.g; d[i4+2]=col.b; d[i4+3]=a;
    }
    g.putImageData(img,0,0);
  } else {
    g.save(); g.translate(S/2,c.height/2); g.scale(1,asp||1);
    var gr=g.createRadialGradient(0,0,0,0,0,R);
    var h=clamp(b.hard==null?0.7:b.hard,0,0.98);
    gr.addColorStop(0,'rgba('+col.r+','+col.g+','+col.b+',1)');
    gr.addColorStop(h,'rgba('+col.r+','+col.g+','+col.b+',1)');
    gr.addColorStop(1,'rgba('+col.r+','+col.g+','+col.b+',0)');
    g.fillStyle=gr;
    g.beginPath(); g.arc(0,0,R,0,Math.PI*2); g.fill();
    g.restore();
  }
  if(stampCache.size>64) stampCache.clear();
  stampCache.set(key,c);
  return c;
}
/* Kratzfläche: ein Strich wird einmal aufgebaut und dann übertragen —
   deshalb wird ein überlagerter Strich nicht fleckig.                 */
var strokeCv=null, strokeCx=null, brushRun=null;
function ensureStrokeCv(){
  if(!strokeCv||strokeCv.width!==doc.w||strokeCv.height!==doc.h){
    strokeCv=document.createElement('canvas');
    strokeCv.width=doc.w; strokeCv.height=doc.h;
    strokeCx=strokeCv.getContext('2d');
  }
  return strokeCx;
}
function penTilt(e){
  if(!e||e.pointerType!=='pen') return 0;
  var tx=e.tiltX||0, ty=e.tiltY||0;
  return clamp(Math.max(Math.abs(tx),Math.abs(ty))/60,0,1);   /* 0 senkrecht … 1 flach */
}
function beginBrush(l,pt,pres,erase,pid){
  if(typeof dropFloat==='function') dropFloat();     /* erst absetzen, dann malen */
  var b=erase?getBrush('hart','px'):curBrush();
  preSnap(l);                                   /* Abzug für „Zurück" */
  ensureStrokeCv();
  strokeCx.setTransform(1,0,0,1,0,0);
  strokeCx.clearRect(0,0,doc.w,doc.h);
  strokeCx.restore(); strokeCx.save();
  if(!selEmpty()) clipSel(strokeCx);            /* Auswahl begrenzt den Strich */
  brushRun={b:b,l:l,erase:erase,acc:0,first:true,ang:0,bb:null,
            sm:{x:pt.x,y:pt.y},smP:pres,last:{x:pt.x,y:pt.y,p:pres},
            len:0,vel:0,tilt:lastTiltNorm,pot:null,t0:Date.now()};
  if(b.mode==='smudge'||b.mode==='oil'||b.mode==='wc'||b.mode==='blur') fxStart(l,pt,pres);
  drag={kind:'brush',l:l,erase:erase,start:pt,last:pt,id:pid};
  painting=true; strokePid=pid;
  segStamps(brushRun.last,brushRun.last);
  req();
}
function brushMove(pt,pres){
  if(!brushRun) return;
  brushRun.smP+=(pres-brushRun.smP)*0.35;                 /* Druckglättung */
  brushRun.tilt+=(lastTiltNorm-brushRun.tilt)*0.3;        /* Neigungsglättung */
  var vd=Math.hypot(pt.x-brushRun.last.x,pt.y-brushRun.last.y);
  brushRun.vel+=(vd-brushRun.vel)*0.25;                   /* Geschwindigkeit */
  brushRun.len+=vd;
  var nx,ny;
  if(guide.rule!=='aus'){ var q=snapPt(pt,drag.start); nx=q.x; ny=q.y; brushRun.sm.x=nx; brushRun.sm.y=ny; }
  else {
    var aP=Math.max(0.08,1-0.92*stabilizer);              /* Stabilisator */
    brushRun.sm.x+=(pt.x-brushRun.sm.x)*aP;
    brushRun.sm.y+=(pt.y-brushRun.sm.y)*aP;
    nx=brushRun.sm.x; ny=brushRun.sm.y;
  }
  var np={x:nx,y:ny,p:clamp(brushRun.smP,0.02,1)};
  segStamps(brushRun.last,np);
  brushRun.last=np;
  req();
}
function segStamps(a,z){
  var b=brushRun.b, base=VALS.draw.v1.val;
  /* Wischen, Öl, Aquarell und Weichzeichnen arbeiten mit dem Untergrund —
     sie laufen deshalb unmittelbar auf der Ebene, nicht über die Kratzfläche. */
  if(b.mode==='smudge'||b.mode==='oil'||b.mode==='wc'||b.mode==='blur'){
    if(!drag) return;
    drag.fx=(b.mode==='smudge')?'smudge':(b.mode==='blur'?'blur':b.mode);
    fxRun(brushRun.l,a,z,z.p==null?1:z.p);
    return;
  }
  var dx=z.x-a.x, dy=z.y-a.y, dist=Math.hypot(dx,dy);
  var ang=dist>0.01?Math.atan2(dy,dx):brushRun.ang;
  brushRun.ang=ang;
  if(brushRun.first){ stampAt(b,a.x,a.y,a.p,ang); brushRun.first=false; brushRun.acc=0; }
  if(dist<=0) return;
  var pos=0, guard=0;
  while(guard++<4000){
    var k0=pos/dist, curP=a.p+(z.p-a.p)*k0;
    var step=Math.max(0.6,base*(b.space||0.08)*((1-(b.psize||0))+(b.psize||0)*curP));
    var need=step-brushRun.acc;
    if(need>dist-pos){ brushRun.acc+=dist-pos; return; }
    pos+=Math.max(0,need); brushRun.acc=0;
    var k=pos/dist;
    stampAt(b,a.x+dx*k,a.y+dy*k,a.p+(z.p-a.p)*k,ang);
    if(pos>=dist) return;
  }
}
function stampAt(b,x,y,p,ang){
  var base=VALS.draw.v1.val;
  var psz=Math.max(1,base*((1-(b.psize||0))+(b.psize||0)*p));
  /* Neigung verbreitert und schwächt — wie ein flach geführter Stift */
  var ti=brushRun.tilt||0;
  if(ti>0.05){ psz*= (1+0.55*ti); }
  /* Schnelle Führung zieht den Strich schlanker */
  var vfac=1-clamp((brushRun.vel||0)/(base*2.2),0,1)*0.28;
  psz=Math.max(1,psz*vfac);
  /* Anlauf: die ersten Millimeter schwellen an */
  var an=clamp((brushRun.len||0)/(base*0.9),0,1);
  psz=Math.max(1,psz*(0.45+0.55*an));
  var flow=clamp((b.flow==null?1:b.flow)*((1-(b.pflow||0))+(b.pflow||0)*p),0.01,1);
  flow*=(0.55+0.45*an)*(1-0.35*ti);
  var cnt=Math.max(1,b.count||1);
  var g=brushRun.erase?brushRun.l.data.cv.getContext('2d'):strokeCx;
  var st=makeStamp(b,brushRun.erase?'#000000':color,psz);
  mirrorPts({x:x,y:y}).forEach(function(m){
    for(var i=0;i<cnt;i++){
      var sx=m.x, sy=m.y, rot=((b.angle||0)*Math.PI/180);
      if(b.rotFollow) rot+=ang;
      if(b.ajit) rot+=(Math.random()-0.5)*2*Math.PI*b.ajit;
      var sc=1;
      if(cnt>1||b.scat){
        var off=(Math.random()-0.5)*2*(b.scat||0.8)*psz;
        var off2=(Math.random()-0.5)*0.7*(b.scat||0.8)*psz;
        sx+=Math.cos(rot+Math.PI/2)*off+Math.cos(rot)*off2;
        sy+=Math.sin(rot+Math.PI/2)*off+Math.sin(rot)*off2;
        if(cnt>1) sc=0.35+0.6*Math.random();
      }
      g.save();
      g.globalCompositeOperation=brushRun.erase?'destination-out':'source-over';
      g.globalAlpha=flow*(cnt>1?(0.55+0.45*Math.random()):1);
      g.translate(sx,sy); g.rotate(rot);
      g.drawImage(st,-st.width*sc/2,-st.height*sc/2,st.width*sc,st.height*sc);
      g.restore();
      var rr=Math.max(st.width,st.height)*sc/2+2;
      var bb=brushRun.bb;
      if(!bb) brushRun.bb={x0:sx-rr,y0:sy-rr,x1:sx+rr,y1:sy+rr};
      else {
        bb.x0=Math.min(bb.x0,sx-rr); bb.y0=Math.min(bb.y0,sy-rr);
        bb.x1=Math.max(bb.x1,sx+rr); bb.y1=Math.max(bb.y1,sy+rr);
      }
    }
  });
}
function endBrush(d){
  if(!brushRun) return;
  tlDirty=true;
  var r=brushRun; brushRun=null;
  pushPixelUndo(r.l,r.bb||{x0:0,y0:0,x1:doc.w,y1:doc.h});
  if(!r.erase){
    if(!selEmpty()&&sel.mask&&strokeCv) maskOut(strokeCv);
    var g=r.l.data.cv.getContext('2d');
    g.save();
    g.globalAlpha=clamp(VALS.draw.v2.val/100,0,1);
    g.globalCompositeOperation='source-over';
    g.drawImage(strokeCv,0,0);
    g.restore();
  }
  if(strokeCx) strokeCx.clearRect(0,0,doc.w,doc.h);
  invalidate('pixel');
}

/* ══════════ PFADE: Strich mit Spitze und Profil ══════════ */
function pathWidthAt(pth,i){
  var b=getBrush(pth.brush||'tinte','ve');
  var n=pth.pts.length, t=n>1?i/(n-1):0;
  var pt=pth.pts[i]||{};
  var pr=(pt.p==null?0.6:pt.p);
  if(b.pcurve) pr=Math.pow(pr,b.pcurve);
  var prof=PROFILE[pth.profil||b.profil||'gleich']||PROFILE.gleich;
  var a=0;
  if(i>0&&pth.pts[i-1]) a=Math.atan2(pt.y-pth.pts[i-1].y,pt.x-pth.pts[i-1].x);
  var f=prof.f(t,a);
  var w=(pth.w||4)*(b.wScale||1)*f;
  if(b.pressure) w*=(0.35+0.85*pr);
  return Math.max(0.4,w);
}
function paintPath(g,pth,asGhost){
  var pts=pth.pts;
  if(!pts||!pts.length) return;
  var b=getBrush(pth.brush||'tinte','ve');
  var col=asGhost?'#7d8a86':pth.col;
  g.save();
  g.lineCap='round'; g.lineJoin='round';
  g.strokeStyle=col; g.fillStyle=col;
  g.globalAlpha=(asGhost?1:(b.opacity==null?1:b.opacity));
  if(pts.length===1){
    g.beginPath(); g.arc(pts[0].x,pts[0].y,pathWidthAt(pth,0)/2,0,Math.PI*2); g.fill();
    g.restore(); return;
  }
  if(b.mode==='spray'){
    var dens=b.density==null?0.4:b.density;
    for(var i=1;i<pts.length;i++){
      var w=pathWidthAt(pth,i), seg=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);
      var n2=Math.max(1,Math.round(seg*dens));
      for(var k=0;k<n2;k++){
        var t=k/n2;
        var x=pts[i-1].x+(pts[i].x-pts[i-1].x)*t, y=pts[i-1].y+(pts[i].y-pts[i-1].y)*t;
        var r=w*(b.scatter||1);
        g.globalAlpha=(b.opacity||0.5)*(0.35+0.65*Math.random());
        g.beginPath();
        g.arc(x+(Math.random()-0.5)*2*r,y+(Math.random()-0.5)*2*r,Math.max(0.4,w*0.18),0,Math.PI*2);
        g.fill();
      }
    }
    g.restore(); return;
  }
  if(b.mode==='stamp'){
    var sp=(b.spacing||1.8);
    for(var j=0;j<pts.length;j++){
      var w2=pathWidthAt(pth,j);
      if(j%Math.max(1,Math.round(sp))!==0) continue;
      var r2=Math.max(0.6,w2/2);
      if(b.stamp==='square') g.fillRect(pts[j].x-r2,pts[j].y-r2,r2*2,r2*2);
      else { g.beginPath(); g.arc(pts[j].x,pts[j].y,r2,0,Math.PI*2); g.fill(); }
    }
    g.restore(); return;
  }
  if(b.mode==='bristle'){
    var nb=b.bristles||7, spread=b.spread||1;
    for(var q=0;q<nb;q++){
      var offN=(q/(nb-1)-0.5)*2*spread;
      g.globalAlpha=(b.opacity||0.9)*(0.45+0.55*(1-Math.abs(offN)/Math.max(0.001,spread)));
      g.beginPath();
      for(var m=0;m<pts.length;m++){
        var wq=pathWidthAt(pth,m);
        var pa=(m>0)?Math.atan2(pts[m].y-pts[m-1].y,pts[m].x-pts[m-1].x):0;
        var ox=Math.cos(pa+Math.PI/2)*offN*wq*0.5, oy=Math.sin(pa+Math.PI/2)*offN*wq*0.5;
        if(m===0) g.moveTo(pts[m].x+ox,pts[m].y+oy); else g.lineTo(pts[m].x+ox,pts[m].y+oy);
      }
      g.lineWidth=Math.max(0.4,(pth.w||4)*0.22);
      g.stroke();
    }
    g.restore(); return;
  }
  /* round · flat · soft · grain: Breite Segment für Segment */
  for(var s=1;s<pts.length;s++){
    var wa=(pathWidthAt(pth,s-1)+pathWidthAt(pth,s))/2;
    if(b.mode==='flat'){
      var av=((b.angle||30)*Math.PI/180);
      var pax=Math.cos(av)*wa*0.5, pay=Math.sin(av)*wa*0.5;
      g.beginPath();
      g.moveTo(pts[s-1].x-pax,pts[s-1].y-pay);
      g.lineTo(pts[s-1].x+pax,pts[s-1].y+pay);
      g.lineTo(pts[s].x+pax,pts[s].y+pay);
      g.lineTo(pts[s].x-pax,pts[s].y-pay);
      g.closePath(); g.fill();
    } else if(b.mode==='soft'){
      g.globalAlpha=(b.opacity==null?1:b.opacity)*(b.flow||0.6);
      g.lineWidth=wa; g.beginPath();
      g.moveTo(pts[s-1].x,pts[s-1].y); g.lineTo(pts[s].x,pts[s].y); g.stroke();
      g.lineWidth=wa*0.55;
      g.beginPath(); g.moveTo(pts[s-1].x,pts[s-1].y); g.lineTo(pts[s].x,pts[s].y); g.stroke();
    } else if(b.mode==='grain'){
      var gcount=Math.max(1,Math.round(wa*0.5));
      for(var gi=0;gi<gcount;gi++){
        g.globalAlpha=(b.opacity||0.85)*(0.25+0.75*Math.random())*(1-(b.grain||0.5)*0.4);
        var gt=Math.random();
        var gx=pts[s-1].x+(pts[s].x-pts[s-1].x)*gt, gy=pts[s-1].y+(pts[s].y-pts[s-1].y)*gt;
        var gr2=Math.max(0.3,wa*0.16);
        g.beginPath();
        g.arc(gx+(Math.random()-0.5)*wa*0.7,gy+(Math.random()-0.5)*wa*0.7,gr2,0,Math.PI*2);
        g.fill();
      }
    } else {
      g.lineWidth=wa;
      g.beginPath(); g.moveTo(pts[s-1].x,pts[s-1].y); g.lineTo(pts[s].x,pts[s].y); g.stroke();
    }
  }
  if(pth.closed&&pts.length>2){
    g.lineWidth=pathWidthAt(pth,pts.length-1);
    g.beginPath(); g.moveTo(pts[pts.length-1].x,pts[pts.length-1].y);
    g.lineTo(pts[0].x,pts[0].y); g.stroke();
  }
  g.restore();
}

/* ══════════ PINSELFENSTER (Prototyp VII) ══════════ */
function tipPreview(cv,brId,which){
  var g=cv.getContext('2d');
  if(!g) return;
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,cv.width,cv.height);
  var b=getBrush(brId,which);
  var W=cv.width, H=cv.height;
  var pts=[];
  for(var i=0;i<=48;i++){
    var t=i/48;
    pts.push({x:8+t*(W-16), y:H/2+Math.sin(t*Math.PI*1.6)*(H*0.22), p:0.15+0.85*Math.sin(Math.PI*t)});
  }
  if(which==='ve'){
    paintPath(g,{pts:pts,w:Math.max(2,H*0.22),col:color,brush:b.id,profil:b.profil,closed:false},false);
    return;
  }
  /* Pixel: echte Stempelspur */
  var saveVals=VALS.draw.v1.val;
  var pxSize=Math.max(3,H*0.5);
  var acc=0, ang=0;
  for(var s=1;s<pts.length;s++){
    var a=pts[s-1], z=pts[s];
    var dx=z.x-a.x, dy=z.y-a.y, dist=Math.hypot(dx,dy);
    ang=Math.atan2(dy,dx);
    var pos=0;
    while(true){
      var step=Math.max(0.6,pxSize*(b.space||0.08));
      var need=step-acc;
      if(need>dist-pos){ acc+=dist-pos; break; }
      pos+=Math.max(0,need); acc=0;
      var k=pos/dist, p=a.p+(z.p-a.p)*k;
      var psz=Math.max(1,pxSize*((1-(b.psize||0))+(b.psize||0)*p));
      var st=makeStamp(b,color,psz);
      var flow=clamp((b.flow==null?1:b.flow)*((1-(b.pflow||0))+(b.pflow||0)*p),0.01,1);
      var cnt=Math.max(1,b.count||1);
      for(var c2=0;c2<cnt;c2++){
        var sx=a.x+dx*k, sy=a.y+dy*k, rot=((b.angle||0)*Math.PI/180);
        if(b.rotFollow) rot+=ang;
        if(b.ajit) rot+=(Math.random()-0.5)*2*Math.PI*b.ajit;
        var scl=1;
        if(cnt>1||b.scat){
          var o1=(Math.random()-0.5)*2*(b.scat||0.8)*psz*0.5;
          sx+=Math.cos(rot+Math.PI/2)*o1; sy+=Math.sin(rot+Math.PI/2)*o1;
          if(cnt>1) scl=0.35+0.6*Math.random();
        }
        g.save();
        g.globalAlpha=flow*(cnt>1?0.6:1);
        g.translate(sx,sy); g.rotate(rot);
        g.drawImage(st,-st.width*scl/2,-st.height*scl/2,st.width*scl,st.height*scl);
        g.restore();
      }
      if(pos>=dist) break;
    }
  }
  VALS.draw.v1.val=saveVals;
}

<script>

/* ══════════════════════════════════════════════════════════════════════

var BLENDS=[

function blendName(id){

function ensureGroups(){ if(!doc.groups) doc.groups=[]; return doc.groups; }

function addToGroup(l,gid){

}
function newGroupFromActive(){

   BLATT — Anschnitt und Raster

    +'<div class="frow"><button class="hbtn" id="shGrid">'+(gr.on?'Raster aus':'Raster an')+'</button>'

    +'<div class="sl"><div class="r1"><span>Rasterweite</span><span class="v" id="shSzV">'+gr.size+' px</span></div>'

    +'<div class="frow"><button class="hbtn" data-size="2480,3508">A4 300dpi</button>'
    +'<button class="hbtn" data-size="1600,760">Wandbild</button></div>'
    +'<div class="mono" style="font-size:11px;color:var(--tx3);margin-top:7px">'
    +'Gr\u00F6\u00DFe \u00E4ndern beh\u00E4lt alle Ebenen \u2014 der Inhalt wird nicht skaliert.</div>';
  $('shBl').addEventListener('input',function(){

    toast(gr.on?'Raster an':'Raster aus');
  });
  $('shSnap').addEventListener('click',function(){
    gr.snap=!gr.snap; if(gr.snap) gr.on=true;
    buildSheetWin(); autosaveSoon(); req();
    toast(gr.snap?'Einrasten an':'Einrasten aus');

  $('shSz').addEventListener('input',function(){
