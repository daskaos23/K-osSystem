<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0c0e10">
<title>K-OS</title>
<link rel="icon" href="brand-mark.png">
<style>
:root{
  --bg:#0c0e10; --top:#0d1114; --panel:#10151a; --panel2:#141b21; --line:#232a30; --line2:#333c45;
  --tx:#eef3f6; --tx2:#93a5ae; --tx3:#66707a; --sheet:#eceae6;
  --files:#26b9d9; --studio:#f2af0d; --draw:#d92626; --drawtx:#e05050; --vektor:#26d97a;
  --ac:#e05050;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font-family:system-ui,'Roboto',sans-serif;font-weight:400;
  -webkit-font-smoothing:antialiased;touch-action:none;user-select:none;-webkit-user-select:none}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}

/* ══════════ RAHMEN ══════════ */
#app{display:grid;grid-template-rows:44px 1fr;
  grid-template-columns:30px 1fr var(--panelw,244px);height:100dvh;
  transition:grid-template-columns .22s cubic-bezier(.4,0,.2,1)}
body.panelzu #app{--panelw:0px}
#topbar{grid-column:1/4;display:flex;align-items:center;gap:10px;background:var(--top);
  border-bottom:1px solid var(--line);padding:0 10px;z-index:40}
#spine{grid-row:2;display:flex;flex-direction:column;background:#0a0e11;z-index:30}
#stagewrap{grid-row:2;position:relative;overflow:hidden;background:var(--bg)}
#panel{grid-row:2;position:relative;background:var(--panel);border-left:1px solid var(--line);
  overflow-y:auto;overflow-x:hidden;padding:8px 11px 20px;z-index:20;touch-action:pan-y}
body.panelzu #panel{padding:0;border-left:0}
#panelTab{position:absolute;top:50%;right:var(--panelw,244px);transform:translateY(-50%);
  width:15px;height:78px;background:var(--panel);border:1px solid var(--line);border-right:0;
  border-radius:9px 0 0 9px;color:var(--tx3);font-size:10px;cursor:pointer;z-index:35;
  display:flex;align-items:center;justify-content:center;padding:0;
  transition:right .22s cubic-bezier(.4,0,.2,1)}
#panelTab:hover{color:var(--tx);border-color:var(--line2)}

/* ══════════ TOPBAR ══════════ */
#homeBtn{width:34px;height:32px;flex:0 0 34px;border:1px solid transparent;background:transparent;
  border-radius:9px;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
#homeBtn:hover{border-color:var(--line2);background:#11181d}
#homeBtn img{width:26px;height:26px;object-fit:contain;display:block}
.titlewrap{display:flex;flex-direction:column;gap:1px;min-width:0;max-width:230px}
.brand{font-family:'JetBrains Mono',monospace;font-size:12.5px;letter-spacing:.06em;white-space:nowrap;line-height:1.1}
.brand b{font-weight:800}
.brand .ln{font-weight:800;margin-left:4px}
.docname{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--tx3);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;line-height:1.1}
#cmdwrap{flex:1;display:flex;justify-content:center;min-width:60px}
#cmd{width:min(320px,100%);position:relative}
#cmd input{width:100%;background:#11181d;border:1px solid var(--line);border-radius:8px;color:var(--tx);
  font:12px 'JetBrains Mono',monospace;padding:6px 26px 6px 24px;outline:none}
#cmd input:focus{border-color:var(--line2)}
#cmd .dot{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:7px;height:7px;border-radius:50%;background:var(--ac)}
#cmd .kk{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:10px 'JetBrains Mono',monospace;
  color:var(--tx3);border:1px solid var(--line);border-radius:4px;padding:0 4px}
#cmdlist{position:absolute;top:34px;left:0;right:0;background:var(--panel2);border:1px solid var(--line2);
  border-radius:10px;overflow:hidden;display:none;z-index:80;box-shadow:0 16px 34px -12px rgba(0,0,0,.9)}
#cmdlist.show{display:block}
#cmdlist .ci{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;font-size:12.5px;cursor:pointer}
#cmdlist .ci .k{color:var(--tx3);font:10px 'JetBrains Mono',monospace}
#cmdlist .ci.sel,#cmdlist .ci:hover{background:#1a232b}
.tgroup{display:flex;align-items:center;gap:6px;background:#11181d;border:1px solid var(--line);border-radius:9px;padding:3px 6px}
.tpill{display:flex;align-items:center;gap:6px;border:0;background:#1a2129;color:var(--tx);border-radius:6px;
  padding:4px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.tpill .g{font-size:13px}
.tpill .tv{font:9.5px 'JetBrains Mono',monospace;color:var(--tx3);letter-spacing:.02em}
#colDot{width:20px;height:20px;border-radius:50%;border:2px solid #fff2;cursor:pointer;background:var(--ac)}
.radmode{display:flex;align-items:center;gap:2px}
.radmode .lbl{font:9.5px 'JetBrains Mono',monospace;letter-spacing:.12em;color:var(--tx3);margin-right:2px}
.radmode button{width:26px;height:24px;border:0;background:transparent;color:var(--tx3);border-radius:6px;cursor:pointer;font-size:13px}
.radmode button.on{background:var(--ac);color:#0a0a0a}
.dbwrap{display:flex;align-items:center;gap:7px}
.dbwrap .lbl{font:9.5px 'JetBrains Mono',monospace;letter-spacing:.14em;color:var(--tx3)}
.dbwrap input{flex:1;accent-color:var(--tx2)}
.dbwrap .val{font:11px 'JetBrains Mono',monospace;color:var(--tx);min-width:34px;text-align:right}
#viewBtn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#11181d;
  color:var(--tx2);border-radius:9px;padding:5px 10px;font:11px 'JetBrains Mono',monospace;cursor:pointer}
#viewBtn:hover{border-color:var(--line2);color:var(--tx)}
#viewBtn.on{border-color:var(--line2);color:var(--tx)}
#viewBtn .pv{width:7px;height:7px;border-radius:50%;background:var(--tx3)}
#viewPop{position:absolute;top:48px;right:8px;width:252px;background:var(--panel2);
  border:1px solid var(--line2);border-radius:12px;padding:11px 12px;z-index:75;display:none;
  box-shadow:0 18px 40px -14px rgba(0,0,0,.95)}
#viewPop.show{display:block}
#viewPop h5{font:9.5px 'JetBrains Mono',monospace;letter-spacing:.2em;color:var(--tx3);margin:10px 0 6px}
#viewPop h5:first-child{margin-top:0}
.vrow{display:flex;align-items:center;gap:7px}
.vrow .rm{flex:1;height:30px;border:1px solid var(--line);background:#11181d;color:var(--tx2);
  border-radius:8px;font-size:12px;cursor:pointer}
.vrow .rm.on{border-color:var(--ac);color:var(--ac);background:#161d24}
.hbtn{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#11181d;color:var(--tx);
  border-radius:9px;padding:6px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.hbtn:hover{border-color:var(--line2)}
.ibtn{width:32px;height:30px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);
  background:#11181d;color:var(--tx2);border-radius:9px;cursor:pointer;font-size:14px}
.ibtn.rec{border-color:var(--draw);color:var(--drawtx);background:#1d1214}
.ibtn.rec::after{content:'';position:absolute;margin:-18px 0 0 22px;width:7px;height:7px;border-radius:50%;
  background:var(--draw);animation:recpuls 1.4s ease-in-out infinite}
@keyframes recpuls{0%,100%{opacity:1}50%{opacity:.25}}
body.aufnahme #stagewrap::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:60;
  box-shadow:inset 0 0 0 2px rgba(217,38,38,.5)}

/* ══════════ SPINE ══════════ */
.seg{position:relative;flex:1;border:0;background:transparent;cursor:pointer;touch-action:none}
.seg .bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c);opacity:.42;
  transition:width .2s cubic-bezier(.4,0,.2,1),opacity .2s ease}
.seg.on .bar{width:100%;opacity:1}
.seg:not(.on):hover .bar{width:9px;opacity:.8}
.seg .g{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:12px;
  color:var(--c);opacity:.55;transition:opacity .15s ease,color .15s ease,font-size .15s ease;pointer-events:none}
.seg.on .g{opacity:1;color:rgba(8,8,8,.82);font-size:13px}
.seg::after{content:'';position:absolute;right:0;top:50%;transform:translateY(-50%) scaleY(0);
  width:3px;height:26px;background:#fff;border-radius:2px 0 0 2px;opacity:.9;
  transition:transform .2s cubic-bezier(.4,0,.2,1)}
.seg.on::after{transform:translateY(-50%) scaleY(1)}
.seg.files{flex:0 0 56px}

/* ══════════ BÜHNE ══════════ */
#stage{position:absolute;inset:0;touch-action:none}
#hint{position:absolute;right:10px;bottom:10px;background:#0d1114cc;border:1px solid var(--line);
  border-radius:6px;color:var(--tx3);font:10.5px 'JetBrains Mono',monospace;padding:4px 8px;
  pointer-events:none;opacity:0;transition:opacity .55s ease}
#hint.show{opacity:1}
#badges{transition:opacity .3s ease}
body.zeichnet #badges{opacity:.18}
body.zeichnet #hint{opacity:0}
#badges{position:absolute;left:10px;bottom:10px;display:flex;gap:8px}
.badge{display:flex;align-items:center;gap:6px;background:#0d1114cc;border:1px solid var(--line);border-radius:6px;
  color:var(--tx2);font:10.5px 'JetBrains Mono',monospace;padding:4px 8px;cursor:pointer;touch-action:none}
.badge .p{width:7px;height:7px;border-radius:50%;background:var(--c)}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#161d24;border:1px solid var(--line2);
  border-radius:9px;padding:8px 14px;font-size:12.5px;display:none;z-index:90;max-width:70%}
#toast.show{display:block}

/* ══════════ PANEL ══════════ */
.ph{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 7px;
  padding-bottom:5px;border-bottom:1px solid var(--line)}
.ph:first-child{margin-top:2px}
.ph .t{font:9.5px 'JetBrains Mono',monospace;letter-spacing:.24em;color:var(--tx3)}
.ph .n{font:9.5px 'JetBrains Mono',monospace;color:var(--tx3)}
.ph .add{border:1px solid var(--line);background:#11181d;color:var(--tx2);border-radius:6px;
  width:22px;height:20px;font-size:12px;cursor:pointer;line-height:1;padding:0}
.ph .add:hover{border-color:var(--line2);color:var(--tx)}
.lay{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;cursor:pointer;
  border:1px solid transparent;min-height:38px}
.lay:hover{background:#141b21}
.lay.on{background:#1a2129;border-color:var(--line2)}
.lay .tp{width:10px;height:10px;border-radius:3px;background:var(--c);flex:0 0 10px}
.lay .nm{flex:1;font-size:12.5px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lay.ghosted .nm{color:var(--tx3)}
.lay .fdot{width:5px;height:5px;border-radius:50%;background:var(--c);opacity:.85}
.lay .op{font:10.5px 'JetBrains Mono',monospace;color:var(--tx3);min-width:26px;text-align:right}
.lay .vis{border:0;background:none;color:var(--tx3);cursor:pointer;font-size:12px;padding:0 2px}
.lay.vorlage .nm{font-style:italic}
.sl{margin:6px 2px 12px}
.sl .r1{display:flex;justify-content:space-between;font-size:12px;color:var(--tx2);margin-bottom:5px}
.sl input[type=range]{height:26px}
.sl .r1 .v{font-family:'JetBrains Mono',monospace;color:var(--tx)}
.sl input{width:100%;accent-color:var(--ac)}
#swatches{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.sw{width:30px;height:30px;border-radius:8px;border:2px solid transparent;cursor:pointer}
.sw.on{border-color:#fff}
.sw.more{background:#11181d;border:1px solid var(--line);color:var(--tx3);display:flex;align-items:center;justify-content:center;font-size:14px}

/* ══════════ RAD ══════════ */
#radlayer{position:absolute;inset:0;pointer-events:none;z-index:50}
#rad{position:absolute;width:0;height:0}
#rad.dim{opacity:.3}
#rad,#rad *{transition:opacity .15s ease}
.rk{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;
  background:var(--ac);border:2px solid #0a0a0a55;pointer-events:auto;cursor:pointer;touch-action:none;
  box-shadow:0 6px 16px -6px rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;color:#0a0a0a;font-size:17px}
.rk .pin{position:absolute;right:-3px;bottom:-3px;width:15px;height:15px;border-radius:50%;background:#0d1316;
  border:1px solid var(--line2);color:var(--tx2);font-size:8px;display:none;align-items:center;justify-content:center}
#rad.fixed .rk .pin{display:flex}
.rs{position:absolute;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;background:#0d1316;
  border:1.5px solid var(--line2);color:var(--tx);display:flex;align-items:center;justify-content:center;
  font-size:15px;pointer-events:auto;cursor:pointer;touch-action:none;box-shadow:0 5px 12px -5px rgba(0,0,0,.85)}
.rs.on{background:var(--ac);border-color:var(--ac);color:#0a0a0a}
.rs.all{width:38px;height:38px;border-style:dashed;color:var(--tx3);font:9.5px 'JetBrains Mono',monospace}
.rs .bnd{position:absolute;left:-2px;top:-2px;right:-2px;bottom:-2px;border-radius:50%;border:2px solid var(--c);opacity:.9}
.rlbl{position:absolute;transform:translate(-50%,-50%);font:9.5px 'JetBrains Mono',monospace;color:#c6d2d9;
  background:#0d1316d9;border-radius:4px;padding:1px 5px;pointer-events:none;white-space:nowrap}
.rr{position:absolute;transform:translate(-50%,-50%);width:13px;height:64px;border-radius:7px;background:#0d1316;
  border:1.5px solid var(--line2);pointer-events:auto;cursor:ns-resize;touch-action:none;overflow:hidden}
.rr .fill{position:absolute;left:0;right:0;bottom:0;background:var(--ac);opacity:.85}
.rval{position:absolute;transform:translate(-50%,-100%);font:11px 'JetBrains Mono',monospace;color:var(--tx);
  background:#0d1316;border:1px solid var(--line2);border-radius:5px;padding:2px 7px;pointer-events:none;white-space:nowrap}
.fan{position:absolute;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;background:#12181e;
  border:1.5px solid var(--line2);color:var(--tx);display:flex;align-items:center;justify-content:center;font-size:13px;
  pointer-events:auto;cursor:pointer;touch-action:none}
.fan.on{border-color:var(--ac)}
.fan .pindot{position:absolute;right:0;top:0;width:6px;height:6px;border-radius:50%;background:var(--ac)}
.fan.dots{font:12px monospace;color:var(--tx3)}

/* ══════════ FENSTER (Farbe/Pinsel/Lineal) + ÜBERGABE ══════════ */
.win{position:absolute;background:var(--panel2);border:1px solid var(--line2);border-radius:13px;
  box-shadow:0 20px 46px -14px rgba(0,0,0,.95);padding:10px 12px 12px;display:none;z-index:70;
  pointer-events:auto;width:270px;max-height:78vh;flex-direction:column;min-width:210px;min-height:120px}
.win.show{display:flex}
.win.pinned{border-color:var(--ac);box-shadow:0 20px 46px -14px rgba(0,0,0,.95),0 0 0 1px var(--ac) inset}
.winbar{flex:0 0 auto;display:flex;align-items:center;gap:6px;cursor:move;touch-action:none;
  margin:-4px -4px 8px;padding:2px 2px 7px;border-bottom:1px solid var(--line)}
.winbar .wt{flex:1;font:10px 'JetBrains Mono',monospace;letter-spacing:.18em;color:var(--tx2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.winbar button{width:26px;height:24px;border:1px solid var(--line);background:#11181d;color:var(--tx3);
  border-radius:6px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.winbar button.on{border-color:var(--ac);color:var(--ac)}
.winbody{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;
  -webkit-overflow-scrolling:touch;padding-right:3px;scrollbar-width:thin}
.winbody::-webkit-scrollbar{width:7px}
.winbody::-webkit-scrollbar-thumb{background:#2b3a44;border-radius:4px}
.winbody .wx{display:none}
.wgrip{position:absolute;right:3px;bottom:3px;width:22px;height:22px;cursor:nwse-resize;touch-action:none;
  border-right:2px solid var(--line2);border-bottom:2px solid var(--line2);border-radius:0 0 11px 0;opacity:.8}
.wgrip:hover{border-color:var(--ac)}
.win h5{font:10px 'JetBrains Mono',monospace;letter-spacing:.2em;color:var(--tx3);margin:8px 0 6px}
.win h5:first-child{margin-top:0}
.win .wx{position:absolute;right:8px;top:6px;border:0;background:none;color:var(--tx3);font-size:15px;cursor:pointer}
.cgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.cg{position:relative;aspect-ratio:1;border-radius:6px;border:1px solid #2b3a44;cursor:pointer}
.cg .st{position:absolute;right:-4px;top:-4px;width:15px;height:15px;border-radius:50%;background:#0d1316;
  border:1px solid var(--line2);color:var(--tx3);font-size:8px;display:none;align-items:center;justify-content:center;z-index:2}
.cg:hover .st{display:flex}
.cg .st.on{display:flex;color:var(--ac);border-color:var(--ac)}
.hexrow{display:flex;gap:6px;margin-top:8px}
.hexrow input{flex:1;background:#11181d;border:1px solid var(--line);border-radius:7px;color:var(--tx);
  font:12px 'JetBrains Mono',monospace;padding:6px 8px;outline:none}
.hexrow button{border:0;border-radius:7px;background:var(--ac);color:#0a0a0a;font-weight:700;padding:0 12px;cursor:pointer}
.tiprow{display:flex;flex-direction:column;gap:5px}
.tip{position:relative;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;
  padding:6px 8px;cursor:pointer;background:#11181d}
.tip.on{border-color:var(--ac)}
.tip.infan{box-shadow:inset 0 0 0 1px #3d5969}
.tip canvas{width:120px;height:22px}
.tip .nm{font-size:12px;color:var(--tx2)}
.tip .st{position:absolute;right:6px;top:6px;width:15px;height:15px;border-radius:50%;background:#0d1316;
  border:1px solid var(--line2);color:var(--tx3);font-size:8px;display:none;align-items:center;justify-content:center}
.tip:hover .st{display:flex}
.tip .st.on{display:flex;color:var(--ac);border-color:var(--ac)}
.rs.cmd{border-style:dashed;color:var(--tx2)}
.rlbl.grp{font-size:8.5px;letter-spacing:.18em;color:var(--tx3);background:transparent}
/* Farbpanel (aus K-OS Draw/Vektor übernommen) */
#winColor{width:296px}
.pkrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
#svsq{width:206px;height:150px;border-radius:8px;touch-action:none;cursor:crosshair;display:block}
#hueBar{width:24px;height:150px;border-radius:6px;touch-action:none;cursor:pointer;display:block}
.pkprev{width:34px;height:34px;border-radius:8px;border:1px solid var(--line2);flex:0 0 auto}
.pkin{flex:1;min-width:0;height:32px;border-radius:8px;border:1px solid var(--line);background:#11181d;
  color:var(--tx);padding:0 8px;font:12px 'JetBrains Mono',monospace;outline:none}
.pkbtn{height:32px;border:1px solid var(--line);background:#11181d;color:var(--tx);border-radius:8px;
  padding:0 10px;font-size:12px;cursor:pointer;white-space:nowrap}
.pkbtn:hover{border-color:var(--line2)}
.pksel{height:32px;border:1px solid var(--line);background:#11181d;color:var(--tx);border-radius:8px;
  padding:0 6px;font-size:12px;flex:1;min-width:0}
.pksw{display:flex;flex-wrap:wrap;gap:6px;min-height:30px}
.chip{width:28px;height:28px;border-radius:7px;border:1px solid rgba(255,255,255,.18);cursor:pointer;position:relative}
.chip.sel{outline:2px solid var(--ac);outline-offset:1px}
.chip .st{position:absolute;right:-5px;top:-5px;width:15px;height:15px;border-radius:50%;background:#0d1316;
  border:1px solid var(--line2);color:var(--tx3);font-size:8px;display:none;align-items:center;justify-content:center}
.chip:hover .st{display:flex}
.chip .st.on{display:flex;color:var(--ac);border-color:var(--ac)}
#pickDot{position:absolute;width:34px;height:34px;border-radius:50%;border:3px solid #fff;
  box-shadow:0 2px 12px rgba(0,0,0,.7);transform:translate(-50%,-150%);pointer-events:none;
  z-index:78;display:none}
/* Stapel: Gruppen */
.grp{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:8px;cursor:pointer;
  background:#0f151a;border:1px solid var(--line);margin-top:6px}
.grp:hover{border-color:var(--line2)}
.grp .tw{border:0;background:none;color:var(--tx3);cursor:pointer;font-size:10px;padding:0;width:12px}
.grp .gn{flex:1;font:10px 'JetBrains Mono',monospace;letter-spacing:.12em;color:var(--tx2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp .gc{font:9.5px 'JetBrains Mono',monospace;color:var(--tx3)}
.grp .vis{border:0;background:none;color:var(--tx3);cursor:pointer;font-size:11px}
.lay.ing{margin-left:12px;border-left:2px solid var(--line2);border-radius:0 8px 8px 0}
.lay .bl{font:8.5px 'JetBrains Mono',monospace;color:var(--tx3);letter-spacing:.06em}
/* Zurück-Liste */

.histlist{display:flex;flex-direction:column;gap:2px;margin-bottom:9px}
.histlist .hi{padding:5px 9px;border-radius:7px;font-size:12px;color:var(--tx2);cursor:pointer;
  border:1px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.histlist .hi:hover{background:#1a232b;border-color:var(--line2)}
.histlist .hi.now{color:var(--ac);cursor:default;font-family:'JetBrains Mono',monospace;font-size:11px}

.histlist .hi.fwd{color:var(--tx3)}
.histlist .hi.none{color:var(--tx3);cursor:default;font-style:italic}
/* Ringbelegung */
#winRing{width:290px}
.ringmap{position:relative;height:210px;margin:6px 0 10px}
.ringmap .mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:40px;height:40px;
  border-radius:50%;background:var(--ac);opacity:.35}
.rslot{position:absolute;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;
  background:#11181d;border:1.5px solid var(--line2);color:var(--tx);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;cursor:pointer;font-size:15px;padding:2px}
.rslot.sel{border-color:var(--ac);color:var(--ac)}
.rslot .sn{font:7.5px 'JetBrains Mono',monospace;color:var(--tx3);letter-spacing:.04em;white-space:nowrap}
.rslot.allsl{border-style:dashed;color:var(--tx3);font:9px 'JetBrains Mono',monospace;cursor:default}
.rpick{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.rpick .rt{aspect-ratio:1;border:1px solid var(--line);background:#11181d;border-radius:8px;color:var(--tx);
  display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer}
.rpick .rt.on{border-color:var(--ac);color:var(--ac)}
.rpick .rt.used{box-shadow:inset 0 0 0 1px #3d5969}
/* Stift-Diagnose */
#diagBox{position:absolute;left:10px;top:10px;max-width:420px;background:#0d1114ee;border:1px solid var(--line2);
  border-radius:9px;padding:8px 10px;font:10.5px 'JetBrains Mono',monospace;color:var(--tx2);
  line-height:1.5;display:none;z-index:85;pointer-events:none}
#diagBox b{color:var(--tx)}
#uebmenu{right:10px;top:52px;width:250px}
#uebmenu .ui{display:flex;flex-direction:column;gap:2px;padding:9px 10px;border-radius:9px;cursor:pointer}
#uebmenu .ui:hover{background:#1a232b}
#uebmenu .ui .t{font-size:13px}
#uebmenu .ui .d{font-size:11px;color:var(--tx3)}
#winfile{left:50%;top:60px;transform:translateX(-50%)}
.frow{display:flex;gap:8px;margin-top:6px}
.frow .hbtn{flex:1;justify-content:center}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">

        <button class="hbtn" id="toFiles">&#9635; Zur Ablage (K-OS Files)</button>

        <span class="n" id="stackN">0</span>
        <button class="add" id="addLayerBtn" title="Neue Ebene in dieser Linse">&#43;</button>
      </span></div>
    <div id="stack"></div>
    <div class="ph"><span class="t" id="valTitle">PIXEL</span></div>
    <div class="sl"><div class="r1"><span id="v1Nm">Gr&#246;&#223;e</span><span class="v" id="v1Val">28 px</span></div>
      <input type="range" id="v1" min="1" max="200" value="28"></div>
    <div class="sl"><div class="r1"><span id="v2Nm">Deckkraft</span><span class="v" id="v2Val">80 %</span></div>
      <input type="range" id="v2" min="0" max="100" value="80"></div>
    <div class="ph"><span class="t">FARBE</span></div>
    <div id="swatches"></div>

<script>
'use strict';
/* ════════════════════════════════════════════════════════════════════
   K-OS LINSE — eine Arbeit, drei Sichten (+ Ablage darüber)
   Stapel & Ebenentypen · Linsenwechsel · Geister/Durchblick ·
   Übergaben · Werkzeugrad (Prototyp VII, Stiftknopf = Radierer)
   ════════════════════════════════════════════════════════════════════ */
var $=function(id){return document.getElementById(id);};

/* ══════════ LINSEN & TYPEN ══════════ */
var LENS={
  draw:  {nm:'DRAW',  sicht:'Pixel',  typ:'pixel',  c:'#e05050', cc:'var(--draw)'},
  vektor:{nm:'VEKTOR',sicht:'Pfade',  typ:'pfade',  c:'#26d97a', cc:'var(--vektor)'},
  studio:{nm:'STUDIO',sicht:'Layout', typ:'layout', c:'#f2af0d', cc:'var(--studio)'}
};
var TYPC={pixel:'#e05050',pfade:'#26d97a',layout:'#f2af0d',material:'#2a8fa8'};
var TYPNM={pixel:'Pixel',pfade:'Pfade',layout:'Layout',material:'Material'};

/* ══════════ DOKUMENTMODELL ══════════
   Ebene: {id, typ, name, opacity 0..1, visible, locked, vorlage, data}
   pixel : data.cv = Offscreen-Canvas (Dokumentgröße)
   pfade : data.paths = [{pts:[{x,y}], w, col, closed}]
   layout: data.els = [{kind:'text'|'frame'|'bar', x,y,w,h, text?, size?, track?, col, dash?}]
   material: data.img (Image/Canvas), data.src (dataURL)                 */
var doc=null, uidN=1;
function uid(){ return 'e'+(uidN++); }
function mkLayer(typ,name,data){
  return {id:uid(),typ:typ,name:name,opacity:1,visible:true,
          locked:typ==='material',vorlage:false,data:data||{}};
}
function pixelLayer(name){
  var cv=document.createElement('canvas'); cv.width=doc.w; cv.height=doc.h;
  var l=mkLayer('pixel',name,{cv:cv}); return l;
}
function newDoc(name,w,h){
  doc={name:name,w:w,h:h,stack:[],staende:[]};
  return doc;
}
/* Stapel: Index 0 = unten. Aktive Ebene je Linse gemerkt. */
var activeByLens={draw:null,vektor:null,studio:null};
function layersOf(typ){ return doc.stack.filter(function(l){return l.typ===typ;}); }
function layerById(id){ for(var i=0;i<doc.stack.length;i++) if(doc.stack[i].id===id) return doc.stack[i]; return null; }
function activeLayer(){
  var id=activeByLens[lens]; var l=id&&layerById(id);
  if(l && l.typ===LENS[lens].typ && !l.vorlage) return l;
  var c=layersOf(LENS[lens].typ).filter(function(x){return !x.vorlage;});
  l=c.length?c[c.length-1]:null;
  activeByLens[lens]=l?l.id:null; return l;
}

/* ══════════ DEMO-DOKUMENT (wandbild_bahnhof) ══════════ */
function demoDoc(){
  newDoc('wandbild_bahnhof',1600,760);
  var mat=mkLayer('material','foto_wand_01',{});
  var mc=document.createElement('canvas'); mc.width=doc.w; mc.height=doc.h;
  var g=mc.getContext('2d');
  g.fillStyle='#e8e6e1'; g.fillRect(0,0,doc.w,doc.h);
  g.fillStyle='#dedbd5';
  for(var y=110;y<doc.h;y+=150){ g.fillRect(0,y,doc.w,2); }
  mat.data.img=mc; mat.data.src=null;
  var skizze=pixelLayer('Skizze'); skizze.opacity=0.30;
  var sg=skizze.data.cv.getContext('2d');
  sg.strokeStyle='#8a8a8a'; sg.lineWidth=4; sg.setLineDash([14,12]);
  sg.beginPath(); sg.moveTo(180,600);
  sg.bezierCurveTo(420,180,700,180,860,430);
  sg.bezierCurveTo(980,610,1180,600,1330,470); sg.stroke();
  var flaeche=pixelLayer('Farbfläche'); flaeche.opacity=0.72;
  var fg=flaeche.data.cv.getContext('2d');
  fg.fillStyle='#f2b8bd'; fg.beginPath(); fg.moveTo(200,640);
  fg.bezierCurveTo(430,230,690,240,850,450);
  fg.bezierCurveTo(970,600,1160,590,1300,480);
  fg.lineTo(1300,640); fg.closePath(); fg.fill();
  var tusche=pixelLayer('Kontur Tusche');
  var tg=tusche.data.cv.getContext('2d');
  tg.strokeStyle='#101d14'; tg.lineWidth=16; tg.lineCap='round';
  tg.beginPath(); tg.moveTo(230,610);
  tg.bezierCurveTo(450,210,680,220,840,440);
  tg.bezierCurveTo(960,600,1150,580,1290,470); tg.stroke();
  var fuchs=mkLayer('pfade','Fuchs Outline',{paths:[
    {pts:[{x:470,y:330},{x:560,y:250},{x:640,y:330},{x:600,y:400},{x:500,y:400}],w:5,col:'#1c7a4b',closed:true}
  ]});
  var schrift=mkLayer('pfade','Schriftzug',{paths:bahnhofPaths()});
  var balken=mkLayer('layout','Balken rot',{els:[
    {kind:'bar',x:150,y:275,w:330,h:26,col:'#d92626'}
  ]});
  var titel=mkLayer('layout','Titelrahmen',{els:[
    {kind:'frame',x:140,y:80,w:1000,h:150,col:'#3d4a56',dash:true},
    {kind:'text',x:170,y:118,w:900,h:90,text:'WANDBILD',size:96,track:1.4,col:'#2a2f35'},
    {kind:'frame',x:140,y:600,w:1000,h:90,col:'#3d4a56',dash:true},
    {kind:'text',x:170,y:622,w:900,h:50,text:'BAHNHOF · 12 × 4 M · 2026',size:34,track:3.5,col:'#7c828a'}
  ]});
  doc.stack=[mat,skizze,flaeche,tusche,fuchs,schrift,balken,titel];
  activeByLens={draw:tusche.id,vektor:schrift.id,studio:titel.id};
}
function bahnhofPaths(){
  /* grober Schriftzug als offene Pfade */
  var out=[],x=300,y=660,s=58;
  'BAHNHOF'.split('').forEach(function(ch,i){
    var bx=x+i*s*1.35;
    out.push({pts:[{x:bx,y:y},{x:bx,y:y-s},{x:bx+s*0.8,y:y-s},{x:bx+s*0.8,y:y}],w:6,col:'#1c7a4b',closed:false});
  });
  return out;
}

/* ══════════ VIEWPORT · Zoom · Verschieben · Drehen ══════════
   Mathematik wie in K-OS Draw: ox/oy/scale/rot, w2s und s2w.
   Bleibt über den Linsenwechsel unverändert stehen.              */
var view={ox:0,oy:0,scale:0.6,rot:0};
var stage=$('stage'), sctx=null;
var clamp=function(v,a,b){ return Math.max(a,Math.min(b,v)); };
function w2s(p){
  var c=Math.cos(view.rot), s=Math.sin(view.rot);
  return {x:(p.x*c-p.y*s)*view.scale+view.ox, y:(p.x*s+p.y*c)*view.scale+view.oy};
}
function s2w(x,y){
  var c=Math.cos(view.rot), s=Math.sin(view.rot);
  var dx=(x-view.ox)/view.scale, dy=(y-view.oy)/view.scale;
  return {x:dx*c+dy*s, y:-dx*s+dy*c};
}
function fitView(){
  var r=$('stagewrap').getBoundingClientRect(), pad=56;
  view.rot=0;
  view.scale=Math.max(0.05,Math.min((r.width-pad)/doc.w,(r.height-pad)/doc.h));
  view.ox=(r.width-doc.w*view.scale)/2;
  view.oy=(r.height-doc.h*view.scale)/2;
}
function rotateBy(deg){
  var r=$('stagewrap').getBoundingClientRect();
  var c={x:r.width/2,y:r.height/2}, wc=s2w(c.x,c.y);
  view.rot+=deg*Math.PI/180;
  var p=w2s(wc);
  view.ox+=c.x-p.x; view.oy+=c.y-p.y;
  req();
}
function toDoc(cx,cy){
  var r=stage.getBoundingClientRect();
  return s2w(cx-r.left,cy-r.top);
}

/* ══════════ GEIST-CACHE ══════════
   Je Typ eine einmal gerenderte Bildebene; neu nur bei Änderung. */
var ghostCache={pixel:null,pfade:null,layout:null};
var ghostRev={pixel:0,pfade:0,layout:0,material:0};
var ghostBuilt={pixel:-1,pfade:-1,layout:-1};
function invalidate(typ){
  if(typ in ghostRev) ghostRev[typ]++;
  tlDirty=true;                       /* für den Zeitraffer: hier hat sich etwas getan */
}
/* Deckkraft und Mischmodus einer Ebene, Gruppe eingerechnet */
function grpOf(l){ return l.group?(doc.groups||[]).filter(function(g){return g.id===l.group;})[0]:null; }
function layerVisible(l){
  if(!l.visible) return false;
  var G=grpOf(l);
  return !(G&&G.visible===false);
}
function layerAlpha(l){
  var a=l.opacity*(l.vorlage?0.5:1);
  var G=grpOf(l);
  if(G&&typeof G.opacity==='number') a*=G.opacity;
  return a;
}
function layerBlend(l){ return l.blend||'source-over'; }
function buildGhost(typ){
  if(ghostBuilt[typ]===ghostRev[typ] && ghostCache[typ]) return ghostCache[typ];
  var cv=ghostCache[typ];
  if(!cv){ cv=document.createElement('canvas'); ghostCache[typ]=cv; }
  cv.width=doc.w; cv.height=doc.h;
  var g=cv.getContext('2d');
  doc.stack.forEach(function(l){
    if(l.typ!==typ||!layerVisible(l)) return;
    g.globalAlpha=layerAlpha(l);
    drawLayer(g,l,true);
  });
  g.globalAlpha=1;
  ghostBuilt[typ]=ghostRev[typ];
  return cv;
}

/* ══════════ EBENEN ZEICHNEN ══════════ */
function drawLayer(g,l,asGhost){
  if(l.typ==='pixel'){ g.drawImage(l.data.cv,0,0); return; }
  if(l.typ==='material'){
    if(!l.data.img) return;
    var r=l.data.rect;
    if(r) g.drawImage(l.data.img,r.x,r.y,r.w,r.h);
    else g.drawImage(l.data.img,0,0,doc.w,doc.h);
    return;
  }
  if(l.typ==='pfade'){
    l.data.paths.forEach(function(p){
      if(!p.pts.length) return;
      if(typeof paintPath==='function') paintPath(g,p,asGhost);
      else {
        g.strokeStyle=asGhost?'#7d8a86':p.col; g.lineWidth=p.w; g.lineCap='round'; g.lineJoin='round';
        g.beginPath(); g.moveTo(p.pts[0].x,p.pts[0].y);
        for(var i=1;i<p.pts.length;i++) g.lineTo(p.pts[i].x,p.pts[i].y);
        if(p.closed) g.closePath();
        g.stroke();
      }
    });
    return;
  }
  if(l.typ==='layout'){
    l.data.els.forEach(function(e){
      var col=asGhost?'#8a94a0':e.col;
      if(e.kind==='bar'){ g.fillStyle=col; g.fillRect(e.x,e.y,e.w,e.h); }
      else if(e.kind==='frame'){
        g.strokeStyle=col; g.lineWidth=4; g.setLineDash(e.dash?[16,12]:[]);
        g.strokeRect(e.x,e.y,e.w,e.h); g.setLineDash([]);
      } else if(e.kind==='text'){
        if(typeof drawTextEl==='function') drawTextEl(g,e,col);
        else {
          g.fillStyle=col;
          g.font='700 '+e.size+'px "Archivo","Roboto Condensed",sans-serif';
          var tr=(e.track||0)*e.size*0.06, cx=e.x;
          String(e.text).split('').forEach(function(ch){
            g.fillText(ch,cx,e.y+e.size*0.82);
            cx+=g.measureText(ch).width+tr;
          });
        }
      }
    });
  }
}

/* ══════════ KOMPOSITION ══════════ */
var seeThrough=null;   /* 'pixel'|'pfade'|'layout' während "halten = durchsehen" */
var durchblick=30;
function render(){
  if(!sctx) return;
  var r=$('stagewrap').getBoundingClientRect();
  if(stage.width!==Math.round(r.width)||stage.height!==Math.round(r.height)){
    stage.width=Math.round(r.width); stage.height=Math.round(r.height);
  }
  var g=sctx;
  /* Zustand hart zurücksetzen: kein Beschnitt, kein Schatten, keine
     Deckkraft aus dem vorigen Bild darf überleben.                  */
  while(sctxDepth>0){ g.restore(); sctxDepth--; }
  g.setTransform(1,0,0,1,0,0);
  g.globalAlpha=1; g.globalCompositeOperation='source-over';
  g.shadowColor='transparent'; g.shadowBlur=0; g.shadowOffsetX=0; g.shadowOffsetY=0;
  g.fillStyle='#0c0e10'; g.fillRect(0,0,stage.width,stage.height);
  var vc=Math.cos(view.rot), vs=Math.sin(view.rot), z=view.scale;
  g.setTransform(z*vc,z*vs,-z*vs,z*vc,view.ox,view.oy);
  /* Blattkante: gestapelte Halbtöne statt eines Canvas-Schattens —
     so kann sich nichts davon auf die Striche legen.               */
  var sh=Math.max(1,6/z);
  g.fillStyle='rgba(0,0,0,.20)'; g.fillRect(-sh,-sh*0.4,doc.w+sh*2,doc.h+sh*2);
  g.fillStyle='rgba(0,0,0,.14)'; g.fillRect(-sh*0.5,0,doc.w+sh,doc.h+sh*1.2);
  g.fillStyle='#eceae6'; g.fillRect(0,0,doc.w,doc.h);
  g.save(); sctxDepth++; g.beginPath(); g.rect(0,0,doc.w,doc.h); g.clip();
  var own=LENS[lens].typ;
  /* 1. Material immer voll */
  doc.stack.forEach(function(l){
    if(l.typ!=='material'||!layerVisible(l)) return;
    g.globalAlpha=layerAlpha(l); drawLayer(g,l,false);
  });
  /* 2. Geister der fremden Typen (zwischengespeichert) */
  ['pixel','pfade','layout'].forEach(function(t){
    if(t===own) return;
    var a=(seeThrough===t)?1:durchblick/100;
    if(a<=0.001) return;
    g.globalAlpha=a; g.drawImage(buildGhost(t),0,0);
  });
  /* 3. Eigene Ebenen voll, in Stapelreihenfolge —
        der laufende Strich liegt live auf seiner Ebene */
  doc.stack.forEach(function(l){
    if(l.typ!==own||!layerVisible(l)) return;
    g.globalAlpha=layerAlpha(l);
    g.globalCompositeOperation=layerBlend(l);
    drawLayer(g,l,false);
    if(typeof brushRun!=='undefined'&&brushRun&&brushRun.l===l&&!brushRun.erase&&strokeCv){
      g.globalAlpha=layerAlpha(l)*clamp(VALS.draw.v2.val/100,0,1);
      g.drawImage(strokeCv,0,0);
    }
    g.globalCompositeOperation='source-over';
  });
  /* schwebende Auswahl liegt über allem */
  if(typeof floatPix!=='undefined'&&floatPix){
    g.globalAlpha=1;
    g.save();
    var fw=floatPix.w||floatPix.cv.width, fh=floatPix.h||floatPix.cv.height;
    g.translate(floatPix.x+fw/2,floatPix.y+fh/2);
    if(floatPix.rot) g.rotate(floatPix.rot);
    g.drawImage(floatPix.cv,-fw/2,-fh/2,fw,fh);
    g.restore();
  }
  g.globalAlpha=1;
  if(typeof drawSheetAids==='function') drawSheetAids(g);
  g.restore(); sctxDepth--;
  drawOverlays(g);
  g.setTransform(1,0,0,1,0,0);
}
var sctxDepth=0;
var raf=0;
function req(){ if(raf) return; raf=requestAnimationFrame(function(){raf=0;render();}); }
</script>

/* Sofortbefehle auf dem ausgewählten Pfad */
function pathAct(k){
  var l=activeLayer();
  if(!l||l.typ!=='pfade'){ toast('Nur in der Pfade-Linse'); return; }
  if(!overlaySel||overlaySel.layerId!==l.id){ toast('Erst einen Pfad ausw\u00E4hlen (Auswahl-Werkzeug)'); return; }
  var i=overlaySel.idx, p=l.data.paths[i];
  if(!p){ toast('Pfad nicht gefunden'); return; }
  var keepSel=overlaySel; snapLayer(l); overlaySel=keepSel;
  if(k==='smooth'){ p.pts=smoothPts(p.pts,70); toast('Pfad gegl\u00E4ttet'); }
  else if(k==='simplify'){ var n0=p.pts.length; p.pts=simplify(p.pts,2.2); toast('Vereinfacht: '+n0+' \u2192 '+p.pts.length+' Punkte'); }
  else if(k==='close'){ p.closed=!p.closed; toast(p.closed?'Pfad geschlossen':'Pfad ge\u00F6ffnet'); }
  else if(k==='dup'){
    var c={pts:p.pts.map(function(q){return {x:q.x+14,y:q.y+14};}),w:p.w,col:p.col,closed:p.closed};
    l.data.paths.splice(i+1,0,c); overlaySel={layerId:l.id,idx:i+1}; toast('Pfad dupliziert');
  }
  else if(k==='del'){ l.data.paths.splice(i,1); overlaySel=null; toast('Pfad gel\u00F6scht'); }
  else if(k==='front'){ if(i<l.data.paths.length-1){ var m=l.data.paths.splice(i,1)[0]; l.data.paths.push(m); overlaySel={layerId:l.id,idx:l.data.paths.length-1}; toast('Nach vorn'); } }
  else if(k==='back'){ if(i>0){ var m2=l.data.paths.splice(i,1)[0]; l.data.paths.unshift(m2); overlaySel={layerId:l.id,idx:0}; toast('Nach hinten'); } }
  invalidate('pfade'); autosaveSoon(); req();
}
/* Sofortbefehle auf dem ausgewählten Layout-Element */
function elAct(k){
  var l=activeLayer();
  if(!l||l.typ!=='layout'){ toast('Nur in der Layout-Linse'); return; }
  if(!overlaySel||overlaySel.layerId!==l.id){ toast('Erst ein Element ausw\u00E4hlen'); return; }
  var i=overlaySel.idx, e=l.data.els[i];
  if(!e){ toast('Element nicht gefunden'); return; }
  var keepEl=overlaySel; snapLayer(l); overlaySel=keepEl;
  if(k==='alignL'){ e.x=doc.w*0.08; toast('Links ausgerichtet'); }
  else if(k==='alignC'){ e.x=(doc.w-e.w)/2; toast('Mittig ausgerichtet'); }
  else if(k==='alignR'){ e.x=doc.w*0.92-e.w; toast('Rechts ausgerichtet'); }
  else if(k==='front'){ if(i<l.data.els.length-1){ var m=l.data.els.splice(i,1)[0]; l.data.els.push(m); overlaySel={layerId:l.id,idx:l.data.els.length-1}; toast('Nach vorn'); } }
  else if(k==='back'){ if(i>0){ var m2=l.data.els.splice(i,1)[0]; l.data.els.unshift(m2); overlaySel={layerId:l.id,idx:0}; toast('Nach hinten'); } }
  else if(k==='dup'){ var c=cloneEl(e); c.x+=20; c.y+=20; l.data.els.splice(i+1,0,c); overlaySel={layerId:l.id,idx:i+1}; toast('Element dupliziert'); }
  else if(k==='del'){ l.data.els.splice(i,1); overlaySel=null; toast('Element gel\u00F6scht'); }

}

          gh.querySelector('.tw').addEventListener('click',function(ev){

/* ══════════ TOAST ══════════ */

function toast(m){
  var t=$('toast'); t.innerHTML=m; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove('show');},2400);
}

/* ══════════ EINGABE AUF DER FLÄCHE ══════════ */
var drag=null;      /* aktueller Zeichen-/Bewegungsvorgang */
var overlaySel=null;/* Auswahl im Vektor/Studio: {layerId, idx} */
function drawOverlays(g){
  drawMatFrame(g);
  if(lens!=='studio') drawGuides(g);
  if(lens!=='studio') drawGuideHandles(g);
  if(lens==='draw'){
    drawSelOutline(g);
    drawSelHandles(g);
    if(drag&&drag.kind==='lasso'&&drag.pts.length>1){
      g.save();
      g.strokeStyle=LENS[lens].c; g.lineWidth=1.6/view.scale;
      g.setLineDash([6/view.scale,4/view.scale]);
      g.beginPath(); g.moveTo(drag.pts[0].x,drag.pts[0].y);
      for(var li=1;li<drag.pts.length;li++) g.lineTo(drag.pts[li].x,drag.pts[li].y);
      g.stroke(); g.setLineDash([]); g.restore();
    }
    if(drag&&drag.kind==='selRect'&&drag.cur){
      g.save();
      g.strokeStyle=LENS[lens].c; g.lineWidth=1.6/view.scale;
      g.setLineDash([6/view.scale,4/view.scale]);
      g.strokeRect(Math.min(drag.start.x,drag.cur.x),Math.min(drag.start.y,drag.cur.y),
                   Math.abs(drag.cur.x-drag.start.x),Math.abs(drag.cur.y-drag.start.y));
      g.setLineDash([]); g.restore();
    }
  }
  /* Live-Vorschau des laufenden Pfades */
  if(drag&&drag.kind==='path'&&drag.pts.length>1){
    g.strokeStyle=color; g.lineWidth=VALS.vektor.v1.val; g.lineCap='round'; g.lineJoin='round';
    g.beginPath(); g.moveTo(drag.pts[0].x,drag.pts[0].y);
    for(var i=1;i<drag.pts.length;i++) g.lineTo(drag.pts[i].x,drag.pts[i].y);
    g.stroke();
  }
  /* Knoten der ausgewählten Pfad-/Layout-Objekte */
  if(!overlaySel) return;
  var l=layerById(overlaySel.layerId); if(!l||l.typ!==LENS[lens].typ) return;
  g.lineWidth=2/view.scale;
  if(l.typ==='pfade'){
    var p=l.data.paths[overlaySel.idx]; if(!p) return;
    g.strokeStyle=LENS[lens].c;
    p.pts.forEach(function(pt,i){
      g.fillStyle=(i===overlaySel.pt)?LENS[lens].c:'#ffffff';
      g.strokeRect(pt.x-8/view.scale,pt.y-8/view.scale,16/view.scale,16/view.scale);
      g.fillRect(pt.x-6/view.scale,pt.y-6/view.scale,12/view.scale,12/view.scale);
    });
  } else if(l.typ==='layout'){
    var e=l.data.els[overlaySel.idx]; if(!e) return;
    g.strokeStyle=LENS[lens].c; g.setLineDash([8/view.scale,6/view.scale]);
    g.strokeRect(e.x,e.y,e.w,e.h); g.setLineDash([]);
  }
}
function hitPath(l,pt){
  for(var i=l.data.paths.length-1;i>=0;i--){
    var p=l.data.paths[i];
    for(var j=0;j<p.pts.length;j++){
      var d=Math.hypot(p.pts[j].x-pt.x,p.pts[j].y-pt.y);
      if(d<14/view.scale+p.w) return {idx:i,pt:j};
    }
  }
  return null;
}
function hitEl(l,pt){
  for(var i=l.data.els.length-1;i>=0;i--){
    var e=l.data.els[i];
    if(pt.x>=e.x-8&&pt.x<=e.x+e.w+8&&pt.y>=e.y-8&&pt.y<=e.y+e.h+8) return {idx:i};
  }
  return null;
}
function smoothPts(pts,amt){
  if(pts.length<3||amt<=0) return pts;
  var k=Math.min(0.92,amt/110), out=[pts[0]];
  for(var i=1;i<pts.length;i++){
    var pr=out[i-1];
    out.push({x:pr.x+(pts[i].x-pr.x)*(1-k),
              y:pr.y+(pts[i].y-pr.y)*(1-k),
              p:(pts[i].p==null?pr.p:pts[i].p)});      /* Druck bleibt am Punkt */
  }
  return out;
}

/* ══════════════════════════════════════════════════════════════════
   EINGABE — übernommen aus K-OS Draw v29
   · Finger bedienen ausschließlich die Ansicht (1 schieben, 2 zoomen +
     drehen, 3 wischen, 4 einpassen). Gezeichnet wird nur mit Stift,
     Maus oder nach Doppeltipp-Halten ausdrücklich mit dem Finger.
   · Die Stifttaste meldet sich auf mehreren Kanälen. Entscheidend ist
     der Bit-1-Impuls im Schweben (Druck 0): genau so erkennt Draw v29
     die Seitentaste. Sie schaltet den Radierer um.
   ══════════════════════════════════════════════════════════════════ */
var pointers=new Map();
var touchMode=null;          /* pan | zoom | swipe3 | four | pick1 | draw | ignore */
var pan=null, gest=null, swipe3=null, fourG=null, fingerDraw=null;
var tap1=null, pickHoldT=0, pick1=null;
var painting=false, strokePid=null;

/* ── Stiftkanäle ───────────────────────────────────────────────── */
var prevTool={draw:'brush',vektor:'pen',studio:'text'};
var lastBtns=0, hoverBtns=0, strokeMaxBtns=0, b1LastRise=0, penGuard=0;
var lastPress=0, lastTilt=0, lastPtrType='', lastTiltNorm=0;
function isPenBtn(e){
  if(e.pointerType==='touch') return false;
  return e.button===5||e.button===2||((e.buttons&2)!==0)||((e.buttons&4)!==0);
}
function penErase(e){ return e.pointerType==='pen'&&((e.buttons&32)===32); }  /* Radierer-Ende des Stifts */
function trackButtons(e,src){
  if(e.pointerType!=='pen'&&e.pointerType!=='mouse') return;
  lastPtrType=e.pointerType;          /* Stift schwebt bereits -> Ersatzkanäle dürfen wieder umschalten */
  var prev=lastBtns;
  if(e.buttons!==prev) diag(src+' buttons '+prev+' \u2192 '+e.buttons+(typeof e.button==='number'?' (button '+e.button+')':''));
  lastBtns=e.buttons;
  if(typeof e.pressure==='number') lastPress=e.pressure;
  if(e.tiltX!==undefined){
    lastTilt=Math.round(Math.max(Math.abs(e.tiltX||0),Math.abs(e.tiltY||0)));
    lastTiltNorm=clamp(lastTilt/60,0,1);
  }
  if(!painting&&e.type!=='pointerdown'){
    /* Bit 1 kommt beim Wacom-Stift nur als Impuls und fällt vor dem
       Aufsetzen zurück — deshalb als Umschalter werten, nur im echten
       Schweben (Druck 0, keine Aufsetz-Flanke).                       */
    if(((e.buttons&1)===1)&&((prev&1)===0)&&!(e.pressure>0)){
      var now=Date.now();
      if(now-b1LastRise>300){ b1LastRise=now; penBtnClick('Bit 1'); }
    }
    hoverBtns=e.buttons;                       /* Latch für Bit 2/4: halten und aufsetzen */
  }
  if(painting&&e.buttons>strokeMaxBtns) strokeMaxBtns=e.buttons;
}
var lastTouchT=0;
function touchActive(){ return touchList().length>0||Date.now()-lastTouchT<700; }
function penBtnClick(quelle){
  var now=Date.now();
  if(touchActive()){                           /* Finger auf dem Glas oder eben abgehoben:
                                                  kein Kanal darf umschalten */
    diag('Stifttaste verworfen \u2014 Finger aktiv ('+(quelle||'')+')');
    return false;
  }
  if(now-penGuard<150) return false;           /* derselbe Druck meldet sich mehrfach */
  penGuard=now;
  diag('Stifttaste \u2192 Radierer umschalten ('+(quelle||'pointer')+')');
  if(tool()==='eraser'){
    var back=prevTool[lens]||RING[lens][0];
    setTool(back);
    toast('Stifttaste: Radierer AUS \u2014 '+((TOOLDEF[back]||{}).nm||'Werkzeug'));
  } else {
    prevTool[lens]=tool();
    setTool('eraser');
    toast('Stifttaste: Radierer AN');
  }
  return true;
}
/* Alle Kanäle abhören, über die Android/Chrome Stifttasten melden */
if('onpointerrawupdate' in stage) stage.addEventListener('pointerrawupdate',function(e){ trackButtons(e,'raw  '); });
stage.addEventListener('pointerenter',function(e){ trackButtons(e,'hover'); });
stage.addEventListener('pointerleave',function(e){ if(e.pointerType==='pen'&&!painting) hoverBtns=0; });
/* Langes Drücken mit dem Finger löst auf Android das Kontextmenü aus.
   Es wird ausnahmslos unterdrückt und ist KEIN Tastenkanal mehr —
   die Seitentaste meldet sich zuverlässig über die Pointer-Bits.      */
document.addEventListener('contextmenu',function(e){ e.preventDefault(); },true);
document.addEventListener('selectstart',function(e){
  if(e.target&&e.target.tagName==='INPUT') return;
  e.preventDefault();
},true);
/* Nur auf der Leinwand: verhindert Lupe/Auswahl beim Halten. Rad, Fächer und
   Fenster liegen darüber und behalten ihre Tipps — deshalb NICHT auf stagewrap. */
stage.addEventListener('touchstart',function(e){ e.preventDefault(); },{passive:false});
stage.addEventListener('touchmove',function(e){ e.preventDefault(); },{passive:false});
$('stagewrap').addEventListener('dragstart',function(e){ e.preventDefault(); });
$('stagewrap').addEventListener('auxclick',function(e){
  e.preventDefault();
  if(touchActive()||lastPtrType==='touch') return;
  if(e.button===1||e.button===2||e.button===5) penBtnClick('auxclick');
});
document.addEventListener('keydown',function(e){
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')) return;
  diag('keydown key="'+e.key+'" code='+e.code);
},true);

/* ── Diagnose (wie in Draw v29: zeigt, was der Stift wirklich meldet) ── */
var diagLines=[], diagOn=false;
function diag(m){
  var t=new Date();
  diagLines.unshift(String(t.getMinutes()).padStart(2,'0')+':'+String(t.getSeconds()).padStart(2,'0')+'  '+m);
  if(diagLines.length>16) diagLines.pop();
  if(diagOn) renderDiag();
}
function renderDiag(){
  var el=$('diagBox'); if(!el) return;
  el.innerHTML='<b>Tasten jetzt '+lastBtns+' \u00B7 max im Strich '+strokeMaxBtns
    +' \u00B7 Schweben '+hoverBtns+' \u00B7 Druck '+lastPress.toFixed(2)+' \u00B7 Neigung '+lastTilt+'\u00B0</b><br>'
    +diagLines.join('<br>');
}
function toggleDiag(){
  diagOn=!diagOn;
  $('diagBox').style.display=diagOn?'block':'none';
  if(diagOn) renderDiag();
}

/* ── Finger: Ansicht statt Zeichnen ───────────────────────────────── */
function touchList(){
  var a=[]; pointers.forEach(function(p){ if(p.type==='touch') a.push(p); }); return a;
}
function touchAvg(){
  var ts=touchList(), x=0, y=0;
  ts.forEach(function(p){ x+=p.x; y+=p.y; });
  return {x:x/(ts.length||1), y:y/(ts.length||1), n:ts.length, ts:ts};
}
function startGesture(){
  var ts=touchList(); if(ts.length<2) return;
  var a=ts[0], b=ts[1];
  gest={d0:Math.hypot(b.x-a.x,b.y-a.y), a0:Math.atan2(b.y-a.y,b.x-a.x),
        mid0:{x:(a.x+b.x)/2,y:(a.y+b.y)/2}, v0:{ox:view.ox,oy:view.oy,scale:view.scale,rot:view.rot}, wmid:null,
        t0:Date.now(), moved:false};
  var c=Math.cos(gest.v0.rot), s=Math.sin(gest.v0.rot);
  var dx=(gest.mid0.x-gest.v0.ox)/gest.v0.scale, dy=(gest.mid0.y-gest.v0.oy)/gest.v0.scale;
  gest.wmid={x:dx*c+dy*s, y:-dx*s+dy*c};
  if(drag){ drag=null; }                        /* Geste bricht einen versehentlichen Strich ab */
}
function updateGesture(){
  var ts=touchList(); if(ts.length<2||!gest) return;
  var a=ts[0], b=ts[1];
  var d=Math.hypot(b.x-a.x,b.y-a.y), ang=Math.atan2(b.y-a.y,b.x-a.x);
  var mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
  var dr=ang-gest.a0;
  while(dr>Math.PI) dr-=2*Math.PI;
  while(dr<-Math.PI) dr+=2*Math.PI;
  var rot=gest.v0.rot+(Math.abs(dr)>0.12?dr:0);          /* kleine Totzone gegen Zittern */
  var snap=Math.round(rot/(Math.PI/2))*(Math.PI/2);
  if(Math.abs(rot-snap)<7*Math.PI/180) rot=snap;         /* rastet bei 0/90/180/270° ein */
  if(Math.hypot(mid.x-gest.mid0.x,mid.y-gest.mid0.y)>14||Math.abs(d/gest.d0-1)>0.06||Math.abs(dr)>0.14) gest.moved=true;
  var scale=clamp(gest.v0.scale*(d/Math.max(1,gest.d0)),0.05,16);
  var c=Math.cos(rot), s=Math.sin(rot), wm=gest.wmid;
  view.rot=rot; view.scale=scale;
  view.ox=mid.x-(wm.x*c-wm.y*s)*scale;
  view.oy=mid.y-(wm.x*s+wm.y*c)*scale;
  req();
}
function startSwipe3(){ var a=touchAvg(); swipe3={t0:Date.now(),x0:a.x,y0:a.y,x:a.x,y:a.y}; }
function evalTap3(){
  if(!swipe3) return false;
  var moved=Math.hypot(swipe3.x-swipe3.x0,swipe3.y-swipe3.y0);
  if(Date.now()-swipe3.t0<320&&moved<16){ doRedo(); return true; }
  return false;
}
function updateSwipe3(){ if(!swipe3) return; var a=touchAvg(); swipe3.x=a.x; swipe3.y=a.y; }
function evalSwipe3(){
  if(!swipe3) return;
  var dt=Date.now()-swipe3.t0, dy=swipe3.y-swipe3.y0, dx=swipe3.x-swipe3.x0;
  if(dt<900&&Math.abs(dy)>=90&&Math.abs(dy)>1.8*Math.abs(dx)){
    if(dy>0){ toast('Geste: speichern'); saveKos(); }
    else { toast('Geste: Ausgabe'); ausgabe(); }
  }
}
function startFour(){
  var a=touchAvg(), d=0;
  a.ts.forEach(function(t){ d+=Math.hypot(t.x-a.x,t.y-a.y); });
  fourG={d0:Math.max(30,d/(a.n||1)),t0:Date.now(),fired:false};
}
function updateFour(){
  if(!fourG||fourG.fired) return;
  var a=touchAvg(); if(a.n<4) return;
  var d=0; a.ts.forEach(function(t){ d+=Math.hypot(t.x-a.x,t.y-a.y); });
  d/=a.n;
  if(Math.abs(d/fourG.d0-1)>0.25&&Date.now()-fourG.t0<700){
    fourG.fired=true; touchMode='ignore';
    fitView(); toast('Einpassen'); req();
  }
}
function startPick1(){
  var p=touchList()[0]; if(!p) return;
  touchMode='pick1';
  pick1={x:p.x,y:p.y};
  pickAt(s2w(p.x,p.y));
  showPickDot(p.x,p.y);
  toast('Pipette \u2014 Finger schieben, dann loslassen');
}
function updatePick1(){
  var p=touchList()[0]; if(!p||!pick1) return;
  pick1.x=p.x; pick1.y=p.y;
  pickAt(s2w(p.x,p.y));
  showPickDot(p.x,p.y);
}
function showPickDot(x,y){
  var el=$('pickDot');
  el.style.display='block';
  el.style.left=x+'px'; el.style.top=y+'px';
  el.style.background=color;
}
function hidePickDot(){ $('pickDot').style.display='none'; }
function fingerBegin(){
  if(!fingerDraw||fingerDraw.active) return;
  fingerDraw.active=true;
  var l=activeLayer();
  if(!l||l.typ!=='pixel'){ toast('Wischfinger gibt es in der Pixel-Linse'); fingerDraw=null; touchMode='ignore'; return; }
  if(l.vorlage){ toast('\u201E'+l.name+'\u201C ist eine Vorlage'); fingerDraw=null; touchMode='ignore'; return; }
  var pt=s2w(fingerDraw.x,fingerDraw.y);
  preSnap(l);
  drag={kind:'fx',l:l,fx:'smudge',last:pt,start:pt,id:fingerDraw.id,bb:null};
  painting=true; strokePid=fingerDraw.id;
  fxStart(l,pt,0.85);
  fxDab(l,pt,0.85); req();
  toast('Wischfinger');
}

/* ══════════ POINTER-VERTEILUNG ══════════ */
stage.addEventListener('pointerdown',function(e){
  e.preventDefault();
  lastPtrType=e.pointerType;
  var r=stage.getBoundingClientRect();
  var l={x:e.clientX-r.left,y:e.clientY-r.top};
  pointers.set(e.pointerId,{x:l.x,y:l.y,type:e.pointerType});

  /* ─ Finger ─ */
  if(e.pointerType==='touch'){
    lastTouchT=Date.now();
    var n=touchList().length;
    if(painting) return;                                  /* Handballen wird ignoriert, während der Stift malt */
    if(touchMode==='draw') return;
    if(n===1&&tap1&&Date.now()-tap1.t<350&&Math.hypot(l.x-tap1.x,l.y-tap1.y)<40){
      tap1=null; clearTimeout(pickHoldT);                 /* Doppeltipp + Halten: Finger wird Zeichenfinger */
      touchMode='draw';
      fingerDraw={id:e.pointerId,x:l.x,y:l.y,active:false,timer:setTimeout(fingerBegin,130)};
      try{ stage.setPointerCapture(e.pointerId); }catch(err){}
      return;
    }
    if(n>=2) tap1=null;
    if(n>=4){ gest=null; swipe3=null; pan=null; clearTimeout(pickHoldT); startFour(); touchMode='four'; return; }
    if(touchMode==='ignore') return;
    if(n===1){
      pan={id:e.pointerId,x:l.x,y:l.y,ox:view.ox,oy:view.oy,moved:false,t0:Date.now()};
      touchMode='pan';
      clearTimeout(pickHoldT);
      pickHoldT=setTimeout(function(){ if(touchMode==='pan'&&pan&&!pan.moved) startPick1(); },450);
      return;
    }
    if(n===2){ pan=null; clearTimeout(pickHoldT); startGesture(); touchMode='zoom'; return; }
    if(n===3){ gest=null; startSwipe3(); touchMode='swipe3'; return; }
    return;
  }

  /* ─ Stift / Maus ─ */
  strokeMaxBtns=e.buttons; trackButtons(e,'down ');
  if(isPenBtn(e)&&!(e.pressure>0)){ penBtnClick('pointerdown'); return; }   /* Taste im Schweben: nur umschalten */
  radOnTouch();
  var pt=toDoc(e.clientX,e.clientY);
  /* Die Stifttaste schaltet um (siehe penBtnClick) — ein „halten und
     aufsetzen"-Sonderweg ist ausdrücklich nicht gewünscht. Nur das
     umgedrehte Stiftende radiert unmittelbar.                        */
  var erase=penErase(e)||e.pointerType==='eraser';
  var dbl=(Date.now()-lastTap.t<380&&Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)<26);
  lastTap={t:Date.now(),x:e.clientX,y:e.clientY};
  try{ stage.setPointerCapture(e.pointerId); }catch(err){}
  beginStroke(pt,pressure(e),erase,e.pointerId,dbl);
});
stage.addEventListener('pointermove',function(e){
  var p=pointers.get(e.pointerId);
  if(p){ var r=stage.getBoundingClientRect(); p.x=e.clientX-r.left; p.y=e.clientY-r.top; }
  if(e.pointerType==='touch') lastTouchT=Date.now();
  else trackButtons(e,'move ');

  if(e.pointerType==='touch'){
    if(touchMode==='draw'){
      if(fingerDraw&&e.pointerId===fingerDraw.id){
        var rr=stage.getBoundingClientRect(), lx=e.clientX-rr.left, ly=e.clientY-rr.top;
        if(!fingerDraw.active){
          if(Math.hypot(lx-fingerDraw.x,ly-fingerDraw.y)>4){ clearTimeout(fingerDraw.timer); fingerBegin(); }
          else return;
        }
        moveStroke(s2w(lx,ly),0.85);
      }
      return;
    }
    if(touchMode==='pick1'){ updatePick1(); return; }
    if(touchMode==='four'){ updateFour(); return; }
    if(touchMode==='swipe3'){ updateSwipe3(); return; }
    if(touchMode==='ignore') return;
    if(gest){ updateGesture(); return; }
    if(pan&&e.pointerId===pan.id){
      var r2=stage.getBoundingClientRect(), mx=e.clientX-r2.left, my=e.clientY-r2.top;
      if(!pan.moved&&Math.hypot(mx-pan.x,my-pan.y)>12){ pan.moved=true; clearTimeout(pickHoldT); }
      view.ox=pan.ox+(mx-pan.x); view.oy=pan.oy+(my-pan.y);
      req(); return;
    }
    return;
  }
  radOnHover(e);
  if(!drag||e.pointerId!==drag.id) return;
  var evs=(e.getCoalescedEvents&&e.getCoalescedEvents().length)?e.getCoalescedEvents():[e];
  for(var i=0;i<evs.length;i++) moveStroke(toDoc(evs[i].clientX,evs[i].clientY),pressure(evs[i]));
});
function onPointerUp(e){
  var wasTouch=(e.pointerType==='touch');
  if(wasTouch) lastTouchT=Date.now();
  else trackButtons(e,'up   ');
  pointers.delete(e.pointerId);
  if(wasTouch){
    var m=touchList().length;
    if(touchMode==='draw'){
      if(fingerDraw){ clearTimeout(fingerDraw.timer); if(fingerDraw.active) endStroke(); fingerDraw=null; }
      touchMode=m>0?'ignore':null;
    } else if(touchMode==='pan'){
      clearTimeout(pickHoldT);
      if(pan&&!pan.moved&&Date.now()-pan.t0<250) tap1={x:pan.x,y:pan.y,t:Date.now()};
      pan=null; touchMode=m>0?'ignore':null;
    } else if(touchMode==='pick1'){
      pick1=null; touchMode=m>0?'ignore':null;
      hidePickDot();
      pushRecentCol(color); renderSwatches();
      if(typeof saveFarben==='function') saveFarben();
      toast('Farbe: '+String(color).toUpperCase());
    } else if(touchMode==='swipe3'){
      /* kurzer Tipp mit drei Fingern: Wieder vor */
      if(m===0){ if(!evalTap3()) evalSwipe3(); swipe3=null; touchMode=null; }
    } else if(touchMode==='zoom'){
      if(m<2){
        /* kurzer Tipp mit zwei Fingern, ohne Zoom/Drehung: Zurück */
        if(gest&&!gest.moved&&Date.now()-gest.t0<320){ doUndo(); }
        gest=null; touchMode=m>0?'ignore':null;
      }
    } else if(touchMode==='four'){
      if(m===0){ fourG=null; touchMode=null; }
    } else if(m===0){ touchMode=null; }
    if(m===0){ pan=null; gest=null; swipe3=null; fourG=null; }
    return;
  }
  radEl.classList.remove('dim');
  if(drag&&e.pointerId===drag.id) endStroke();
  if(e.pointerType==='pen'&&!painting) hoverBtns=0;
}
stage.addEventListener('pointerup',onPointerUp);
stage.addEventListener('pointercancel',onPointerUp);
window.addEventListener('wheel',function(e){
  if(!e.target.closest||!e.target.closest('#stagewrap')) return;
  e.preventDefault();
  var r=stage.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  if(e.shiftKey){ rotateBy(e.deltaY<0?-5:5); return; }
  var wp=s2w(mx,my);
  view.scale=clamp(view.scale*(e.deltaY<0?1.1:0.9),0.05,16);
  var c=Math.cos(view.rot), s=Math.sin(view.rot), z=view.scale;
  view.ox=mx-(wp.x*c-wp.y*s)*z;
  view.oy=my-(wp.x*s+wp.y*c)*z;
  req();
},{passive:false});

/* ══════════ STRICH / WERKZEUG-VERTEILUNG ══════════ */
function beginStroke(pt,pres,erase,pid,dbl){
  var t=erase?'eraser':tool();
  var def=TOOLDEF[t]||{};
  if(def.act){ def.act(pt); return; }                     /* Sofortbefehl, kein Modus */
  /* Material anpassen hat Vorrang, solange es läuft */
  if(matEdit){
    var mh=hitMatHandle(pt);
    if(mh){
      var r0=matRect(matEdit.l);
      drag={kind:'matT',h:mh.id,id:pid,
            orig:{x:r0.x,y:r0.y,w:r0.w,h:r0.h,px:pt.x,py:pt.y}};
      return;
    }
  }
  /* Griffe der Lineale haben Vorrang vor jedem Werkzeug */
  var gh=hitGuideHandle(pt);
  if(gh){ drag={kind:'guideH',h:gh.id,id:pid}; moveGuideHandle(gh.id,pt); return; }
  var l=activeLayer();
  if(!l){ toast('Keine '+TYPNM[LENS[lens].typ]+'-Ebene \u2014 im Stapel anlegen'); return; }
  if(l.vorlage){ toast('\u201E'+l.name+'\u201C ist eine Vorlage \u2014 im Stapel aufheben oder andere Ebene w\u00E4hlen'); return; }
  if(lens==='studio') pt=snapGrid(pt);
  pt=snapPt(pt,pt);
  if(t==='pick'){ pickAt(pt); pushRecentCol(color); return; }
  if(lens==='draw') return beginPixel(t,l,pt,pres,pid);
  if(lens==='vektor') return beginPfad(t,l,pt,pid,dbl);
  return beginLayout(t,l,pt,pid,dbl);
}
function moveStroke(pt,pres){
  if(!drag) return;
  var k=drag.kind;
  if(k==='guideH'){ moveGuideHandle(drag.h,pt); return; }
  if(k==='matT'){ matMove(drag.h,pt,drag.orig); return; }
  if(k==='selT'){ selTransform(pt); return; }
  if(lens==='studio'&&(k==='mkEl'||k==='moveEl')) pt=snapGrid(pt);
  if(drag.start) pt=snapPt(pt,drag.start);
  if(k==='brush'){ brushMove(pt,pres); drag.last=pt; }
  else if(k==='paint'){ paintLine(drag.l,drag.last,pt,pres,drag.erase); drag.last=pt; req(); }
  else if(k==='path'){ pt.p=pres; drag.pts.push(pt); req(); }
  else if(k==='node'){ var p=drag.l.data.paths[drag.idx]; if(p&&p.pts[drag.pt]){ p.pts[drag.pt]=pt; invalidate('pfade'); req(); } }
  else if(k==='moveEl'){ var el=drag.l.data.els[drag.idx];
    el.x=drag.orig.x+(pt.x-drag.start.x); el.y=drag.orig.y+(pt.y-drag.start.y);
    invalidate('layout'); req(); }
  else if(k==='mkEl'||k==='selRect'||k==='grad'){ drag.cur=pt; req(); }
  else if(k==='lasso'){ drag.pts.push(pt); req(); }
  else if(k==='movePix'){ movePixTo(pt); }
  else if(k==='fx'){ fxRun(drag.l,drag.last,pt,pres); drag.last=pt; req(); }
  else if(k==='movePath'){
    var dx=pt.x-drag.start.x, dy=pt.y-drag.start.y;
    drag.l.data.paths[drag.idx].pts=drag.orig.map(function(q){ return {x:q.x+dx,y:q.y+dy}; });
    invalidate('pfade'); req();
  }
}
function endStroke(){
  painting=false; strokePid=null;
  if(!drag){ return; }
  var d=drag; drag=null;
  if(d.kind==='path'){
    var sm=smoothPts(d.pts,VALS.vektor.v2.val);
    if(sm.length>1){
      var base=decimate(sm,1.6);
      var bv=curBrush();
      mirrorPaths(base).forEach(function(pp){
        d.l.data.paths.push({pts:pp,w:VALS.vektor.v1.val,col:color,closed:false,
                             brush:bv.id,profil:bv.profil||'gleich'});
      });
      invalidate('pfade');
    }
  } else if(d.kind==='mkEl'){
    var a=d.start, b=d.cur||{x:a.x+280,y:a.y+70};
    var x=Math.min(a.x,b.x), y=Math.min(a.y,b.y);
    var w=Math.max(30,Math.abs(b.x-a.x)), h=Math.max(24,Math.abs(b.y-a.y));
    var el={kind:d.elKind,x:x,y:y,w:w,h:h,col:color};
    if(d.elKind==='text'){ el.text='TEXT'; el.size=VALS.studio.v1.val; el.track=VALS.studio.v2.val; el.h=Math.max(h,el.size*1.1); }
    if(d.elKind==='frame'||d.elKind==='imgframe') el.dash=true;
    d.l.data.els.push(el);
    overlaySel={layerId:d.l.id,idx:d.l.data.els.length-1};
    invalidate('layout');
  } else if(d.kind==='matT'){
    invalidate('material'); autosaveSoon();
  } else if(d.kind==='guideH'){
    /* nichts weiter zu tun */
  } else if(d.kind==='selT'){
    syncSelToFloat();
  } else if(d.kind==='lasso'){
    selFromPath(d.pts);
    toast(sel?'Lasso-Auswahl gesetzt':'Auswahl aufgehoben');
  } else if(d.kind==='selRect'){
    var a2=d.start, b2=d.cur||a2;
    var sw=Math.abs(b2.x-a2.x), sh=Math.abs(b2.y-a2.y);
    if(sw<4||sh<4) sel=null;
    else selFromRect(Math.min(a2.x,b2.x),Math.min(a2.y,b2.y),sw,sh);
    toast(sel?'Auswahl gesetzt \u2014 Verschieben bewegt sie':'Auswahl aufgehoben');
  } else if(d.kind==='grad'){
    applyGradient(d.l,d.start,d.cur||d.start);
  } else if(d.kind==='movePix'){
    syncSelToFloat();          /* bleibt schwebend — erst der Werkzeugwechsel setzt ab */
  } else if(d.kind==='brush'){
    endBrush(d);
  } else if(d.kind==='fx'){
    pushPixelUndo(d.l,d.bb);
    invalidate('pixel');
  } else if(d.kind==='paint'){
    invalidate('pixel');
  } else if(d.kind==='node'||d.kind==='movePath'){
    invalidate('pfade');
  } else if(d.kind==='moveEl'){
    invalidate('layout');
  }
  autosaveSoon(); req();
}

/* ── Pixel-Linse ─────────────────────────────────────────────────── */
var sel=null, floatPix=null;
function beginPixel(t,l,pt,pres,pid){
  if(t==='fill'){ fillAt(l,pt); return; }
  if(t==='selRect'){ drag={kind:'selRect',l:l,start:pt,id:pid}; return; }
  if(t==='lasso'){ drag={kind:'lasso',l:l,pts:[pt],start:pt,id:pid}; return; }
  if(t==='wand'){ selFromWand(l,pt,Math.round(VALS.draw.v2.val*0.6)); req(); return; }
  if(t==='move'){
    if(selEmpty()){ toast('Erst eine Auswahl aufziehen'); return; }
    var h=hitSelHandle(pt);
    if(h){ beginSelTransform(h,pt,pid,l); return; }
    liftPix(l);
    drag={kind:'movePix',l:l,start:pt,orig:{x:sel.x,y:sel.y},id:pid};
    return;
  }
  if(t==='grad'){ drag={kind:'grad',l:l,start:pt,id:pid}; return; }
  if(t==='blur'||t==='smudge'||t==='dodge'||t==='burn'){
    preSnap(l);
    drag={kind:'fx',l:l,fx:t,last:pt,start:pt,id:pid,bb:null};
    painting=true; strokePid=pid;
    fxStart(l,pt,pres);
    fxDab(l,pt,pres); req(); return;
  }
  beginBrush(l,pt,pres,t==='eraser',pid);
}
function liftPix(l){
  if(selEmpty()||floatPix||!l||l.typ!=='pixel') return;
  preSnap(l);
  var sx=Math.round(sel.x), sy=Math.round(sel.y);
  var sw=Math.max(1,Math.round(sel.w)), sh=Math.max(1,Math.round(sel.h));
  var cv=document.createElement('canvas');
  cv.width=sw; cv.height=sh;
  var cg=cv.getContext('2d');
  cg.drawImage(l.data.cv,-sx,-sy);
  if(sel.mask){
    cg.save(); cg.globalCompositeOperation='destination-in';
    cg.drawImage(sel.mask,0,0,sw,sh); cg.restore();
  }
  var g=l.data.cv.getContext('2d');
  g.save(); g.globalCompositeOperation='destination-out';
  if(sel.mask) g.drawImage(sel.mask,sx,sy,sw,sh);
  else { g.fillStyle='#000'; g.fillRect(sx,sy,sw,sh); }
  g.restore();
  /* Die Maske steckt jetzt im Ausschnitt — der schwebende Teil ist ein Bild,
     das Zielrechteck bestimmt allein, wo und wie groß es landet.            */
  floatPix={cv:cv,x:sx,y:sy,w:sw,h:sh,rot:0,layerId:l.id,
            mask0:sel.mask,poly0:sel.poly,w0:sw,h0:sh,x0:sx,y0:sy};
  sel.x=sx; sel.y=sy; sel.w=sw; sel.h=sh;
  pushPixelUndo(l,{x0:0,y0:0,x1:doc.w,y1:doc.h});
  invalidate('pixel'); req();
}
function movePixTo(pt){
  if(!floatPix||!drag) return;
  floatPix.x=drag.orig.x+(pt.x-drag.start.x);
  floatPix.y=drag.orig.y+(pt.y-drag.start.y);
  sel.x=floatPix.x; sel.y=floatPix.y;
  req();
}
/* Umriss und Maske der Auswahl der Verwandlung nachziehen */
function syncSelToFloat(){
  if(!floatPix) return;
  sel.x=floatPix.x; sel.y=floatPix.y;
  sel.w=floatPix.w||floatPix.cv.width; sel.h=floatPix.h||floatPix.cv.height;
  var moved=(floatPix.w===floatPix.w0&&floatPix.h===floatPix.h0&&!floatPix.rot);
  if(moved&&floatPix.mask0){
    sel.mask=floatPix.mask0;
    var dx=sel.x-floatPix.x0, dy=sel.y-floatPix.y0;
    sel.poly=floatPix.poly0?floatPix.poly0.map(function(c){
      return c.map(function(p){ return {x:p.x+dx,y:p.y+dy}; });
    }):null;
  } else {
    sel.mask=null; sel.poly=null;    /* verwandelt: der Rahmen ist die neue Form */
  }
}
function commitMovePix(d){
  if(!floatPix) return;
  var l=(d&&d.l)||layerById(floatPix.layerId)||activeLayer();
  if(!l||l.typ!=='pixel'){ floatPix=null; invalidate('pixel'); req(); return; }
  var g=l.data.cv.getContext('2d');
  var fw=floatPix.w||floatPix.cv.width, fh=floatPix.h||floatPix.cv.height;
  g.save();
  g.globalCompositeOperation='source-over';
  g.globalAlpha=1;
  g.translate(floatPix.x+fw/2,floatPix.y+fh/2);
  if(floatPix.rot) g.rotate(floatPix.rot);
  g.drawImage(floatPix.cv,-fw/2,-fh/2,fw,fh);
  g.restore();
  syncSelToFloat();
  floatPix=null;
  invalidate('pixel'); req();
}
/* Schwebende Auswahl absetzen, sobald das Werkzeug wechselt */
function dropFloat(){
  if(!floatPix) return;
  commitMovePix(null);
  autosaveSoon();
}
/* Schwebende Auswahl verwerfen (für Zurück) — der Ausschnitt wird NICHT abgesetzt */
function discardFloat(){ floatPix=null; }
function applyGradient(l,a,b){
  preSnap(l);
  var g=l.data.cv.getContext('2d');
  var gr=g.createLinearGradient(a.x,a.y,b.x,b.y);
  var rgb=hexToRgb(color)||{r:0,g:0,b:0};
  gr.addColorStop(0,'rgba('+rgb.r+','+rgb.g+','+rgb.b+','+(VALS.draw.v2.val/100)+')');
  gr.addColorStop(1,'rgba('+rgb.r+','+rgb.g+','+rgb.b+',0)');
  g.save();
  if(sel){ g.beginPath(); g.rect(sel.x,sel.y,sel.w,sel.h); g.clip(); }
  g.fillStyle=gr; g.fillRect(0,0,doc.w,doc.h); g.restore();
  pushPixelUndo(l,{x0:0,y0:0,x1:doc.w,y1:doc.h});
  invalidate('pixel'); toast('Verlauf aufgetragen');
}

/* ── Pfade-Linse ─────────────────────────────────────────────────── */
function beginPfad(t,l,pt,pid,dbl){
  if(t==='eraser'){ erasePathAt(l,pt); return; }
  if(t==='curve'){ addCurvePoint(l,pt); return; }
  if(t==='fill'){
    var h0=hitPath(l,pt);
    if(h0){ l.data.paths[h0.idx].col=color; invalidate('pfade'); toast('Farbe zugewiesen'); req(); }
    else toast('Keinen Pfad getroffen');
    return;
  }
  if(t==='sel'||t==='node'){
    var h=hitPath(l,pt);
    overlaySel=h?{layerId:l.id,idx:h.idx,pt:h.pt}:null;
    if(h) snapLayer(l);
    drag=h?{kind:'node',l:l,idx:h.idx,pt:h.pt,id:pid}:null;
    req(); return;
  }
  if(t==='move'){
    var h2=hitPath(l,pt);
    if(!h2){ toast('Keinen Pfad getroffen'); return; }
    overlaySel={layerId:l.id,idx:h2.idx,pt:h2.pt};
    snapLayer(l);
    drag={kind:'movePath',l:l,idx:h2.idx,start:pt,
          orig:l.data.paths[h2.idx].pts.map(function(q){ return {x:q.x,y:q.y}; }),id:pid};
    return;
  }
  snapLayer(l);                       /* Vorzustand für „Zurück" */
  drag={kind:'path',l:l,pts:[pt],start:pt,id:pid};
  painting=true; strokePid=pid;
}

/* ── Layout-Linse ────────────────────────────────────────────────── */
function beginLayout(t,l,pt,pid,dbl){
  if(t==='text'||t==='frame'||t==='bar'||t==='imgframe'){
    snapLayer(l);
    drag={kind:'mkEl',l:l,elKind:t,start:pt,id:pid}; return;
  }
  var h=hitEl(l,pt);
  if(h&&dbl){ overlaySel={layerId:l.id,idx:h.idx}; openTextWin(l,h.idx); req(); return; }
  overlaySel=h?{layerId:l.id,idx:h.idx}:null;
  if(h){ snapLayer(l); drag={kind:'moveEl',l:l,idx:h.idx,start:pt,orig:cloneEl(l.data.els[h.idx]),id:pid}; }
  req();
}

function pressure(e){ return (e.pointerType==='pen'&&e.pressure)?Math.max(0.15,e.pressure):1; }
function cloneEl(e){ return JSON.parse(JSON.stringify(e)); }
function decimate(pts,minD){
  var out=[pts[0]];
  for(var i=1;i<pts.length;i++){
    var l=out[out.length-1];
    if(Math.hypot(pts[i].x-l.x,pts[i].y-l.y)>=minD) out.push(pts[i]);
  }
  if(out.length<2) out.push(pts[pts.length-1]);
  return out;
}

/* ══════════ LINEAL · SCHABLONE · SPIEGEL ══════════ */
var guide={rule:'aus',ang:0,vp:null,el:null,mirror:'aus',axes:6};
var lastTap={t:0,x:0,y:0};
function guideCenter(){ return guide.mc||{x:doc.w/2,y:doc.h/2}; }
function guideOrg(){ if(!guide.org) guide.org={x:doc.w*0.2,y:doc.h*0.5}; return guide.org; }
function ensureVp(){ if(!guide.vp) guide.vp={x:doc.w/2,y:-doc.h*0.35}; return guide.vp; }
function ensureEl(){ if(!guide.el) guide.el={cx:doc.w/2,cy:doc.h/2,rx:doc.w*0.30,ry:doc.h*0.26}; return guide.el; }
function projDir(pt,start,ang){
  var dx=Math.cos(ang),dy=Math.sin(ang);
  var t=(pt.x-start.x)*dx+(pt.y-start.y)*dy;
  return {x:start.x+dx*t,y:start.y+dy*t};
}
function snapPt(pt,start){
  var r=guide.rule;
  if(r==='aus'||!start) return pt;
  if(r==='gerade') return projDir(pt,start,guide.ang*Math.PI/180);
  if(r==='winkel'){
    var a=Math.atan2(pt.y-start.y,pt.x-start.x);
    var step=Math.PI/12;                                  /* 15° */
    return projDir(pt,start,Math.round(a/step)*step);
  }
  if(r==='persp'){
    var vp=ensureVp();
    var a2=Math.atan2(start.y-vp.y,start.x-vp.x);
    return projDir(pt,start,a2);
  }
  if(r==='ellipse'){
    var el=ensureEl(), vx=(pt.x-el.cx)/el.rx, vy=(pt.y-el.cy)/el.ry;
    var n=Math.hypot(vx,vy)||1;
    return {x:el.cx+(vx/n)*el.rx, y:el.cy+(vy/n)*el.ry};
  }
  if(r==='kreis'){
    var c=guideCenter(), rad=Math.hypot(start.x-c.x,start.y-c.y)||1;
    var a3=Math.atan2(pt.y-c.y,pt.x-c.x);
    return {x:c.x+Math.cos(a3)*rad, y:c.y+Math.sin(a3)*rad};
  }
  return pt;
}
function mirrorPts(pt){
  var out=[pt], c=guideCenter();
  if(guide.mirror==='x') out.push({x:doc.w-pt.x,y:pt.y});
  else if(guide.mirror==='xy') out.push({x:doc.w-pt.x,y:pt.y},{x:pt.x,y:doc.h-pt.y},{x:doc.w-pt.x,y:doc.h-pt.y});
  else if(guide.mirror==='radial'){
    var n=Math.max(2,Math.min(24,guide.axes));
    for(var i=1;i<n;i++){
      var a=i*2*Math.PI/n, dx=pt.x-c.x, dy=pt.y-c.y;
      out.push({x:c.x+dx*Math.cos(a)-dy*Math.sin(a), y:c.y+dx*Math.sin(a)+dy*Math.cos(a)});
    }
  }
  return out;
}
function mirrorPaths(pts){
  var n=mirrorPts(pts[0]).length, out=[];
  for(var k=0;k<n;k++) out.push(pts.map(function(p){
    var q=mirrorPts(p)[k];
    if(p.p!=null) q.p=p.p;
    return q;
  }));
  return out;
}
function setGuide(k,v){
  guide[k]=v;
  if(k==='rule'&&v==='persp') ensureVp();
  if(k==='rule'&&v==='ellipse') ensureEl();
  try{ localStorage.setItem('koslinse_guide',JSON.stringify(guide)); }catch(e){}
  renderBadges(); radRelayout(); req();
}
function drawGuides(g){
  var r=guide.rule, dash=[10/view.scale,8/view.scale];
  g.save(); g.setLineDash(dash); g.lineWidth=1.6/view.scale; g.strokeStyle='#9fb0bb88';
  if(r==='gerade'){
    var o=guideOrg(), a=guide.ang*Math.PI/180, L=Math.max(doc.w,doc.h)*1.6;
    /* das Lineal selbst liegt am Griff */
    g.beginPath();
    g.moveTo(o.x-Math.cos(a)*L,o.y-Math.sin(a)*L);
    g.lineTo(o.x+Math.cos(a)*L,o.y+Math.sin(a)*L);
    g.stroke();
    /* während des Strichs zusätzlich die tatsächlich benutzte Parallele */
    if(drag&&drag.start){
      g.save();
      g.setLineDash([]);
      g.strokeStyle=LENS[lens].c+'cc'; g.lineWidth=1.4/view.scale;
      g.beginPath();
      g.moveTo(drag.start.x-Math.cos(a)*L,drag.start.y-Math.sin(a)*L);
      g.lineTo(drag.start.x+Math.cos(a)*L,drag.start.y+Math.sin(a)*L);
      g.stroke();
      g.restore();
    }
  } else if(r==='persp'){
    var vp=ensureVp(), L2=Math.max(doc.w,doc.h)*2;
    for(var i=0;i<7;i++){
      var an=(-70+i*23)*Math.PI/180;
      g.beginPath(); g.moveTo(vp.x,vp.y); g.lineTo(vp.x+Math.cos(an)*L2,vp.y+Math.sin(an)*L2); g.stroke();
    }
  } else if(r==='ellipse'){
    var el=ensureEl();
    g.beginPath(); g.ellipse(el.cx,el.cy,el.rx,el.ry,0,0,Math.PI*2); g.stroke();
  } else if(r==='winkel'){
    /* Rasterstern am Ursprung: zeigt die 15°-Schritte */
    var o2=guideOrg(), L2=Math.max(doc.w,doc.h)*0.5;
    for(var wi=0;wi<12;wi++){
      var wa=wi*Math.PI/12;
      g.beginPath();
      g.moveTo(o2.x-Math.cos(wa)*L2,o2.y-Math.sin(wa)*L2);
      g.lineTo(o2.x+Math.cos(wa)*L2,o2.y+Math.sin(wa)*L2);
      g.stroke();
    }
  } else if(r==='kreis'){
    var cc=guideCenter();
    g.beginPath(); g.arc(cc.x,cc.y,Math.min(doc.w,doc.h)*0.32,0,Math.PI*2); g.stroke();
  }
  if(guide.mirror!=='aus'){
    var c2=guideCenter();
    g.strokeStyle=LENS[lens].c+'99';
    if(guide.mirror==='x'||guide.mirror==='xy'){ g.beginPath(); g.moveTo(c2.x,0); g.lineTo(c2.x,doc.h); g.stroke(); }
    if(guide.mirror==='xy'){ g.beginPath(); g.moveTo(0,c2.y); g.lineTo(doc.w,c2.y); g.stroke(); }
    if(guide.mirror==='radial'){
      var n2=Math.max(2,Math.min(24,guide.axes)), R=Math.max(doc.w,doc.h);
      for(var j=0;j<n2;j++){
        var aa=j*2*Math.PI/n2;
        g.beginPath(); g.moveTo(c2.x,c2.y); g.lineTo(c2.x+Math.cos(aa)*R,c2.y+Math.sin(aa)*R); g.stroke();
      }
    }
  }
  g.setLineDash([]); g.restore();
}

/* Pixel-Werkzeuge */
function paintDot(l,pt,p,erase){
  mirrorPts(pt).forEach(function(q){ paintDot1(l,q,p,erase); });
}
function paintDot1(l,pt,p,erase){
  var g=l.data.cv.getContext('2d');
  g.save();
  g.globalCompositeOperation=erase?'destination-out':'source-over';
  g.globalAlpha=erase?1:VALS.draw.v2.val/100;
  g.fillStyle=color;
  g.beginPath(); g.arc(pt.x,pt.y,VALS.draw.v1.val*p/2,0,Math.PI*2); g.fill();
  g.restore();
}
function paintLine(l,a,b,p,erase){
  var d=Math.hypot(b.x-a.x,b.y-a.y), steps=Math.max(1,Math.ceil(d/(VALS.draw.v1.val*0.18)));
  for(var i=1;i<=steps;i++){
    paintDot(l,{x:a.x+(b.x-a.x)*i/steps,y:a.y+(b.y-a.y)*i/steps},p,erase);
  }
}
function fillAt(l,pt){
  preSnap(l);
  var g=l.data.cv.getContext('2d');
  g.save(); g.globalAlpha=VALS.draw.v2.val/100; g.fillStyle=color;
  if(!selEmpty()){
    clipSel(g);
    if(sel.mask){
      var tmp=mkMaskCv(sel.w,sel.h), tg=tmp.getContext('2d');
      tg.fillStyle=color; tg.globalAlpha=1; tg.fillRect(0,0,sel.w,sel.h);
      tg.globalCompositeOperation='destination-in';
      tg.drawImage(sel.mask,0,0);
      g.drawImage(tmp,sel.x,sel.y);
      g.restore();
      pushPixelUndo(l,{x0:sel.x,y0:sel.y,x1:sel.x+sel.w,y1:sel.y+sel.h});
      invalidate('pixel'); toast('Auswahl gef\u00FCllt'); autosaveSoon(); req();
      return;
    }
  }
  g.fillRect(0,0,doc.w,doc.h); g.restore();
  pushPixelUndo(l,{x0:0,y0:0,x1:doc.w,y1:doc.h});
  invalidate('pixel'); toast('Fläche gefüllt'); autosaveSoon(); req();
}
function pickAt(pt){
  var cv=document.createElement('canvas'); cv.width=1; cv.height=1;
  var g=cv.getContext('2d');
  g.translate(-pt.x,-pt.y);
  doc.stack.forEach(function(l){ if(l.visible){ g.globalAlpha=l.opacity; drawLayer(g,l,false); } });
  var d=g.getImageData?cv.getContext('2d').getImageData(0,0,1,1).data:[0,0,0,0];
  if(d[3]>10){ setColor('#'+[d[0],d[1],d[2]].map(function(v){return v.toString(16).padStart(2,'0');}).join('')); toast('Farbe aufgenommen'); }
}
function erasePathAt(l,pt){
  var h=hitPath(l,pt);
  if(h){ snapLayer(l); l.data.paths.splice(h.idx,1); overlaySel=null; invalidate('pfade'); autosaveSoon(); req(); }
}
var curveOpen=null;
function addCurvePoint(l,pt){
  snapLayer(l);
  if(!curveOpen||curveOpen.l!==l){
    curveOpen={l:l,path:{pts:[pt],w:VALS.vektor.v1.val,col:color,closed:false}};
    l.data.paths.push(curveOpen.path);
  } else {
    curveOpen.path.pts.push(pt);
  }
  overlaySel={layerId:l.id,idx:l.data.paths.indexOf(curveOpen.path),pt:curveOpen.path.pts.length-1};
  invalidate('pfade'); autosaveSoon(); req();
}

</script>
<script>
'use strict';
/* ══════════════════════════════════════════════════════════════════════
   AUSWAHL — Rechteck · Lasso · Zauberstab, als Maske
   Die Auswahl ist ein Rahmen plus optionale Maske (Alphakanal).
   Alles, was auf Pixel wirkt, wird darauf beschnitten.
   ══════════════════════════════════════════════════════════════════════ */
function selBounds(){ return sel?{x:sel.x,y:sel.y,w:sel.w,h:sel.h}:null; }
function selEmpty(){ return !sel||sel.w<1||sel.h<1; }
function mkMaskCv(w,h){
  var c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w)); c.height=Math.max(1,Math.round(h));
  return c;
}
/* Beschneidet einen Zeichenvorgang auf die Auswahl */
function clipSel(g){
  if(selEmpty()) return false;
  g.beginPath();
  g.rect(sel.x,sel.y,sel.w,sel.h);
  g.clip();
  return true;
}
/* Maske nachträglich anwenden: alles außerhalb wird entfernt */
function maskOut(cv){
  if(selEmpty()||!sel.mask) return;
  var g=cv.getContext('2d');
  g.save();
  g.globalCompositeOperation='destination-in';
  g.drawImage(sel.mask,sel.x,sel.y);
  g.restore();
}
function selFromRect(x,y,w,h){
  sel={x:x,y:y,w:w,h:h,mask:null,poly:null};
}
/* Umriss einer Maske nachzeichnen (Moore-Nachbarschaft, grob gerastert) */
function maskContours(m,ox,oy){
  var g=m.getContext('2d'), img;
  try{ img=g.getImageData(0,0,m.width,m.height); }catch(e){ return null; }
  var d=img.data, W=m.width, H=m.height, S=2;
  function on(x,y){ if(x<0||y<0||x>=W||y>=H) return 0; return d[(y*W+x)*4+3]>96?1:0; }
  var dirs=[[S,0],[S,S],[0,S],[-S,S],[-S,0],[-S,-S],[0,-S],[S,-S]];
  var seen={}, out=[];
  for(var y0=0;y0<H;y0+=S) for(var x0=0;x0<W;x0+=S){
    if(!on(x0,y0)||on(x0-S,y0)) continue;
    var key=(x0/S|0)+'_'+(y0/S|0);
    if(seen[key]) continue;
    var x=x0,y=y0,dir=6,path=[],guard=0;
    do{
      path.push({x:x+ox,y:y+oy});
      seen[(x/S|0)+'_'+(y/S|0)]=1;
      var found=false;
      for(var i=0;i<8;i++){
        var nd=(dir+6+i)%8, nx=x+dirs[nd][0], ny=y+dirs[nd][1];
        if(on(nx,ny)){ x=nx; y=ny; dir=nd; found=true; break; }
      }
      if(!found) break;
      if(++guard>6000) break;
    }while(!(x===x0&&y===y0));
    if(path.length>6) out.push(path);
    if(out.length>=12) break;
  }
  return out.length?out:null;
}
function selFromPath(pts){
  if(!pts||pts.length<3){ sel=null; return; }
  var xs=pts.map(function(p){return p.x;}), ys=pts.map(function(p){return p.y;});
  var x0=clamp(Math.floor(Math.min.apply(null,xs))-1,0,doc.w),
      y0=clamp(Math.floor(Math.min.apply(null,ys))-1,0,doc.h),
      x1=clamp(Math.ceil(Math.max.apply(null,xs))+1,0,doc.w),
      y1=clamp(Math.ceil(Math.max.apply(null,ys))+1,0,doc.h);
  var w=x1-x0, h=y1-y0;
  if(w<2||h<2){ sel=null; return; }
  var m=mkMaskCv(w,h), g=m.getContext('2d');
  g.fillStyle='#fff';
  g.beginPath();
  g.moveTo(pts[0].x-x0,pts[0].y-y0);
  for(var i=1;i<pts.length;i++) g.lineTo(pts[i].x-x0,pts[i].y-y0);
  g.closePath(); g.fill();
  sel={x:x0,y:y0,w:w,h:h,mask:m,
       poly:[pts.map(function(p){ return {x:p.x,y:p.y}; })]};   /* der gezeichnete Umriss bleibt erhalten */
}
/* Zauberstab: zusammenhängende Fläche ähnlicher Farbe */
function selFromWand(l,pt,tol){
  if(!l||l.typ!=='pixel') { toast('Zauberstab braucht eine Pixelebene'); return; }
  var g=l.data.cv.getContext('2d'), img;
  try{ img=g.getImageData(0,0,doc.w,doc.h); }catch(e){ toast('Fläche nicht lesbar'); return; }
  var d=img.data, W=doc.w, H=doc.h;
  var sx=clamp(Math.round(pt.x),0,W-1), sy=clamp(Math.round(pt.y),0,H-1);
