function resizeDoc(nw,nh){
  if(nw===doc.w&&nh===doc.h) return;
  snapStack();
  doc.stack.forEach(function(l){
    if(l.typ!=='pixel') return;
    var old=l.data.cv;
    var cv=document.createElement('canvas');
    cv.width=nw; cv.height=nh;
    cv.getContext('2d').drawImage(old,0,0);
    l.data.cv=cv;
  });
  doc.w=nw; doc.h=nh;
  ghostCache={pixel:null,pfade:null,layout:null};
  ['pixel','pfade','layout'].forEach(invalidate);
  fitView(); autosaveSoon(); req();
  toast('Blatt: '+nw+' \u00D7 '+nh+' px');
}

/* ══════════════════════════════════════════════════════════════════════
   ZURÜCK-LISTE — mehrere Schritte auf einmal
   ══════════════════════════════════════════════════════════════════════ */
function undoLabel(e){
  if(!e) return '\u2014';
  if(e.label) return e.label;
  if(e.t==='pixels') return 'Pixel';
  if(e.t==='paths') return 'Pfade';
  if(e.t==='els') return 'Layout';
  if(e.t==='stack') return 'Stapel';
  return 'Schritt';
}
function buildHistWin(){
  var w=$('winHist');
  var html='<h5>ZUR\u00DCCK \u00B7 '+undoStack.length+' SCHRITTE</h5><div class="histlist">';
  if(!undoStack.length&&!redoStack.length) html+='<div class="hi none">Noch nichts zu widerrufen</div>';
  redoStack.slice().reverse().forEach(function(e,i){
    var n=redoStack.length-i;
    html+='<div class="hi fwd" data-redo="'+n+'">\u2193 '+undoLabel(e)+'</div>';
  });
  html+='<div class="hi now">\u25CF Jetzt</div>';
  undoStack.slice().reverse().forEach(function(e,i){
    html+='<div class="hi" data-undo="'+(i+1)+'">'+undoLabel(e)+'</div>';
  });
  html+='</div><div class="frow"><button class="hbtn" id="hUndo">\u21B6 Zur\u00FCck</button>'
    +'<button class="hbtn" id="hRedo">\u21B7 Vor</button></div>'
    +'<div class="frow"><button class="hbtn" id="hClear">Liste leeren</button></div>'
    +'<div class="mono" style="font-size:11px;color:var(--tx3);margin-top:6px">'
    +'Auf einen Eintrag tippen springt bis dorthin zur\u00FCck.</div>';
  w.innerHTML=html;
  w.querySelectorAll('[data-undo]').forEach(function(el){
    el.addEventListener('click',function(){
      var n=Number(el.dataset.undo);
      for(var i=0;i<n;i++) doUndo(true);
      toast(n+' Schritt'+(n>1?'e':'')+' zur\u00FCck');
      buildHistWin();
    });
  });
  w.querySelectorAll('[data-redo]').forEach(function(el){
    el.addEventListener('click',function(){
      var n=Number(el.dataset.redo);
      for(var i=0;i<n;i++) doRedo(true);
      toast(n+' Schritt'+(n>1?'e':'')+' vor');
      buildHistWin();
    });
  });
  $('hUndo').addEventListener('click',function(){ doUndo(); buildHistWin(); });
  $('hRedo').addEventListener('click',function(){ doRedo(); buildHistWin(); });
  $('hClear').addEventListener('click',function(){
    undoStack.length=0; redoStack.length=0; undoBytes=0;
    buildHistWin(); toast('Liste geleert');
  });
  dressWin('winHist');
  applyWinGeo('winHist');
}
</script>
<script>
'use strict';
/* ══════════ ÜBERGABEN — nie löschen, Quelle wird Vorlage ══════════ */
function makeVorlage(l){
  l.vorlage=true; l.locked=true;
  if(l.name.indexOf('(Vorlage)')<0) l.name+=' (Vorlage)';
  invalidate(l.typ);
}
function insertAbove(refLayer,nl){
  var i=doc.stack.indexOf(refLayer);
  doc.stack.splice(i+1,0,nl);
}
/* Pixel → Pfade (Marching Squares auf Alphakanal + Vereinfachung) */
function vektorisieren(l){
  snapStack();
  var g=l.data.cv.getContext('2d');
  var img=g.getImageData(0,0,doc.w,doc.h);
  var paths=traceAlpha(img,doc.w,doc.h);
  if(!paths.length){ toast('Nichts zu vektorisieren auf „'+l.name+'“'); return null; }
  var nl=mkLayer('pfade',l.name.replace(' (Vorlage)','')+' → Pfade',
    {paths:paths.map(function(p){ return {pts:p,w:VALS.vektor.v1.val,col:color,closed:true}; })});
  insertAbove(l,nl); makeVorlage(l);
  activeByLens.vektor=nl.id; invalidate('pfade');
  return nl;
}
function traceAlpha(img,W,H){
  var d=img.data, S=4;                       /* Raster: jede 4. Zelle */
  function a(x,y){ if(x<0||y<0||x>=W||y>=H) return 0; return d[(y*W+x)*4+3]>96?1:0; }
  var visited={}, out=[];
  for(var y=0;y<H-S;y+=S) for(var x=0;x<W-S;x+=S){
    if(!a(x,y)||a(x-S,y)) continue;          /* linke Kante einer Fläche */
    var key=Math.round(x/S)+'_'+Math.round(y/S);
    if(visited[key]) continue;
    var path=traceBoundary(a,x,y,S,W,H,visited);
    if(path&&path.length>7) out.push(simplify(path,S*1.4));
    if(out.length>=24) break;
  }
  return out;
}
function traceBoundary(a,sx,sy,S,W,H,visited){
  /* Moore-Nachbarschaft, Schrittweite S */
  var dirs=[[S,0],[S,S],[0,S],[-S,S],[-S,0],[-S,-S],[0,-S],[S,-S]];
  var x=sx,y=sy,dir=6,path=[],guard=0;
  do{
    path.push({x:x,y:y});
    visited[Math.round(x/S)+'_'+Math.round(y/S)]=1;
    var found=false;
    for(var i=0;i<8;i++){
      var nd=(dir+6+i)%8;
      var nx=x+dirs[nd][0], ny=y+dirs[nd][1];
      if(a(nx,ny)){ x=nx; y=ny; dir=nd; found=true; break; }
    }
    if(!found) break;
    if(++guard>4000) break;
  }while(!(x===sx&&y===sy));
  return path;
}
function simplify(pts,eps){
  /* Douglas-Peucker */
  if(pts.length<3) return pts;
  var keep=new Array(pts.length); keep[0]=keep[pts.length-1]=true;
  var stack=[[0,pts.length-1]];
  while(stack.length){
    var seg=stack.pop(), i0=seg[0], i1=seg[1];
    var A=pts[i0],B=pts[i1],maxD=0,maxI=-1;
    for(var i=i0+1;i<i1;i++){
      var dd=ptSeg(pts[i],A,B);
      if(dd>maxD){ maxD=dd; maxI=i; }
    }
    if(maxD>eps){ keep[maxI]=true; stack.push([i0,maxI],[maxI,i1]); }
  }
  return pts.filter(function(_,i){return keep[i];});
}
function ptSeg(p,a,b){
  var dx=b.x-a.x,dy=b.y-a.y,L=dx*dx+dy*dy;
  var t=L?Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/L)):0;
  return Math.hypot(p.x-(a.x+t*dx),p.y-(a.y+t*dy));
}
/* Pfade/Layout → Pixel */
function rastern(l){
  snapStack();
  var nl=pixelLayer(l.name.replace(' (Vorlage)','')+' → Pixel');
  var g=nl.data.cv.getContext('2d');
  g.globalAlpha=1; drawLayer(g,l,false);
  insertAbove(l,nl); makeVorlage(l);
  activeByLens.draw=nl.id; invalidate('pixel');
  return nl;
}
/* Pixel/Pfade → Layout (als Bildrahmen) */
function alsRahmen(l){
  snapStack();
  var cv=document.createElement('canvas'); cv.width=doc.w; cv.height=doc.h;
  var g=cv.getContext('2d'); drawLayer(g,l,false);
  var target=layersOf('layout').filter(function(x){return !x.vorlage;}).pop();
  if(!target){ target=mkLayer('layout','Layout',{els:[]}); doc.stack.push(target); }
  target.data.els.push({kind:'imgframe',x:doc.w*0.12,y:doc.h*0.12,w:doc.w*0.4,h:doc.h*0.4,col:'#3d4a56',img:cv,dash:true});
  makeVorlage(l);
  activeByLens.studio=target.id; invalidate('layout');
  return target;
}
/* Ausgabe: Gesamtstapel flach → PNG + Eintrag in stände */
function ausgabe(){
  var cv=document.createElement('canvas'); cv.width=doc.w; cv.height=doc.h;
  var g=cv.getContext('2d');
  g.fillStyle='#ffffff'; g.fillRect(0,0,doc.w,doc.h);
  doc.stack.forEach(function(l){ if(l.visible&&!l.vorlage){ g.globalAlpha=l.opacity; drawLayer(g,l,false); } });
  g.globalAlpha=1;
  var stamp=new Date().toISOString().slice(0,16).replace(/[-:T]/g,'');
  var name=(doc.name||'ausgabe')+'_'+stamp+'.png';
  doc.staende.push({name:name,ts:Date.now()});
  var ziel=projektOrdner('export');
  if(ziel&&dbxConnected()){
    /* In den Export-Ordner des Projekts legen */
    var u8=dataUrlBytes(cv.toDataURL('image/png'));
    dbxToken().then(function(at){
      return fetch('https://content.dropboxapi.com/2/files/upload',{
        method:'POST',
        headers:{'Authorization':'Bearer '+at,
          'Dropbox-API-Arg':JSON.stringify({path:ziel+'/'+name,mode:'add',autorename:true,mute:true}),
          'Content-Type':'application/octet-stream'},
        body:u8
      });
    }).then(function(r){
      if(!r.ok) throw new Error(r.status+'');
      toast('Ausgabe in '+ziel.split('/').pop()+': '+name);
    }).catch(function(err){
      toast('Ausgabe lokal gespeichert \u2014 Ablage: '+(err.message||err));
      ausgabeLokal(cv,name);
    });
  } else {
    ausgabeLokal(cv,name);
    toast('Ausgabe erzeugt: '+name);
  }
  return name;
}
function ausgabeLokal(cv,name){
  if(!cv.toBlob) return;
  cv.toBlob(function(b){
    if(!b) return;
    var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);},3000);
  },'image/png');
}

/* imgframe im Layout-Renderer nachrüsten */
var _drawLayer=drawLayer;
drawLayer=function(g,l,asGhost){
  if(l.typ==='layout'){
    l.data.els.forEach(function(e){
      if(e.kind!=='imgframe') return;
      if(e.img) g.drawImage(e.img,e.x,e.y,e.w,e.h);
      g.strokeStyle=asGhost?'#8a94a0':e.col; g.lineWidth=3; g.setLineDash(e.dash?[14,10]:[]);
      g.strokeRect(e.x,e.y,e.w,e.h); g.setLineDash([]);
    });
  }
  _drawLayer(g,l,asGhost);
};
var UEB={
  draw:  [{t:'Vektorisieren',d:'Aktive Pixelebene als Pfade nachziehen — Quelle wird Vorlage',fn:function(){var l=activeLayer(); if(l&&vektorisieren(l)){ setLens('vektor'); toast('Vektorisiert — Quelle liegt als Vorlage darunter'); }}},
          {t:'Als Rahmen setzen',d:'Aktive Ebene als Bildrahmen ins Layout',fn:function(){var l=activeLayer(); if(l){ alsRahmen(l); setLens('studio'); toast('Als Rahmen gesetzt'); }}},
          {t:'Ausgabe erzeugen',d:'Gesamten Stapel flach als PNG (ohne Vorlagen)',fn:ausgabe}],
  vektor:[{t:'Rastern',d:'Aktive Pfadebene in Pixel wandeln — Quelle wird Vorlage',fn:function(){var l=activeLayer(); if(l){ rastern(l); setLens('draw'); toast('Gerastert — Quelle liegt als Vorlage darunter'); }}},
          {t:'Als Rahmen setzen',d:'Aktive Ebene als Bildrahmen ins Layout',fn:function(){var l=activeLayer(); if(l){ alsRahmen(l); setLens('studio'); toast('Als Rahmen gesetzt'); }}},
          {t:'Ausgabe erzeugen',d:'Gesamten Stapel flach als PNG (ohne Vorlagen)',fn:ausgabe}],
  studio:[{t:'Rastern',d:'Aktive Layoutebene in Pixel wandeln — Quelle wird Vorlage',fn:function(){var l=activeLayer(); if(l){ rastern(l); setLens('draw'); toast('Gerastert — Quelle liegt als Vorlage darunter'); }}},
          {t:'Ausgabe erzeugen',d:'Gesamten Stapel flach als PNG (ohne Vorlagen)',fn:ausgabe}]
};
function openUeb(){
  var w=$('uebmenu');
  var html='<button class="wx" data-close="uebmenu">\u2715</button><h5>\u00DCBERGABE \u00B7 aus '+LENS[lens].sicht+'</h5>';
  UEB[lens].forEach(function(u,i){
    html+='<div class="ui" data-u="'+i+'"><span class="t">'+u.t+'</span><span class="d">'+u.d+'</span></div>';
  });
  w.innerHTML=html;
  w.querySelectorAll('[data-u]').forEach(function(el){
    el.addEventListener('click',function(){
      closeWins();
      UEB[lens][Number(el.dataset.u)].fn();
      renderStack(); autosaveSoon(); req();
    });
  });
  wireClose(w);

/* ══════════════════════════════════════════════════════════════════
   FARBSYSTEM — übernommen aus K-OS Draw / K-OS Vektor
   Fläche + Farbtonleiste, Hex, Bibliotheken, zuletzt benutzt,
   Paletten-Generator (Farbharmonien). Bibliotheken aus K-OS Draw
   werden beim ersten Start übernommen.
   ══════════════════════════════════════════════════════════════════ */
var hsv={h:0,s:0.82,v:0.85};
var libs=[], activeLib=0;
function clamp01(v){ return Math.max(0,Math.min(1,v)); }
function hexToRgb(h){
  if(!h) return null;
  var m=/^#?([0-9a-f]{6})$/i.exec(String(h).trim());
  if(!m) return null;
  var n=parseInt(m[1],16);
  return {r:(n>>16)&255,g:(n>>8)&255,b:n&255};
}
function rgbToHex(r,g,b){
  return '#'+[r,g,b].map(function(v){ return Math.max(0,Math.min(255,v|0)).toString(16).padStart(2,'0'); }).join('');
}
function hsvToRgb(h,s,v){
  var c=v*s, x=c*(1-Math.abs(((h/60)%2)-1)), m=v-c, r=0,g=0,b=0;
  if(h<60){r=c;g=x;} else if(h<120){r=x;g=c;} else if(h<180){g=c;b=x;}
  else if(h<240){g=x;b=c;} else if(h<300){r=x;b=c;} else {r=c;b=x;}
  return {r:Math.round((r+m)*255),g:Math.round((g+m)*255),b:Math.round((b+m)*255)};
}
function rgbToHsv(r,g,b){
  r/=255; g/=255; b/=255;
  var mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn, h=0;
  if(d){ if(mx===r) h=60*(((g-b)/d)%6); else if(mx===g) h=60*((b-r)/d+2); else h=60*((r-g)/d+4); }
  if(h<0) h+=360;
  return {h:h,s:mx?d/mx:0,v:mx};
}
function mkHsv(h,s,v){ var c=hsvToRgb(((h%360)+360)%360,clamp01(s),clamp01(v)); return rgbToHex(c.r,c.g,c.b); }
var GEN_LABELS={analog:'Analog',mono:'Monochrom',comp:'Komplement\u00E4r',split:'Split-Komplement\u00E4r',triad:'Triade',tetrad:'Tetrade'};
function generatePalette(h,s,v,mode){
  var o=[];
  if(mode==='analog'){ [-60,-30,0,30,60].forEach(function(d){ o.push(mkHsv(h+d,s,v)); }); }
  else if(mode==='mono'){ [[s*0.35,Math.min(1,v*1.35)],[s*0.65,Math.min(1,v*1.15)],[s,v],[s,v*0.76],[Math.min(1,s),v*0.54]]
    .forEach(function(p){ o.push(mkHsv(h,p[0],p[1])); }); }
  else if(mode==='comp'){ o.push(mkHsv(h,s,v*0.8),mkHsv(h,s,v),mkHsv(h,s*0.55,Math.min(1,v*1.18)),mkHsv(h+180,s,v),mkHsv(h+180,s*0.7,Math.min(1,v*1.15))); }
  else if(mode==='split'){ o.push(mkHsv(h,s,v),mkHsv(h,s*0.5,Math.min(1,v*1.18)),mkHsv(h+150,s,v),mkHsv(h+210,s,v),mkHsv(h+180,s*0.45,v*0.82)); }
  else if(mode==='triad'){ o.push(mkHsv(h,s,v),mkHsv(h,s*0.5,Math.min(1,v*1.18)),mkHsv(h+120,s,v),mkHsv(h+240,s,v),mkHsv(h+120,s*0.5,v*0.82)); }
  else if(mode==='tetrad'){ o.push(mkHsv(h,s,v),mkHsv(h+90,s,v),mkHsv(h+180,s,v),mkHsv(h+270,s,v),mkHsv(h,s*0.5,Math.min(1,v*1.18))); }
  return o;
}
function loadFarben(){
  try{
    var j=JSON.parse(localStorage.getItem('koslinse_farben')||'null');
    if(j&&j.libs){ libs=j.libs; activeLib=j.activeLib||0; if(j.recent) recentCols=j.recent; return; }
    var d=JSON.parse(localStorage.getItem('kos-draw-farben')||'null');   /* Bibliotheken aus K-OS Draw übernehmen */
    if(d&&d.libs){ libs=d.libs; activeLib=d.activeLib||0; if(d.recent&&d.recent.length) recentCols=d.recent.slice(0,10); return; }
  }catch(e){}
  libs=[{name:'K-OS Marke',colors:['#d92626','#f2af0d','#26b9d9','#26d97a','#111111','#ffffff','#e05050','#2a8fa8']},
        {name:'Standard',colors:['#1a1a1a','#ffffff','#FF2D78','#3DA9FC','#FFD23F','#22C55E','#9B5DE5','#F15BB5']}];
  activeLib=0;
}
function saveFarben(){
  try{ localStorage.setItem('koslinse_farben',JSON.stringify({libs:libs,activeLib:activeLib,recent:recentCols})); }catch(e){}
}
function setColorHex(hex){
  var rgb=hexToRgb(hex); if(!rgb) return;
  hsv=rgbToHsv(rgb.r,rgb.g,rgb.b);
  setColor(rgbToHex(rgb.r,rgb.g,rgb.b));
}
function applyHSV(){
  var c=hsvToRgb(hsv.h,clamp01(hsv.s),clamp01(hsv.v));
  setColor(rgbToHex(c.r,c.g,c.b),true);
  var pv=$('pkPrev'); if(pv) pv.style.background=color;
  var hx=$('pkHex'); if(hx) hx.value=color.toUpperCase();
  drawSV(); drawHue(); renderGen(); markChips();
}
function drawSV(){
  var cv=$('svsq'); if(!cv) return;
  var g=cv.getContext('2d'); if(!g) return;
  var W=cv.width,H=cv.height, base=hsvToRgb(hsv.h,1,1);
  var gx=g.createLinearGradient(0,0,W,0);
  gx.addColorStop(0,'#ffffff'); gx.addColorStop(1,'rgb('+base.r+','+base.g+','+base.b+')');
  g.fillStyle=gx; g.fillRect(0,0,W,H);
  var gy=g.createLinearGradient(0,0,0,H);
  gy.addColorStop(0,'rgba(0,0,0,0)'); gy.addColorStop(1,'#000000');
  g.fillStyle=gy; g.fillRect(0,0,W,H);
  var x=clamp01(hsv.s)*W, y=(1-clamp01(hsv.v))*H;
  g.beginPath(); g.arc(x,y,7,0,Math.PI*2); g.strokeStyle='#fff'; g.lineWidth=2; g.stroke();
  g.beginPath(); g.arc(x,y,8.5,0,Math.PI*2); g.strokeStyle='#0009'; g.lineWidth=1.5; g.stroke();
}
function drawHue(){
  var cv=$('hueBar'); if(!cv) return;
  var g=cv.getContext('2d'); if(!g) return;
  var W=cv.width,H=cv.height, gr=g.createLinearGradient(0,0,0,H);
  for(var i=0;i<=6;i++){ var c=hsvToRgb(i*60,1,1); gr.addColorStop(i/6,'rgb('+c.r+','+c.g+','+c.b+')'); }
  g.fillStyle=gr; g.fillRect(0,0,W,H);
  var y=(hsv.h/360)*H;
  g.fillStyle='#fff'; g.fillRect(0,y-2,W,4);
  g.strokeStyle='#0009'; g.lineWidth=1; g.strokeRect(0,y-2,W,4);
}
function mkChip(hex,onTap,onLong,pinned){
  var d=document.createElement('div');
  d.className='chip'+(hex.toLowerCase()===String(color).toLowerCase()?' sel':'');
  d.style.background=hex;
  d.dataset.col=hex;
  if(onLong!==undefined&&pinned!==undefined)
    d.innerHTML='<span class="st'+(pinned?' on':'')+'">\u2605</span>';
  var t=null,longFired=false;
  d.addEventListener('pointerdown',function(){
    longFired=false;
    if(onLong) t=setTimeout(function(){ t=null; longFired=true; onLong(); },550);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(function(evn){
    d.addEventListener(evn,function(){ if(t){ clearTimeout(t); t=null; } });
  });
  d.addEventListener('click',function(e){
    if(longFired){ longFired=false; return; }
    if(e.target.classList.contains('st')){
      var i=pinCols.indexOf(hex);
      if(i>=0) pinCols.splice(i,1);
      else if(pinCols.length>=4){ toast('F\u00E4cher voll \u2014 erst ein anderes Sternchen l\u00F6sen'); return; }
      else pinCols.push(hex);
      buildColorPanel(); radRelayout(); return;
    }
    onTap();
  });
  return d;
}
function markChips(){
  document.querySelectorAll('#winColor .chip').forEach(function(c){
    c.classList.toggle('sel',String(c.dataset.col||'').toLowerCase()===String(color).toLowerCase());
  });
}
function buildColorPanel(){
  var w=$('winColor');
  w.innerHTML='<button class="wx" data-close="winColor">\u2715</button>'
    +'<h5>FARBE</h5>'
    +'<div class="pkrow"><canvas id="svsq" width="206" height="150"></canvas><canvas id="hueBar" width="24" height="150"></canvas></div>'
    +'<div class="pkrow"><div class="pkprev" id="pkPrev"></div><input class="pkin" id="pkHex" spellcheck="false">'
    +'<button class="pkbtn" id="pkAdd" title="Zur Bibliothek hinzuf\u00FCgen">\uFF0B</button></div>'
    +'<h5>BIBLIOTHEK</h5>'
    +'<div class="pkrow"><select class="pksel" id="pkLib"></select>'
    +'<button class="pkbtn" id="pkNewLib">Neu</button><button class="pkbtn" id="pkDelLib">\u2327</button></div>'
    +'<div class="pksw" id="pkSw"></div>'
    +'<h5>ZULETZT BENUTZT \u00B7 STERNCHEN HEFTET IN DEN F\u00C4CHER</h5>'

    +'<h5>PALETTEN-GENERATOR</h5>'
    +'<div class="pkrow"><select class="pksel" id="genMode">'
    +'<option value="analog">Analog</option><option value="mono">Monochrom</option>'
    +'<option value="comp">Komplement\u00E4r</option><option value="split">Split-Komplement\u00E4r</option>'
    +'<option value="triad">Triade</option><option value="tetrad">Tetrade</option></select>'
    +'<button class="pkbtn" id="genSave">Speichern</button></div>'
    +'<div class="pksw" id="genOut"></div>';
  $('winColor').classList.add('show');
  var sq=$('svsq'), hb=$('hueBar');
  bindCanvasDrag(sq,function(e){
    var r=sq.getBoundingClientRect();
    hsv.s=clamp01((e.clientX-r.left)/r.width);
    hsv.v=clamp01(1-(e.clientY-r.top)/r.height);
    applyHSV();
  });
  bindCanvasDrag(hb,function(e){
    var r=hb.getBoundingClientRect();
    hsv.h=Math.max(0,Math.min(359.9,((e.clientY-r.top)/r.height)*360));
    applyHSV();
  });
  $('pkHex').value=String(color).toUpperCase();
  $('pkPrev').style.background=color;
  $('pkHex').addEventListener('change',function(){
    var rgb=hexToRgb(this.value);
    if(rgb){ setColorHex(rgbToHex(rgb.r,rgb.g,rgb.b)); hsv=rgbToHsv(rgb.r,rgb.g,rgb.b); applyHSV(); }
    else this.value=String(color).toUpperCase();
  });
  $('pkAdd').addEventListener('click',function(){
    var lib=libs[activeLib]; if(!lib) return;
    if(lib.colors.indexOf(color)<0){ lib.colors.push(color); saveFarben(); buildColorPanel(); toast('Zur Bibliothek hinzugef\u00FCgt'); }
  });
  buildLibSelect(); buildLibSwatches(); buildRecent(); renderGen();
  $('pkLib').addEventListener('change',function(){ activeLib=Number(this.value)||0; saveFarben(); buildColorPanel(); });
  $('pkNewLib').addEventListener('click',function(){
    var n=prompt('Name der neuen Bibliothek:','');
    if(n){ libs.push({name:n,colors:[]}); activeLib=libs.length-1; saveFarben(); buildColorPanel(); }
  });
  $('pkDelLib').addEventListener('click',function(){
    if(libs.length<=1){ toast('Mindestens eine Bibliothek n\u00F6tig'); return; }
    libs.splice(activeLib,1); activeLib=0; saveFarben(); buildColorPanel(); toast('Bibliothek gel\u00F6scht');
  });
  $('genMode').addEventListener('change',renderGen);
  $('genSave').addEventListener('click',function(){
    var pal=$('genOut')._pal||[];
    if(!pal.length) return;
    var label=GEN_LABELS[$('genMode').value]||'Schema';
    libs.push({name:label+' '+String(color).toUpperCase(),colors:pal.slice()});
    activeLib=libs.length-1; saveFarben(); buildColorPanel();
    toast('Palette gespeichert: '+label);
  });
  drawSV(); drawHue();
  wireClose(w);
  dressWin('winColor');
}
function bindCanvasDrag(el,fn){
  if(!el) return;
  var on=false;
  el.addEventListener('pointerdown',function(e){
    e.preventDefault(); on=true;
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    fn(e);
  });
  el.addEventListener('pointermove',function(e){ if(on){ e.preventDefault(); fn(e); } });
  el.addEventListener('pointerup',function(){ if(on){ on=false; pushRecentCol(color); saveFarben(); buildRecent(); renderSwatches(); } });
  el.addEventListener('pointercancel',function(){ on=false; });
}
function buildLibSelect(){
  var s=$('pkLib'); if(!s) return;
  s.innerHTML=libs.map(function(l,i){ return '<option value="'+i+'">'+l.name+'</option>'; }).join('');
  s.value=String(Math.min(activeLib,libs.length-1));
}
function buildLibSwatches(){
  var box=$('pkSw'); if(!box) return;
  box.innerHTML='';
  var lib=libs[activeLib]; if(!lib) return;
  lib.colors.forEach(function(hex,i){
    box.appendChild(mkChip(hex,
      function(){ setColorHex(hex); pushRecentCol(hex); saveFarben(); applyHSV(); buildRecent(); renderSwatches(); },
      function(){ lib.colors.splice(i,1); saveFarben(); buildColorPanel(); toast('Farbe aus der Bibliothek entfernt'); }));
  });
}
function buildRecent(){
  var box=$('pkRec'); if(!box) return;
  box.innerHTML='';
  recentCols.slice(0,10).forEach(function(hex){
    box.appendChild(mkChip(hex,
      function(){ setColorHex(hex); pushRecentCol(hex); saveFarben(); applyHSV(); renderSwatches(); },
      function(){},pinCols.indexOf(hex)>=0));
  });
}
function renderGen(){
  var out=$('genOut'); if(!out) return;
  var mode=($('genMode')||{}).value||'analog';
  var pal=generatePalette(hsv.h,hsv.s,hsv.v,mode);
  out.innerHTML=''; out._pal=pal;
  pal.forEach(function(hex){
    out.appendChild(mkChip(hex,function(){ setColorHex(hex); pushRecentCol(hex); saveFarben(); applyHSV(); renderSwatches(); }));
  });
}

function cmdFilter(){
  var q=$('cmdIn').value.trim().toLowerCase();

  if(!q){ list.classList.remove('show'); return; }
  var hits=commands().filter(function(c){return c.t.toLowerCase().indexOf(q)>=0;}).slice(0,8);

  cmdSel=Math.min(cmdSel,hits.length-1);
  list.innerHTML=hits.map(function(c,i){
    return '<div class="ci'+(i===cmdSel?' sel':'')+'" data-i="'+i+'"><span>'+c.t+'</span><span class="k">'+c.k+'</span></div>';
  }).join('');

  });

  $('cmdlist').classList.remove('show'); $('cmdIn').value=''; $('cmdIn').blur();
  c.fn(); renderStack(); req();
}
$('cmdIn').addEventListener('input',function(){ cmdSel=0; cmdFilter(); });
$('cmdIn').addEventListener('keydown',function(e){
  var hits=$('cmdlist')._hits||[];
  if(e.key==='ArrowDown'){ cmdSel=Math.min(cmdSel+1,hits.length-1); cmdFilter(); e.preventDefault(); }
  else if(e.key==='ArrowUp'){ cmdSel=Math.max(cmdSel-1,0); cmdFilter(); e.preventDefault(); }
  else if(e.key==='Enter'&&hits[cmdSel]){ runCmd(hits[cmdSel]); }
  else if(e.key==='Escape'){ $('cmdlist').classList.remove('show'); $('cmdIn').blur(); }
});

/* ══════════ .KOS-CONTAINER (ZIP, unkomprimiert) ══════════ */
var CRC_T=(function(){ var t=[],c; for(var n=0;n<256;n++){ c=n;
  for(var k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; } return t; })();
function crc32(u8){ var c=0xFFFFFFFF;
  for(var i=0;i<u8.length;i++) c=CRC_T[(c^u8[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0; }
function zipStore(files){ /* files: [{name, data:Uint8Array}] → Uint8Array */
  var parts=[],central=[],off=0,enc=new TextEncoder();
  files.forEach(function(f){
    var nm=enc.encode(f.name), d=f.data, crc=crc32(d);
    var lh=new Uint8Array(30+nm.length), v=new DataView(lh.buffer);
    v.setUint32(0,0x04034b50,true); v.setUint16(4,20,true); v.setUint16(6,0,true); v.setUint16(8,0,true);
    v.setUint16(10,0,true); v.setUint16(12,0,true);
    v.setUint32(14,crc,true); v.setUint32(18,d.length,true); v.setUint32(22,d.length,true);
    v.setUint16(26,nm.length,true); v.setUint16(28,0,true);
    lh.set(nm,30);
    parts.push(lh,d);
    var ch=new Uint8Array(46+nm.length), cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint32(16,crc,true); cv.setUint32(20,d.length,true); cv.setUint32(24,d.length,true);
    cv.setUint16(28,nm.length,true);
    cv.setUint32(42,off,true);
    ch.set(nm,46);
    central.push(ch);
    off+=lh.length+d.length;
  });
  var cSize=central.reduce(function(s,c){return s+c.length;},0);
  var end=new Uint8Array(22), ev=new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,cSize,true); ev.setUint32(16,off,true);
  var total=off+cSize+22, out=new Uint8Array(total), p=0;
  parts.concat(central).concat([end]).forEach(function(u){ out.set(u,p); p+=u.length; });
  return out;
}
function zipRead(u8){ /* nur store-Einträge (eigene Container) */
  var v=new DataView(u8.buffer,u8.byteOffset,u8.byteLength), dec=new TextDecoder();
  var out={}, p=0;
  while(p+4<=u8.length&&v.getUint32(p,true)===0x04034b50){
    var method=v.getUint16(p+8,true);
    var size=v.getUint32(p+18,true);
    var nlen=v.getUint16(p+26,true), elen=v.getUint16(p+28,true);
    var name=dec.decode(u8.subarray(p+30,p+30+nlen));
    var start=p+30+nlen+elen;
    if(method!==0) throw new Error('Komprimierter Eintrag: '+name+' — dieser Container wurde nicht von K-OS geschrieben');
    out[name]=u8.subarray(start,start+size);
    p=start+size;
  }
  return out;
}
function pathsToSvg(l){
  var s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+doc.w+' '+doc.h+'">';
  l.data.paths.forEach(function(p){
    if(!p.pts.length) return;
    s+='<path d="M'+p.pts.map(function(q){return Math.round(q.x*10)/10+' '+Math.round(q.y*10)/10;}).join(' L');
    if(p.closed) s+=' Z';
    s+='" fill="none" stroke="'+p.col+'" stroke-width="'+p.w+'" stroke-linecap="round" stroke-linejoin="round"'
      +' data-brush="'+(p.brush||'tinte')+'" data-profil="'+(p.profil||'gleich')+'"'
      +' data-druck="'+p.pts.map(function(q){return Math.round((q.p==null?0.6:q.p)*100);}).join(',')+'"/>';
  });
  return s+'</svg>';
}
function svgToPaths(txt){
  var out=[], re=/<path d="M([^"]+)" fill="none" stroke="([^"]+)" stroke-width="([^"]+)"([^>]*)\/>/g, m;
  while((m=re.exec(txt))){
    var d=m[1], closed=/ Z\s*$/.test(d), extra=m[4]||'';
    var br=/data-brush="([^"]+)"/.exec(extra);
    var pr=/data-profil="([^"]+)"/.exec(extra);
    var dr=/data-druck="([^"]*)"/.exec(extra);
    var press=dr?dr[1].split(',').map(function(v){ return (parseFloat(v)||60)/100; }):null;
    var pts=d.replace(/ Z\s*$/,'').split(' L').map(function(pp,i){
      var xy=pp.trim().split(/\s+/);
      var o={x:parseFloat(xy[0]),y:parseFloat(xy[1])};
      if(press&&press[i]!=null) o.p=press[i];
      return o;
    });
    out.push({pts:pts,w:parseFloat(m[3]),col:m[2],closed:closed,
              brush:br?br[1]:'tinte',profil:pr?pr[1]:'gleich'});
  }
  return out;
}
function dataUrlBytes(url){
  var b64=url.slice(url.indexOf(',')+1), bin=atob(b64), u=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  return u;
}
function buildContainer(){
  var enc=new TextEncoder(), files=[];
  var manifest={name:doc.name,w:doc.w,h:doc.h,durchblick:durchblick,staende:doc.staende,
    bleed:doc.bleed||0, grid:doc.grid||null, groups:doc.groups||[],
    stack:doc.stack.map(function(l,i){
      var e={typ:l.typ,name:l.name,opacity:l.opacity,visible:l.visible,locked:l.locked,
             vorlage:l.vorlage,blend:l.blend||'source-over',group:l.group||null};
      if(l.typ==='pixel') e.file='pixel/'+i+'.png';
      if(l.typ==='pfade') e.file='pfade/'+i+'.svg';
      if(l.typ==='layout') e.file='layout/'+i+'.json';
      if(l.typ==='material'){
        e.file=l.data.src?('material/'+i+'.png'):null;
        if(l.data.rect) e.rect=l.data.rect;
      }
      return e;
    })};
  files.push({name:'manifest.json',data:enc.encode(JSON.stringify(manifest,null,1))});
  doc.stack.forEach(function(l,i){
    if(l.typ==='pixel') files.push({name:'pixel/'+i+'.png',data:dataUrlBytes(l.data.cv.toDataURL('image/png'))});
    else if(l.typ==='pfade') files.push({name:'pfade/'+i+'.svg',data:enc.encode(pathsToSvg(l))});
    else if(l.typ==='layout') files.push({name:'layout/'+i+'.json',
      data:enc.encode(JSON.stringify(l.data.els,function(k,v){return (k==='img')?undefined:v;}))});
    else if(l.typ==='material'&&l.data.src) files.push({name:'material/'+i+'.png',data:dataUrlBytes(l.data.src)});
  });
  return zipStore(files);
}
function saveKos(){
  try{
    var u8=buildContainer();
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([u8],{type:'application/zip'}));
    a.download=doc.name+'.kos'; a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);},3000);
    toast('Gespeichert: '+doc.name+'.kos ('+doc.stack.length+' Ebenen als Container)');
  }catch(err){ toast('Speichern fehlgeschlagen: '+(err.message||err)); }
}
function loadKosBytes(u8,done){
  var z=zipRead(u8), dec=new TextDecoder();
  var mf=JSON.parse(dec.decode(z['manifest.json']));
  newDoc(mf.name,mf.w,mf.h);
  doc.staende=mf.staende||[];
  doc.bleed=mf.bleed||0;
  doc.grid=mf.grid||{on:false,size:64,snap:false};
  doc.groups=mf.groups||[];
  var pend=0;
  mf.stack.forEach(function(e){
    var l;
    if(e.typ==='pixel'){
      l=pixelLayer(e.name);
      if(e.file&&z[e.file]){
        pend++;
        var img=new Image();
        img.onload=function(){ l.data.cv.getContext('2d').drawImage(img,0,0); invalidate('pixel'); if(--pend===0&&done) done(); req(); };
        img.src='data:image/png;base64,'+u8b64(z[e.file]);
      }
    } else if(e.typ==='pfade'){
      l=mkLayer('pfade',e.name,{paths:e.file&&z[e.file]?svgToPaths(dec.decode(z[e.file])):[]});
    } else if(e.typ==='layout'){
      l=mkLayer('layout',e.name,{els:e.file&&z[e.file]?JSON.parse(dec.decode(z[e.file])):[]});
    } else {
      l=mkLayer('material',e.name,{});
      if(e.file&&z[e.file]){
        pend++;
        var m2=new Image();
        m2.onload=function(){ l.data.img=m2; if(--pend===0&&done) done(); req(); };
        l.data.src='data:image/png;base64,'+u8b64(z[e.file]);
        m2.src=l.data.src;
      }
    }
    l.opacity=e.opacity; l.visible=e.visible; l.locked=e.locked; l.vorlage=e.vorlage;
    l.blend=e.blend||'source-over'; l.group=e.group||null;
    if(e.rect&&l.typ==='material') l.data.rect=e.rect;
    doc.stack.push(l);
  });
  ['pixel','pfade','layout'].forEach(invalidate);
  activeByLens={draw:null,vektor:null,studio:null};
  if(typeof mf.durchblick==='number') setDurchblick(mf.durchblick);
  if(pend===0&&done) done();
}
function u8b64(u8){
  var s=''; for(var i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));
  return btoa(s);
}

/* ══════════ ABLAGE · DROPBOX (Sitzung von K-OS Files, gleiche Origin) ══════════
   Kein zweiter Login: liest kosfiles_tokens/kosfiles_appkey und erneuert den
   Zugriff bei Bedarf selbst. Container landen in /Linse im App-Ordner.        */
var DBX_DIR='/Linse';
function dbxTokens(){
  try{ return JSON.parse(localStorage.getItem('kosfiles_tokens')||'null'); }catch(e){ return null; }
}
function dbxConnected(){ var t=dbxTokens(); return !!(t&&(t.access||t.refresh)); }
function dbxRefresh(){
  var t=dbxTokens(), key=localStorage.getItem('kosfiles_appkey')||'';
  if(!t||!t.refresh||!key) return Promise.reject(new Error('Sitzung abgelaufen — in K-OS Files neu verbinden'));
  return fetch('https://api.dropboxapi.com/oauth2/token',{
    method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams({grant_type:'refresh_token',refresh_token:t.refresh,client_id:key})
  }).then(function(r){
    if(!r.ok) throw new Error('Token-Refresh fehlgeschlagen ('+r.status+')');
    return r.json();
  }).then(function(j){
    var nt={access:j.access_token,refresh:t.refresh,exp:Date.now()+Math.max(60,(j.expires_in||14400)-60)*1000};
    try{ localStorage.setItem('kosfiles_tokens',JSON.stringify(nt)); }catch(e){}
    return nt.access;
  });
}
function dbxToken(){
  var t=dbxTokens();
  if(!t) return Promise.reject(new Error('Nicht verbunden — in K-OS Files mit Dropbox anmelden'));
  if(!t.access||(t.exp&&Date.now()>t.exp)) return dbxRefresh();
  return Promise.resolve(t.access);
}
function dbxRPC(ep,body){
  return dbxToken().then(function(at){
    return fetch('https://api.dropboxapi.com/2/'+ep,{
      method:'POST',headers:{'Authorization':'Bearer '+at,'Content-Type':'application/json'},
      body:JSON.stringify(body===undefined?null:body)
    });
  }).then(function(r){
    if(r.status===401) return dbxRefresh().then(function(){ return dbxRPC(ep,body); });
    if(!r.ok) return r.text().then(function(t){ throw new Error(ep+' \u2192 '+r.status+' '+t.slice(0,120)); });
    return r.json();
  });
}

/* ══════════════════════════════════════════════════════════════════
   AUFTRÄGE AUS DER ABLAGE
   Files legt einen Auftrag ab und wechselt hierher. Der zuletzt
   geöffnete Container wird beim Start wieder geladen.
   ══════════════════════════════════════════════════════════════════ */
var kosPfad=null;                    /* Dropbox-Pfad des offenen Containers */
var kosProjekt=null;                 /* Projektbezug: Name und Ordnerrollen */
function projektOrdner(rolle){
  if(!kosProjekt||!kosProjekt.dbx) return null;
  var o=(kosProjekt.ordner&&kosProjekt.ordner[rolle])||
        ({ref:'01 Referenzen',arbeit:'02 Arbeitsdateien',export:'03 Exporte',sozial:'04 Social'}[rolle]);
  return '/'+kosProjekt.dbx+'/'+o;
}
function setProjekt(pr){
  kosProjekt=pr||null;
  try{
    if(pr) localStorage.setItem('kos_linse_projekt',JSON.stringify(pr));
  }catch(e){}
}
try{ kosProjekt=JSON.parse(localStorage.getItem('kos_linse_projekt')||'null'); }catch(e){}
function setPfad(p,name){
  kosPfad=p||null;
  if(p){
    try{ localStorage.setItem('kos_linse_last',JSON.stringify({path:p,name:name||doc.name,t:Date.now()})); }catch(e){}
  }
  $('docName').textContent=(kosProjekt&&kosProjekt.name?kosProjekt.name+' \u203A ':'')+doc.name
    +(kosPfad?'':'  \u00B7 nicht in der Ablage');
  $('docName').title=kosPfad||'Noch nicht in der Ablage gespeichert';
}
/* Die Ablage kann jederzeit einen Auftrag schicken — auch wenn die Linse
   schon läuft. Deshalb wird er nicht nur beim Start abgeholt.            */
window.addEventListener('message',function(ev){
  if(ev.origin!==location.origin) return;
  if(!ev.data||ev.data.type!=='kos-auftrag') return;
  pruefeAuftrag();
});
document.addEventListener('visibilitychange',function(){
  if(!document.hidden) pruefeAuftrag();
});
window.addEventListener('focus',function(){ pruefeAuftrag(); });
var auftragLaeuft=false;
function pruefeAuftrag(){
  if(auftragLaeuft) return;
  var a=takeAuftrag();
  if(!a) return;
  auftragLaeuft=true;
  runAuftrag(a,function(){ auftragLaeuft=false; });
}
function takeAuftrag(){
  var a=null;
  try{ a=JSON.parse(localStorage.getItem('kos_linse_auftrag')||'null'); }catch(e){}
  if(!a) return null;
  try{ localStorage.removeItem('kos_linse_auftrag'); }catch(e){}
  return a;
}
function dbxDownload(path){
  return dbxToken().then(function(at){
    return fetch('https://content.dropboxapi.com/2/files/download',{
      method:'POST',headers:{'Authorization':'Bearer '+at,'Dropbox-API-Arg':JSON.stringify({path:path})}
    });
  }).then(function(r){
    if(r.status===401) return dbxRefresh().then(function(){ return dbxDownload(path); });
    if(!r.ok) throw new Error('Laden '+r.status);
    return r.arrayBuffer();
  });
}
/* Bild als Materialebene einsetzen */
function bildAlsMaterial(bytes,name,alsNeu,done){
  var b64=u8b64(new Uint8Array(bytes));
  var mime=/\.png$/i.test(name)?'image/png':(/\.webp$/i.test(name)?'image/webp':'image/jpeg');
  var img=new Image();
  img.onload=function(){
    var iw=img.width||1600, ih=img.height||900;
    if(alsNeu){
      newDoc(name.replace(/\.[a-z0-9]+$/i,''),iw,ih);
      var mat=mkLayer('material',name,{img:img,src:img.src});
      doc.stack=[mat,pixelLayer('Pixel 1'),
                 mkLayer('pfade','Pfade 1',{paths:[]}),
                 mkLayer('layout','Layout 1',{els:[]})];
      activeByLens={draw:doc.stack[1].id,vektor:doc.stack[2].id,studio:doc.stack[3].id};
    } else {
      var m2=mkLayer('material',name,{img:img,src:img.src});
      doc.stack.unshift(m2);
    }
    ['pixel','pfade','layout'].forEach(invalidate);
    if(done) done();
  };
  img.onerror=function(){ toast('Bild nicht lesbar'); if(done) done(); };
  img.src='data:'+mime+';base64,'+b64;
}
function runAuftrag(a,done){
  if(!a){ if(done) done(false); return; }
  if(a.projekt) setProjekt(a.projekt);
  if(!dbxConnected()){
    toast('Nicht mit Dropbox verbunden \u2014 in der Ablage anmelden');
    if(done) done(false); return;
  }
  toast('Hole aus der Ablage \u2026');
  dbxDownload(a.path).then(function(buf){
    if(a.art==='oeffnen'){
      loadKosBytes(new Uint8Array(buf),function(){
        setPfad(a.path,a.name);
        afterDocLoad();
        toast('Ge\u00F6ffnet: '+doc.name);
        if(done) done(true);
      });
    } else {
      bildAlsMaterial(buf,a.name,a.art==='bild_neu',function(){
        if(a.art==='bild_neu') setPfad(null);
        afterDocLoad(); autosaveSoon();
        toast(a.art==='bild_neu'?'Neues Dokument aus '+a.name:'Material eingef\u00FCgt: '+a.name);
        if(done) done(true);
      });
    }
  }).catch(function(err){
    toast('Ablage: '+(err.message||err));
    if(done) done(false);
  });
}
/* Zuletzt geöffneten Container wieder laden */
function ladeZuletzt(done){
  var last=null;
  try{ last=JSON.parse(localStorage.getItem('kos_linse_last')||'null'); }catch(e){}
  if(!last||!last.path||!dbxConnected()){ if(done) done(false); return; }
  dbxDownload(last.path).then(function(buf){
    loadKosBytes(new Uint8Array(buf),function(){
      setPfad(last.path,last.name);
      afterDocLoad();
      toast('Zuletzt ge\u00F6ffnet: '+doc.name);
      if(done) done(true);
    });
  }).catch(function(){ if(done) done(false); });
}
/* In die Ablage zurückschreiben — an denselben Platz */
/* Kleines Abbild des aktuellen Standes — die Ablage zeigt es als Vorschau */
function vorschauBytes(maxKante){
  var src=flachesBild();
  var k=Math.min((maxKante||640)/doc.w,(maxKante||640)/doc.h,1);
  var cv=document.createElement('canvas');
  cv.width=Math.max(1,Math.round(doc.w*k)); cv.height=Math.max(1,Math.round(doc.h*k));
  var g=cv.getContext('2d');
  g.fillStyle='#ffffff'; g.fillRect(0,0,cv.width,cv.height);
  g.drawImage(src,0,0,cv.width,cv.height);
  return dataUrlBytes(cv.toDataURL('image/png'));
}
function vorschauHochladen(){
  if(!kosPfad||!dbxConnected()) return Promise.resolve();
  var ziel=kosPfad+'.png';                       /* liegt neben dem Container */
  var bytes;
  try{ bytes=vorschauBytes(640); }catch(e){ return Promise.resolve(); }
  return dbxToken().then(function(at){
    return fetch('https://content.dropboxapi.com/2/files/upload',{
      method:'POST',
      headers:{'Authorization':'Bearer '+at,
        'Dropbox-API-Arg':JSON.stringify({path:ziel,mode:'overwrite',mute:true}),
        'Content-Type':'application/octet-stream'},
      body:bytes
    });
  }).catch(function(){});
}
function speichernInAblage(){
  if(!kosPfad) return dbxSaveKos();
  var u8;
  try{ u8=buildContainer(); }catch(err){ toast('Container fehlgeschlagen'); return Promise.reject(err); }
  return dbxToken().then(function(at){
    return fetch('https://content.dropboxapi.com/2/files/upload',{
      method:'POST',
      headers:{'Authorization':'Bearer '+at,
        'Dropbox-API-Arg':JSON.stringify({path:kosPfad,mode:'overwrite',mute:true}),
        'Content-Type':'application/octet-stream'},
      body:u8
    });
  }).then(function(r){
    if(!r.ok) throw new Error(r.status+'');
    toast('Gespeichert: '+kosPfad);
    return vorschauHochladen();                  /* Vorschau für die Ablage nachziehen */
  }).catch(function(err){ toast('Speichern: '+(err.message||err)); });
}

/* ══════════════════════════════════════════════════════════════════
   ZEITRAFFER — übernommen aus K-OS Draw v29
   WebCodecs-Encoder mit eigenem WebM-Muxer. Aufgenommen wird das
   Dokument (ohne Leiste und Zoom) und nur dann, wenn sich etwas
   geändert hat — Pausen fallen von selbst weg.
   30 Bilder/s im Video, Abtastung alle 350 ms ≈ zehnfacher Raffer.
   ══════════════════════════════════════════════════════════════════ */
var tl=null, tlDirty=false;
var TL_W=1440, TL_H=900, TL_FPS=30, TL_SAMPLE_MS=350;
function concatU8(arr){
  var n=0,i; for(i=0;i<arr.length;i++) n+=arr[i].length;
  var o=new Uint8Array(n), p=0;
  for(i=0;i<arr.length;i++){ o.set(arr[i],p); p+=arr[i].length; }
  return o;
}
function ebmlSize(n){
  for(var L=1;L<=8;L++){
    var max=Math.pow(2,7*L)-2;
    if(n<=max){
      var out=new Uint8Array(L), v=n;
      for(var i=L-1;i>0;i--){ out[i]=v&255; v=Math.floor(v/256); }
      out[0]=v|(0x80>>(L-1));
      return out;
    }
  }
  return Uint8Array.from([0x1F,255,255,255]);
}
function el(id,payload){ return concatU8([Uint8Array.from(id),ebmlSize(payload.length),payload]); }
function uPay(n,min){
  var b=[];
  do{ b.unshift(n&255); n=Math.floor(n/256); }while(n>0);
  while(b.length<(min||1)) b.unshift(0);
  return Uint8Array.from(b);
}
function sPay(s){ return new TextEncoder().encode(s); }
function webmHeader(w,h){
  var ebml=el([0x1A,0x45,0xDF,0xA3],concatU8([
    el([0x42,0x86],uPay(1)),el([0x42,0xF7],uPay(1)),el([0x42,0xF2],uPay(4)),el([0x42,0xF3],uPay(8)),
    el([0x42,0x82],sPay('webm')),el([0x42,0x87],uPay(2)),el([0x42,0x85],uPay(2))]));
  var info=el([0x15,0x49,0xA9,0x66],concatU8([
    el([0x2A,0xD7,0xB1],uPay(1000000)),el([0x4D,0x80],sPay('K-OS')),el([0x57,0x41],sPay('K-OS Linse'))]));
  var video=el([0xE0],concatU8([el([0xB0],uPay(w,2)),el([0xBA],uPay(h,2))]));
  var track=el([0xAE],concatU8([
    el([0xD7],uPay(1)),el([0x73,0xC5],uPay(1)),el([0x83],uPay(1)),
    el([0x9C],uPay(0)),el([0x86],sPay('V_VP8')),video]));
  var tracks=el([0x16,0x54,0xAE,0x6B],track);
  var segHead=concatU8([Uint8Array.from([0x18,0x53,0x80,0x67]),
                        Uint8Array.from([0x01,0xFF,0xFF,0xFF,0xFF,0xFF,0xFF,0xFF])]);
  return concatU8([ebml,segHead,info,tracks]);
}
function simpleBlock(relTs,key,data){
  var head=Uint8Array.from([0x81,(relTs>>8)&255,relTs&255,key?0x80:0x00]);
  return el([0xA3],concatU8([head,data]));
}
function makeCluster(tsMs,blocks){
  return el([0x1F,0x43,0xB6,0x75],concatU8([el([0xE7],uPay(tsMs))].concat(blocks)));
}
/* Das Dokument flach zeichnen — wie „Ausgabe erzeugen", nur ohne Datei */
function flachesBild(){
  var cv=document.createElement('canvas');
  cv.width=doc.w; cv.height=doc.h;
  var g=cv.getContext('2d');
  g.fillStyle='#ffffff'; g.fillRect(0,0,doc.w,doc.h);
  doc.stack.forEach(function(l){
    if(!layerVisible(l)||l.vorlage) return;
    g.globalAlpha=layerAlpha(l);
    g.globalCompositeOperation=layerBlend(l);
    drawLayer(g,l,false);
    g.globalCompositeOperation='source-over';
  });
  g.globalAlpha=1;
  return cv;
}
function tlCapture(){
  var t=tl;
  if(!t||!tlDirty) return;
  tlDirty=false;
  try{
    var src=flachesBild();
    var kk=Math.min(TL_W/doc.w,TL_H/doc.h);
    var dw=Math.round(doc.w*kk), dh=Math.round(doc.h*kk);
    t.cx.fillStyle='#0c0e10'; t.cx.fillRect(0,0,TL_W,TL_H);
    t.cx.drawImage(src,(TL_W-dw)/2,(TL_H-dh)/2,dw,dh);
    var tsMs=Math.round(t.frameIdx*(1000/TL_FPS));
    var vf=new VideoFrame(t.canvas,{timestamp:tsMs*1000});
    t.enc.encode(vf,{keyFrame:t.frameIdx%TL_FPS===0});
    vf.close();
    t.frameIdx++;
    var b=$('tlBtn');
    if(b) b.title='Zeitraffer läuft \u00b7 '+t.frameIdx+' Bilder';
  }catch(err){ toast('Zeitraffer-Bild: '+(err&&err.message||err)); }
}
function tlName(){
  var d=new Date();
  return (doc.name||'kos')+'_zeitraffer_'
    +d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')
    +'-'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+'.webm';
}
function tlAblegen(blob,name){
  var ziel=projektOrdner('export');
  if(!ziel||!dbxConnected()){ tlLokal(blob,name); return; }
  blob.arrayBuffer().then(function(buf){
    return dbxToken().then(function(at){
      return fetch('https://content.dropboxapi.com/2/files/upload',{
        method:'POST',
        headers:{'Authorization':'Bearer '+at,
          'Dropbox-API-Arg':JSON.stringify({path:ziel+'/'+name,mode:'add',autorename:true,mute:true}),
          'Content-Type':'application/octet-stream'},
        body:new Uint8Array(buf)
      });
    });
  }).then(function(r){
    if(!r.ok) throw new Error(r.status+'');
    toast('Zeitraffer in '+ziel.split('/').pop()+': '+name);
  }).catch(function(err){
    toast('Zeitraffer lokal gespeichert \u2014 '+(err.message||err));
    tlLokal(blob,name);
  });
}
function tlLokal(blob,name){
  var a=document.createElement('a');
  a.download=name; a.href=URL.createObjectURL(blob); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },4000);
}
function tlToggle(){
  var btn=$('tlBtn');
  if(tl){
    var t=tl; tl=null;
    clearInterval(t.timer);
    if(btn){ btn.classList.remove('rec'); btn.title='Zeitraffer aufnehmen'; }
    document.body.classList.remove('aufnahme');
    Promise.resolve()
      .then(function(){ return t.enc.flush(); })
      .catch(function(){})
      .then(function(){
        try{ t.enc.close(); }catch(e){}
        if(t.curBlocks.length) t.parts.push(makeCluster(t.curTs,t.curBlocks));
        if(!t.frameIdx){ toast('Keine Bilder aufgenommen'); return; }
        var blob=new Blob(t.parts,{type:'video/webm'});
        var name=tlName();
        tlAblegen(blob,name);
        toast('Zeitraffer fertig \u00b7 '+t.frameIdx+' Bilder');
      });
    return;
  }
  if(!('VideoEncoder' in window)){
    toast('Zeitraffer braucht Chrome mit WebCodecs');
    return;
  }
  try{
    var canvas=document.createElement('canvas');
    canvas.width=TL_W; canvas.height=TL_H;
    var t2={canvas:canvas,cx:canvas.getContext('2d'),parts:[webmHeader(TL_W,TL_H)],
            curBlocks:[],curTs:0,frameIdx:0,timer:null,enc:null};
    t2.enc=new VideoEncoder({
      output:function(chunk){
        var d2=new Uint8Array(chunk.byteLength);
        chunk.copyTo(d2);
        var ts=Math.round(chunk.timestamp/1000);
        if(chunk.type==='key'){
          if(t2.curBlocks.length) t2.parts.push(makeCluster(t2.curTs,t2.curBlocks));
          t2.curBlocks=[]; t2.curTs=ts;
        }
        t2.curBlocks.push(simpleBlock(ts-t2.curTs,chunk.type==='key',d2));
      },
      error:function(e){ toast('Zeitraffer-Encoder: '+e.message); }
    });
    t2.enc.configure({codec:'vp8',width:TL_W,height:TL_H,bitrate:5e6,framerate:TL_FPS});
    tlDirty=true;
    t2.timer=setInterval(tlCapture,TL_SAMPLE_MS);
    tl=t2;
    if(btn) btn.classList.add('rec');
    document.body.classList.add('aufnahme');
    toast('Zeitraffer l\u00e4uft \u2014 nimmt nur \u00c4nderungen auf, erneut tippen beendet');
  }catch(err){
    toast('Zeitraffer: '+(err&&err.message||err));
    tl=null;
    if(btn) btn.classList.remove('rec');
  }
}

/* ══════════ AUTOSAVE (IndexedDB) ══════════ */
var asT=0;
function autosaveSoon(){ clearTimeout(asT); asT=setTimeout(autosave,1500); }
function autosave(){
  try{
    var u8=buildContainer();
    var rq=indexedDB.open('koslinse',1);
    rq.onupgradeneeded=function(){ rq.result.createObjectStore('kv'); };
    rq.onsuccess=function(){
      var d=rq.result,t=d.transaction('kv','readwrite');
      t.objectStore('kv').put(u8,'auto');
      t.oncomplete=function(){ d.close(); };
    };
  }catch(e){}
}
function tryRestore(done){
  try{
    var rq=indexedDB.open('koslinse',1);
    rq.onupgradeneeded=function(){ rq.result.createObjectStore('kv'); };
    rq.onsuccess=function(){
      var d=rq.result,g=d.transaction('kv').objectStore('kv').get('auto');
      g.onsuccess=function(){
        d.close();
        if(g.result&&g.result.length){ try{ loadKosBytes(new Uint8Array(g.result),done); return; }catch(e){} }
        done(false);
      };
      g.onerror=function(){ d.close(); done(false); };
    };
    rq.onerror=function(){ done(false); };
  }catch(e){ done(false); }
}

/* Spine: tippen = wechseln · halten = durchsehen · files = zurück zur Ablage */
document.querySelectorAll('#spine .seg').forEach(function(s){
  var k=s.dataset.lens, holdT=0, held=false;
  s.addEventListener('pointerdown',function(e){
    e.preventDefault(); held=false;
    if(k==='files') return;
    holdT=setTimeout(function(){
      held=true; seeThrough=LENS[k].typ; req();
    },350);
  });
  function up(){
    clearTimeout(holdT);
    if(held){ seeThrough=null; req(); held=false; return; }
    if(k==='files'){ gotoFiles(); return; }
    setLens(k);
  }
  s.addEventListener('pointerup',up);
  s.addEventListener('pointercancel',function(){ clearTimeout(holdT); if(held){ seeThrough=null; req(); held=false; } });
});

/* Tasten: 1 Pixel · 2 Pfade · 3 Layout · 4 Ablage · K Befehlsfeld */
document.addEventListener('keydown',function(e){
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')) return;
  var k=e.key.toLowerCase();
  /* Linsen und Ablage */
  if(k==='1') setLens('draw');
  else if(k==='2') setLens('vektor');
  else if(k==='3') setLens('studio');
  else if(k==='4') gotoFiles();
  else if(k==='0') gotoHome();
  else if(k==='k'){ $('cmdIn').focus(); e.preventDefault(); }
  /* Werkzeuge — Belegung wie in K-OS Draw */
  else if(k==='b') setTool(lens==='vektor'?'pen':(lens==='studio'?'text':'brush'));
  else if(k==='e') setTool('eraser');
  else if(k==='g'&&lens==='draw') setTool('fill');
  else if(k==='i') setTool('pick');
  else if(k==='m') setTool(lens==='draw'?'selRect':'sel');
  else if(k==='v') setTool('move');
  else if(k==='l'){ openWin('winRuler'); }
  else if(k==='c'){ openWin('winColor'); }
  /* Ansicht */
  else if(k==='f'){ fitView(); req(); }
  else if(k==='r'){ rotateBy(e.shiftKey?-90:90); }
  else if(k==='0'){ view.scale=1; req(); }
  /* Rad */
  else if(k==='w'){ setRadMode(rad.mode==='fest'?'folgend':'fest'); }
  else if(k==='escape'){ matEnde(); closeWins(); rad.fan=null; rad.big=false; radRelayout(); }
  /* Datei */
  else if(k==='s'&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); if(kosPfad) speichernInAblage(); else saveKos(); }
  else if(k==='z'&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); if(e.shiftKey) doRedo(); else doUndo(); }
  else if(k==='y'&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); doRedo(); }
  else if(k==='h'){ openWin('winHist'); }
  else if(k==='p'){ setPanel(!panelZu); }
  else if(k==='u'){ setViewPop(!viewOpen); }
  else if(k==='j'){ tlToggle(); }
  else if(k==='a'&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); selAllDoc(); req(); }
  else if(k==='d'&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); dropFloat(); sel=null; req(); }
  else if(k==='i'&&e.shiftKey){ selInvert(); req(); }
});
/* Klick neben Fenster schließt sie */
document.addEventListener('pointerdown',function(e){
  var t=e.target, inView=(t&&t.closest)?(t.closest('#viewPop')||t.closest('#viewBtn')):null;
  if(!inView) setViewPop(false);
  if(e.target.closest&&(e.target.closest('.win')||e.target.closest('#uebBtn')||e.target.closest('#fileBtn')||e.target.closest('#cmd'))) return;
  closeWins();          /* festgehaltene Fenster bleiben stehen */
  if(!e.target.closest||!e.target.closest('#cmd')) $('cmdlist').classList.remove('show');
},true);

/* ══════════ BOOT ══════════ */
function afterDocLoad(){
  if(typeof setPfad==='function') setPfad(kosPfad,doc.name);
  else $('docName').textContent=doc.name;
  if(typeof syncViewBtn==='function') syncViewBtn();
  fitView(); overlaySel=null;
  setLens(lens);
}
function boot(){
  sctx=stage.getContext('2d');
  loadFarben();
  if(typeof loadBrushes==='function') loadBrushes();
  try{ setPanel(localStorage.getItem('koslinse_panel')==='1'); }catch(e){ setPanel(false); }
  if(typeof loadRing==='function') loadRing();
  try{ var db=localStorage.getItem('koslinse_db'); if(db!==null) durchblick=Number(db); }catch(e){}
  try{
    var gj=JSON.parse(localStorage.getItem('koslinse_guide')||'null');
    if(gj){ ['rule','ang','mirror','axes'].forEach(function(k){ if(k in gj) guide[k]=gj[k]; }); }
  }catch(e){}
  $('dbSl').value=durchblick; $('dbVal').textContent=durchblick+' %';
  var auftrag=takeAuftrag();
  function fertig(){
    setRadMode(rad.mode);
    if(rad.mode==='fest'){ if(!rad.x) centerRad(); showRad(); }
  }
  if(auftrag){
    runAuftrag(auftrag,function(ok){
      if(!ok){ tryRestore(function(o2){ if(!o2) demoDoc(); afterDocLoad(); fertig(); }); return; }
      fertig();
    });
  } else {
    ladeZuletzt(function(ok){                 /* zuletzt geöffneter Container zuerst */
      if(ok){ fertig(); return; }
      tryRestore(function(o2){
        if(!o2) demoDoc();
        afterDocLoad(); fertig();
      });
    });
  }
  window.addEventListener('resize',function(){ req(); });
}
boot();
