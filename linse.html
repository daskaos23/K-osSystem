/* ══════════ EINGABE AUF DER FLÄCHE ══════════ */
var drag=null;      /* aktueller Zeichen-/Bewegungsvorgang */
var overlaySel=null;/* Auswahl im Vektor/Studio: {layerId, idx} */
function drawOverlays(g){
  if(lens!=='studio') drawGuides(g);
  /* Live-Vorschau des laufenden Pfades */
  if(drag&&drag.kind==='path'&&drag.pts.length>1){
    g.strokeStyle=color; g.lineWidth=VALS.vektor.v1.val; g.lineCap='round'; g.lineJoin='round';
    g.beginPath(); g.moveTo(drag.pts[0].x,drag.pts[0].y);
    for(var i=1;i<drag.pts.length;i++) g.lineTo(drag.pts[i].x,drag.pts[i].y);
    g.stroke();
  }
  /* Knoten der ausgewählten Pfad-/Layout-Objekte */
  if(!overlaySel) return;
  var l=layerById(overlaySel.layerId); if(!l||l.typ!==LENS[lens].typ) return;
  g.lineWidth=2/view.scale;
  if(l.typ==='pfade'){
    var p=l.data.paths[overlaySel.idx]; if(!p) return;
    g.strokeStyle=LENS[lens].c;
    p.pts.forEach(function(pt,i){
      g.fillStyle=(i===overlaySel.pt)?LENS[lens].c:'#ffffff';
      g.strokeRect(pt.x-8/view.scale,pt.y-8/view.scale,16/view.scale,16/view.scale);
      g.fillRect(pt.x-6/view.scale,pt.y-6/view.scale,12/view.scale,12/view.scale);
    });
  } else if(l.typ==='layout'){
    var e=l.data.els[overlaySel.idx]; if(!e) return;
    g.strokeStyle=LENS[lens].c; g.setLineDash([8/view.scale,6/view.scale]);
    g.strokeRect(e.x,e.y,e.w,e.h); g.setLineDash([]);
  }
}
function hitPath(l,pt){
  for(var i=l.data.paths.length-1;i>=0;i--){
    var p=l.data.paths[i];
    for(var j=0;j<p.pts.length;j++){
      var d=Math.hypot(p.pts[j].x-pt.x,p.pts[j].y-pt.y);
      if(d<14/view.scale+p.w) return {idx:i,pt:j};
    }
  }
  return null;
}
function hitEl(l,pt){
  for(var i=l.data.els.length-1;i>=0;i--){
    var e=l.data.els[i];
    if(pt.x>=e.x-8&&pt.x<=e.x+e.w+8&&pt.y>=e.y-8&&pt.y<=e.y+e.h+8) return {idx:i};
  }
  return null;
}
function smoothPts(pts,amt){
  if(pts.length<3||amt<=0) return pts;
  var k=Math.min(0.92,amt/110), out=[pts[0]];
  for(var i=1;i<pts.length;i++){
    var pr=out[i-1];
    out.push({x:pr.x+(pts[i].x-pr.x)*(1-k), y:pr.y+(pts[i].y-pr.y)*(1-k)});
  }
  return out;
}

/* ══════════════════════════════════════════════════════════════════
   EINGABE — übernommen aus K-OS Draw v29
   · Finger bedienen ausschließlich die Ansicht (1 schieben, 2 zoomen +
     drehen, 3 wischen, 4 einpassen). Gezeichnet wird nur mit Stift,
     Maus oder nach Doppeltipp-Halten ausdrücklich mit dem Finger.
   · Die Stifttaste meldet sich auf mehreren Kanälen. Entscheidend ist
     der Bit-1-Impuls im Schweben (Druck 0): genau so erkennt Draw v29
     die Seitentaste. Sie schaltet den Radierer um.
   ══════════════════════════════════════════════════════════════════ */
var pointers=new Map();
var touchMode=null;          /* pan | zoom | swipe3 | four | pick1 | draw | ignore */
var pan=null, gest=null, swipe3=null, fourG=null, fingerDraw=null;
var tap1=null, pickHoldT=0, pick1=null;
var painting=false, strokePid=null;

/* ── Stiftkanäle ───────────────────────────────────────────────── */
var prevTool={draw:'brush',vektor:'pen',studio:'text'};
var lastBtns=0, hoverBtns=0, strokeMaxBtns=0, b1LastRise=0, penGuard=0;
var lastPress=0, lastTilt=0, lastPtrType='';
function isPenBtn(e){
  if(e.pointerType==='touch') return false;
  return e.button===5||e.button===2||((e.buttons&2)!==0)||((e.buttons&4)!==0);
}
function penErase(e){ return e.pointerType==='pen'&&((e.buttons&32)===32); }  /* Radierer-Ende des Stifts */
function trackButtons(e,src){
  if(e.pointerType!=='pen'&&e.pointerType!=='mouse') return;
  lastPtrType=e.pointerType;          /* Stift schwebt bereits -> Ersatzkanäle dürfen wieder umschalten */
  var prev=lastBtns;
  if(e.buttons!==prev) diag(src+' buttons '+prev+' \u2192 '+e.buttons+(typeof e.button==='number'?' (button '+e.button+')':''));
  lastBtns=e.buttons;
  if(typeof e.pressure==='number') lastPress=e.pressure;
  if(e.tiltX!==undefined) lastTilt=Math.round(Math.max(Math.abs(e.tiltX||0),Math.abs(e.tiltY||0)));
  if(!painting&&e.type!=='pointerdown'){
    /* Bit 1 kommt beim Wacom-Stift nur als Impuls und fällt vor dem
       Aufsetzen zurück — deshalb als Umschalter werten, nur im echten
       Schweben (Druck 0, keine Aufsetz-Flanke).                       */
    if(((e.buttons&1)===1)&&((prev&1)===0)&&!(e.pressure>0)){
      var now=Date.now();
      if(now-b1LastRise>300){ b1LastRise=now; penBtnClick('Bit 1'); }
    }
    hoverBtns=e.buttons;                       /* Latch für Bit 2/4: halten und aufsetzen */
  }
  if(painting&&e.buttons>strokeMaxBtns) strokeMaxBtns=e.buttons;
}
function penBtnClick(quelle){
  var now=Date.now();
  if(now-penGuard<150) return false;           /* derselbe Druck meldet sich mehrfach */
  penGuard=now;
  diag('Stifttaste \u2192 Radierer umschalten ('+(quelle||'pointer')+')');
  if(tool()==='eraser'){
    var back=prevTool[lens]||RING[lens][0];
    setTool(back);
    toast('Stifttaste: Radierer AUS \u2014 '+((TOOLDEF[back]||{}).nm||'Werkzeug'));
  } else {
    prevTool[lens]=tool();
    setTool('eraser');
    toast('Stifttaste: Radierer AN');
  }
  return true;
}
/* Alle Kanäle abhören, über die Android/Chrome Stifttasten melden */
if('onpointerrawupdate' in stage) stage.addEventListener('pointerrawupdate',function(e){ trackButtons(e,'raw  '); });
stage.addEventListener('pointerenter',function(e){ trackButtons(e,'hover'); });
stage.addEventListener('pointerleave',function(e){ if(e.pointerType==='pen'&&!painting) hoverBtns=0; });
/* Langes Drücken mit dem Finger löst auf Android das Kontextmenü aus —
   das wird unterdrückt und darf den Radierer nicht umschalten.        */
document.addEventListener('contextmenu',function(e){
  e.preventDefault();
  if(touchList().length||lastPtrType==='touch') return;   /* Finger: nur wegdrücken */
  penBtnClick('contextmenu');
},true);
document.addEventListener('selectstart',function(e){
  if(e.target&&e.target.tagName==='INPUT') return;
  e.preventDefault();
},true);
$('stagewrap').addEventListener('touchstart',function(e){
  if(e.target&&e.target.closest&&e.target.closest('input,select,textarea')) return;
  e.preventDefault();                                     /* verhindert Auswahl-/Lupen-Menü beim Halten */
},{passive:false});
$('stagewrap').addEventListener('touchmove',function(e){ e.preventDefault(); },{passive:false});
$('stagewrap').addEventListener('dragstart',function(e){ e.preventDefault(); });
$('stagewrap').addEventListener('auxclick',function(e){
  if(e.button===1||e.button===2||e.button===5){ e.preventDefault(); penBtnClick('auxclick'); }
});
document.addEventListener('keydown',function(e){
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')) return;
  diag('keydown key="'+e.key+'" code='+e.code);
},true);

/* ── Diagnose (wie in Draw v29: zeigt, was der Stift wirklich meldet) ── */
var diagLines=[], diagOn=false;
function diag(m){
  var t=new Date();
  diagLines.unshift(String(t.getMinutes()).padStart(2,'0')+':'+String(t.getSeconds()).padStart(2,'0')+'  '+m);
  if(diagLines.length>16) diagLines.pop();
  if(diagOn) renderDiag();
}
function renderDiag(){
  var el=$('diagBox'); if(!el) return;
  el.innerHTML='<b>Tasten jetzt '+lastBtns+' \u00B7 max im Strich '+strokeMaxBtns
    +' \u00B7 Schweben '+hoverBtns+' \u00B7 Druck '+lastPress.toFixed(2)+' \u00B7 Neigung '+lastTilt+'\u00B0</b><br>'
    +diagLines.join('<br>');
}
function toggleDiag(){
  diagOn=!diagOn;
  $('diagBox').style.display=diagOn?'block':'none';
  if(diagOn) renderDiag();
}

/* ── Finger: Ansicht statt Zeichnen ───────────────────────────────── */
function touchList(){
  var a=[]; pointers.forEach(function(p){ if(p.type==='touch') a.push(p); }); return a;
}
function touchAvg(){
  var ts=touchList(), x=0, y=0;
  ts.forEach(function(p){ x+=p.x; y+=p.y; });
  return {x:x/(ts.length||1), y:y/(ts.length||1), n:ts.length, ts:ts};
}
function startGesture(){
  var ts=touchList(); if(ts.length<2) return;
  var a=ts[0], b=ts[1];
  gest={d0:Math.hypot(b.x-a.x,b.y-a.y), a0:Math.atan2(b.y-a.y,b.x-a.x),
        mid0:{x:(a.x+b.x)/2,y:(a.y+b.y)/2}, v0:{ox:view.ox,oy:view.oy,scale:view.scale,rot:view.rot}, wmid:null};
  var c=Math.cos(gest.v0.rot), s=Math.sin(gest.v0.rot);
  var dx=(gest.mid0.x-gest.v0.ox)/gest.v0.scale, dy=(gest.mid0.y-gest.v0.oy)/gest.v0.scale;
  gest.wmid={x:dx*c+dy*s, y:-dx*s+dy*c};
  if(drag){ drag=null; }                        /* Geste bricht einen versehentlichen Strich ab */
}
function updateGesture(){
  var ts=touchList(); if(ts.length<2||!gest) return;
  var a=ts[0], b=ts[1];
  var d=Math.hypot(b.x-a.x,b.y-a.y), ang=Math.atan2(b.y-a.y,b.x-a.x);
  var mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
  var dr=ang-gest.a0;
  while(dr>Math.PI) dr-=2*Math.PI;
  while(dr<-Math.PI) dr+=2*Math.PI;
  var rot=gest.v0.rot+(Math.abs(dr)>0.12?dr:0);          /* kleine Totzone gegen Zittern */
  var snap=Math.round(rot/(Math.PI/2))*(Math.PI/2);
  if(Math.abs(rot-snap)<7*Math.PI/180) rot=snap;         /* rastet bei 0/90/180/270° ein */
  var scale=clamp(gest.v0.scale*(d/Math.max(1,gest.d0)),0.05,16);
  var c=Math.cos(rot), s=Math.sin(rot), wm=gest.wmid;
  view.rot=rot; view.scale=scale;
  view.ox=mid.x-(wm.x*c-wm.y*s)*scale;
  view.oy=mid.y-(wm.x*s+wm.y*c)*scale;
  req();
}
function startSwipe3(){ var a=touchAvg(); swipe3={t0:Date.now(),x0:a.x,y0:a.y,x:a.x,y:a.y}; }
function updateSwipe3(){ if(!swipe3) return; var a=touchAvg(); swipe3.x=a.x; swipe3.y=a.y; }
function evalSwipe3(){
  if(!swipe3) return;
  var dt=Date.now()-swipe3.t0, dy=swipe3.y-swipe3.y0, dx=swipe3.x-swipe3.x0;
  if(dt<900&&Math.abs(dy)>=90&&Math.abs(dy)>1.8*Math.abs(dx)){
    if(dy>0){ toast('Geste: speichern'); saveKos(); }
    else { toast('Geste: Ausgabe'); ausgabe(); }
  }
}
function startFour(){
  var a=touchAvg(), d=0;
  a.ts.forEach(function(t){ d+=Math.hypot(t.x-a.x,t.y-a.y); });
  fourG={d0:Math.max(30,d/(a.n||1)),t0:Date.now(),fired:false};
}
function updateFour(){
  if(!fourG||fourG.fired) return;
  var a=touchAvg(); if(a.n<4) return;
  var d=0; a.ts.forEach(function(t){ d+=Math.hypot(t.x-a.x,t.y-a.y); });
  d/=a.n;
  if(Math.abs(d/fourG.d0-1)>0.25&&Date.now()-fourG.t0<700){
    fourG.fired=true; touchMode='ignore';
    fitView(); toast('Einpassen'); req();
  }
}
function startPick1(){
  var p=touchList()[0]; if(!p) return;
  touchMode='pick1';
  pick1={x:p.x,y:p.y};
  pickAt(s2w(p.x,p.y));
  showPickDot(p.x,p.y);
  toast('Pipette \u2014 Finger schieben, dann loslassen');
}
function updatePick1(){
  var p=touchList()[0]; if(!p||!pick1) return;
  pick1.x=p.x; pick1.y=p.y;
  pickAt(s2w(p.x,p.y));
  showPickDot(p.x,p.y);
}
function showPickDot(x,y){
  var el=$('pickDot');
  el.style.display='block';
  el.style.left=x+'px'; el.style.top=y+'px';
  el.style.background=color;
}
function hidePickDot(){ $('pickDot').style.display='none'; }
function fingerBegin(){
  if(!fingerDraw||fingerDraw.active) return;
  fingerDraw.active=true;
  var l=activeLayer();
  if(!l||l.typ!=='pixel'){ toast('Wischfinger gibt es in der Pixel-Linse'); fingerDraw=null; touchMode='ignore'; return; }
  if(l.vorlage){ toast('\u201E'+l.name+'\u201C ist eine Vorlage'); fingerDraw=null; touchMode='ignore'; return; }
  var pt=s2w(fingerDraw.x,fingerDraw.y);
  drag={kind:'fx',l:l,fx:'smudge',last:pt,start:pt,id:fingerDraw.id};
  painting=true; strokePid=fingerDraw.id;
  fxDab(l,pt,0.85); req();
  toast('Wischfinger');
}

/* ══════════ POINTER-VERTEILUNG ══════════ */
stage.addEventListener('pointerdown',function(e){
  e.preventDefault();
  lastPtrType=e.pointerType;
  var r=stage.getBoundingClientRect();
  var l={x:e.clientX-r.left,y:e.clientY-r.top};
  pointers.set(e.pointerId,{x:l.x,y:l.y,type:e.pointerType});

  /* ─ Finger ─ */
  if(e.pointerType==='touch'){
    var n=touchList().length;
    if(painting) return;                                  /* Handballen wird ignoriert, während der Stift malt */
    if(touchMode==='draw') return;
    if(n===1&&tap1&&Date.now()-tap1.t<350&&Math.hypot(l.x-tap1.x,l.y-tap1.y)<40){
      tap1=null; clearTimeout(pickHoldT);                 /* Doppeltipp + Halten: Finger wird Zeichenfinger */
      touchMode='draw';
      fingerDraw={id:e.pointerId,x:l.x,y:l.y,active:false,timer:setTimeout(fingerBegin,130)};
      try{ stage.setPointerCapture(e.pointerId); }catch(err){}
      return;
    }
    if(n>=2) tap1=null;
    if(n>=4){ gest=null; swipe3=null; pan=null; clearTimeout(pickHoldT); startFour(); touchMode='four'; return; }
    if(touchMode==='ignore') return;
    if(n===1){
      pan={id:e.pointerId,x:l.x,y:l.y,ox:view.ox,oy:view.oy,moved:false,t0:Date.now()};
      touchMode='pan';
      clearTimeout(pickHoldT);
      pickHoldT=setTimeout(function(){ if(touchMode==='pan'&&pan&&!pan.moved) startPick1(); },450);
      return;
    }
    if(n===2){ pan=null; clearTimeout(pickHoldT); startGesture(); touchMode='zoom'; return; }
    if(n===3){ gest=null; startSwipe3(); touchMode='swipe3'; return; }
    return;
  }

  /* ─ Stift / Maus ─ */
  strokeMaxBtns=e.buttons; trackButtons(e,'down ');
  if(isPenBtn(e)&&!(e.pressure>0)){ penBtnClick('pointerdown'); return; }   /* Taste im Schweben: nur umschalten */
  radOnTouch();
  var pt=toDoc(e.clientX,e.clientY);
  /* Die Stifttaste schaltet um (siehe penBtnClick) — ein „halten und
     aufsetzen"-Sonderweg ist ausdrücklich nicht gewünscht. Nur das
     umgedrehte Stiftende radiert unmittelbar.                        */
  var erase=penErase(e)||e.pointerType==='eraser';
  var dbl=(Date.now()-lastTap.t<380&&Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)<26);
  lastTap={t:Date.now(),x:e.clientX,y:e.clientY};
  try{ stage.setPointerCapture(e.pointerId); }catch(err){}
  beginStroke(pt,pressure(e),erase,e.pointerId,dbl);
});
stage.addEventListener('pointermove',function(e){
  var p=pointers.get(e.pointerId);
  if(p){ var r=stage.getBoundingClientRect(); p.x=e.clientX-r.left; p.y=e.clientY-r.top; }
  if(e.pointerType!=='touch') trackButtons(e,'move ');

  if(e.pointerType==='touch'){
    if(touchMode==='draw'){
      if(fingerDraw&&e.pointerId===fingerDraw.id){
        var rr=stage.getBoundingClientRect(), lx=e.clientX-rr.left, ly=e.clientY-rr.top;
        if(!fingerDraw.active){
          if(Math.hypot(lx-fingerDraw.x,ly-fingerDraw.y)>4){ clearTimeout(fingerDraw.timer); fingerBegin(); }
          else return;
        }
        moveStroke(s2w(lx,ly),0.85);
      }
      return;
    }
    if(touchMode==='pick1'){ updatePick1(); return; }
    if(touchMode==='four'){ updateFour(); return; }
    if(touchMode==='swipe3'){ updateSwipe3(); return; }
    if(touchMode==='ignore') return;
    if(gest){ updateGesture(); return; }
    if(pan&&e.pointerId===pan.id){
      var r2=stage.getBoundingClientRect(), mx=e.clientX-r2.left, my=e.clientY-r2.top;
      if(!pan.moved&&Math.hypot(mx-pan.x,my-pan.y)>12){ pan.moved=true; clearTimeout(pickHoldT); }
      view.ox=pan.ox+(mx-pan.x); view.oy=pan.oy+(my-pan.y);
      req(); return;
    }
    return;
  }
  radOnHover(e);
  if(!drag||e.pointerId!==drag.id) return;
  var evs=(e.getCoalescedEvents&&e.getCoalescedEvents().length)?e.getCoalescedEvents():[e];
  for(var i=0;i<evs.length;i++) moveStroke(toDoc(evs[i].clientX,evs[i].clientY),pressure(evs[i]));
});
function onPointerUp(e){
  var wasTouch=(e.pointerType==='touch');
  if(!wasTouch) trackButtons(e,'up   ');
  pointers.delete(e.pointerId);
  if(wasTouch){
    var m=touchList().length;
    if(touchMode==='draw'){
      if(fingerDraw){ clearTimeout(fingerDraw.timer); if(fingerDraw.active) endStroke(); fingerDraw=null; }
      touchMode=m>0?'ignore':null;
    } else if(touchMode==='pan'){
      clearTimeout(pickHoldT);
      if(pan&&!pan.moved&&Date.now()-pan.t0<250) tap1={x:pan.x,y:pan.y,t:Date.now()};
      pan=null; touchMode=m>0?'ignore':null;
    } else if(touchMode==='pick1'){
      pick1=null; touchMode=m>0?'ignore':null;
      hidePickDot();
      pushRecentCol(color); renderSwatches();
      if(typeof saveFarben==='function') saveFarben();
      toast('Farbe: '+String(color).toUpperCase());
    } else if(touchMode==='swipe3'){
      if(m===0){ evalSwipe3(); swipe3=null; touchMode=null; }
    } else if(touchMode==='zoom'){
      if(m<2){ gest=null; touchMode=m>0?'ignore':null; }
    } else if(touchMode==='four'){
      if(m===0){ fourG=null; touchMode=null; }
    } else if(m===0){ touchMode=null; }
    if(m===0){ pan=null; gest=null; swipe3=null; fourG=null; }
    return;
  }
  radEl.classList.remove('dim');
  if(drag&&e.pointerId===drag.id) endStroke();
  if(e.pointerType==='pen'&&!painting) hoverBtns=0;
}
stage.addEventListener('pointerup',onPointerUp);
stage.addEventListener('pointercancel',onPointerUp);
window.addEventListener('wheel',function(e){
  if(!e.target.closest||!e.target.closest('#stagewrap')) return;
  e.preventDefault();
  var r=stage.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  if(e.shiftKey){ rotateBy(e.deltaY<0?-5:5); return; }
  var wp=s2w(mx,my);
  view.scale=clamp(view.scale*(e.deltaY<0?1.1:0.9),0.05,16);
  var c=Math.cos(view.rot), s=Math.sin(view.rot), z=view.scale;
  view.ox=mx-(wp.x*c-wp.y*s)*z;
  view.oy=my-(wp.x*s+wp.y*c)*z;
  req();
},{passive:false});

/* ══════════ STRICH / WERKZEUG-VERTEILUNG ══════════ */
function beginStroke(pt,pres,erase,pid,dbl){
  var t=erase?'eraser':tool();
  var def=TOOLDEF[t]||{};
  if(def.act){ def.act(pt); return; }                     /* Sofortbefehl, kein Modus */
  var l=activeLayer();
  if(!l){ toast('Keine '+TYPNM[LENS[lens].typ]+'-Ebene \u2014 im Stapel anlegen'); return; }
  if(l.vorlage){ toast('\u201E'+l.name+'\u201C ist eine Vorlage \u2014 im Stapel aufheben oder andere Ebene w\u00E4hlen'); return; }
  pt=snapPt(pt,pt);
  if(t==='pick'){ pickAt(pt); pushRecentCol(color); return; }
  if(lens==='draw') return beginPixel(t,l,pt,pres,pid);
  if(lens==='vektor') return beginPfad(t,l,pt,pid,dbl);
  return beginLayout(t,l,pt,pid,dbl);
}
function moveStroke(pt,pres){
  if(!drag) return;
  if(drag.start) pt=snapPt(pt,drag.start);
  var k=drag.kind;
  if(k==='paint'){ paintLine(drag.l,drag.last,pt,pres,drag.erase); drag.last=pt; req(); }
  else if(k==='path'){ drag.pts.push(pt); req(); }
  else if(k==='node'){ var p=drag.l.data.paths[drag.idx]; if(p&&p.pts[drag.pt]){ p.pts[drag.pt]=pt; invalidate('pfade'); req(); } }
  else if(k==='moveEl'){ var el=drag.l.data.els[drag.idx];
    el.x=drag.orig.x+(pt.x-drag.start.x); el.y=drag.orig.y+(pt.y-drag.start.y);
    invalidate('layout'); req(); }
  else if(k==='mkEl'||k==='selRect'||k==='grad'){ drag.cur=pt; req(); }
  else if(k==='movePix'){ movePixTo(pt); }
  else if(k==='fx'){ fxDab(drag.l,pt,pres); drag.last=pt; req(); }
  else if(k==='movePath'){
    var dx=pt.x-drag.start.x, dy=pt.y-drag.start.y;
    drag.l.data.paths[drag.idx].pts=drag.orig.map(function(q){ return {x:q.x+dx,y:q.y+dy}; });
    invalidate('pfade'); req();
  }
}
function endStroke(){
  painting=false; strokePid=null;
  if(!drag){ return; }
  var d=drag; drag=null;
  if(d.kind==='path'){
    var sm=smoothPts(d.pts,VALS.vektor.v2.val);
    if(sm.length>1){
      var base=decimate(sm,1.6);
      mirrorPaths(base).forEach(function(pp){
        d.l.data.paths.push({pts:pp,w:VALS.vektor.v1.val,col:color,closed:false});
      });
      invalidate('pfade');
    }
  } else if(d.kind==='mkEl'){
    var a=d.start, b=d.cur||{x:a.x+280,y:a.y+70};
    var x=Math.min(a.x,b.x), y=Math.min(a.y,b.y);
    var w=Math.max(30,Math.abs(b.x-a.x)), h=Math.max(24,Math.abs(b.y-a.y));
    var el={kind:d.elKind,x:x,y:y,w:w,h:h,col:color};
    if(d.elKind==='text'){ el.text='TEXT'; el.size=VALS.studio.v1.val; el.track=VALS.studio.v2.val; el.h=Math.max(h,el.size*1.1); }
    if(d.elKind==='frame'||d.elKind==='imgframe') el.dash=true;
    d.l.data.els.push(el);
    overlaySel={layerId:d.l.id,idx:d.l.data.els.length-1};
    invalidate('layout');
  } else if(d.kind==='selRect'){
    var a2=d.start, b2=d.cur||a2;
    sel={x:Math.min(a2.x,b2.x),y:Math.min(a2.y,b2.y),w:Math.abs(b2.x-a2.x),h:Math.abs(b2.y-a2.y)};
    if(sel.w<4||sel.h<4) sel=null;
    toast(sel?'Auswahl gesetzt \u2014 Verschieben bewegt sie':'Auswahl aufgehoben');
  } else if(d.kind==='grad'){
    applyGradient(d.l,d.start,d.cur||d.start);
  } else if(d.kind==='movePix'){
    commitMovePix(d);
  } else if(d.kind==='paint'||d.kind==='fx'){
    invalidate('pixel');
  } else if(d.kind==='node'||d.kind==='movePath'){
    invalidate('pfade');
  } else if(d.kind==='moveEl'){
    invalidate('layout');
  }
  autosaveSoon(); req();
}

/* ── Pixel-Linse ─────────────────────────────────────────────────── */
var sel=null, floatPix=null;
function beginPixel(t,l,pt,pres,pid){
  if(t==='fill'){ fillAt(l,pt); return; }
  if(t==='selRect'){ drag={kind:'selRect',l:l,start:pt,id:pid}; return; }
  if(t==='move'){
    if(!sel){ toast('Erst eine Auswahl aufziehen'); return; }
    liftPix(l);
    drag={kind:'movePix',l:l,start:pt,orig:{x:sel.x,y:sel.y},id:pid};
    return;
  }
  if(t==='grad'){ drag={kind:'grad',l:l,start:pt,id:pid}; return; }
  if(t==='blur'||t==='smudge'||t==='dodge'||t==='burn'){
    drag={kind:'fx',l:l,fx:t,last:pt,start:pt,id:pid};
    painting=true; strokePid=pid;
    fxDab(l,pt,pres); req(); return;
  }
  drag={kind:'paint',l:l,erase:t==='eraser',last:pt,start:pt,id:pid};
  painting=true; strokePid=pid;
  paintDot(l,pt,pres,t==='eraser'); req();
}
function fxDab(l,pt,pres){
  var g=l.data.cv.getContext('2d');
  var rad=Math.max(2,VALS.draw.v1.val*pres/2), d=rad*2;
  var x=Math.round(pt.x-rad), y=Math.round(pt.y-rad);
  if(x<0||y<0||x+d>doc.w||y+d>doc.h||d<1) return;
  var img;
  try{ img=g.getImageData(x,y,Math.ceil(d),Math.ceil(d)); }catch(e){ return; }
  var p=img.data, fx=drag?drag.fx:'blur', k=VALS.draw.v2.val/100;
  if(fx==='blur'){
    var cp=new Uint8ClampedArray(p), W=img.width;
    for(var yy=1;yy<img.height-1;yy++) for(var xx=1;xx<W-1;xx++){
      for(var c=0;c<4;c++){
        var i=(yy*W+xx)*4+c;
        var avg=(cp[i]+cp[i-4]+cp[i+4]+cp[i-W*4]+cp[i+W*4])/5;
        p[i]=cp[i]+(avg-cp[i])*k;
      }
    }
  } else if(fx==='dodge'||fx==='burn'){
    var f=(fx==='dodge'?1:-1)*k*40;
    for(var j=0;j<p.length;j+=4){ p[j]+=f; p[j+1]+=f; p[j+2]+=f; }
  } else if(fx==='smudge'){
    var sx=drag&&drag.last?Math.sign(pt.x-drag.last.x):0;
    var cp2=new Uint8ClampedArray(p), W2=img.width, off=(sx>=0?-1:1)*4;
    for(var m=4;m<p.length-4;m+=4) for(var c2=0;c2<4;c2++)
      p[m+c2]=cp2[m+c2]+((cp2[m+off+c2]||cp2[m+c2])-cp2[m+c2])*k;
  }
  g.putImageData(img,x,y);
}
function liftPix(l){
  if(!sel||floatPix) return;
  var cv=document.createElement('canvas');
  cv.width=Math.max(1,Math.round(sel.w)); cv.height=Math.max(1,Math.round(sel.h));
  cv.getContext('2d').drawImage(l.data.cv,-sel.x,-sel.y);
  var g=l.data.cv.getContext('2d');
  g.save(); g.globalCompositeOperation='destination-out';
  g.fillStyle='#000'; g.fillRect(sel.x,sel.y,sel.w,sel.h); g.restore();
  floatPix={cv:cv,x:sel.x,y:sel.y};
  invalidate('pixel');
}
function movePixTo(pt){
  if(!floatPix||!drag) return;
  floatPix.x=drag.orig.x+(pt.x-drag.start.x);
  floatPix.y=drag.orig.y+(pt.y-drag.start.y);
  sel.x=floatPix.x; sel.y=floatPix.y;
  req();
}
function commitMovePix(d){
  d=d||drag;
  if(!floatPix||!d) return;
  var g=d.l.data.cv.getContext('2d');
  g.drawImage(floatPix.cv,floatPix.x,floatPix.y);
  floatPix=null; invalidate('pixel');
}
function applyGradient(l,a,b){
  var g=l.data.cv.getContext('2d');
  var gr=g.createLinearGradient(a.x,a.y,b.x,b.y);
  var rgb=hexToRgb(color)||{r:0,g:0,b:0};
  gr.addColorStop(0,'rgba('+rgb.r+','+rgb.g+','+rgb.b+','+(VALS.draw.v2.val/100)+')');
  gr.addColorStop(1,'rgba('+rgb.r+','+rgb.g+','+rgb.b+',0)');
  g.save();
  if(sel){ g.beginPath(); g.rect(sel.x,sel.y,sel.w,sel.h); g.clip(); }
  g.fillStyle=gr; g.fillRect(0,0,doc.w,doc.h); g.restore();
  invalidate('pixel'); toast('Verlauf aufgetragen');
}

/* ── Pfade-Linse ─────────────────────────────────────────────────── */
function beginPfad(t,l,pt,pid,dbl){
  if(t==='eraser'){ erasePathAt(l,pt); return; }
  if(t==='curve'){ addCurvePoint(l,pt); return; }
  if(t==='fill'){
    var h0=hitPath(l,pt);
    if(h0){ l.data.paths[h0.idx].col=color; invalidate('pfade'); toast('Farbe zugewiesen'); req(); }
    else toast('Keinen Pfad getroffen');
    return;
  }
  if(t==='sel'||t==='node'){
    var h=hitPath(l,pt);
    overlaySel=h?{layerId:l.id,idx:h.idx,pt:h.pt}:null;
    drag=h?{kind:'node',l:l,idx:h.idx,pt:h.pt,id:pid}:null;
    req(); return;
  }
  if(t==='move'){
    var h2=hitPath(l,pt);
    if(!h2){ toast('Keinen Pfad getroffen'); return; }
    overlaySel={layerId:l.id,idx:h2.idx,pt:h2.pt};
    drag={kind:'movePath',l:l,idx:h2.idx,start:pt,
          orig:l.data.paths[h2.idx].pts.map(function(q){ return {x:q.x,y:q.y}; }),id:pid};
    return;
  }
  drag={kind:'path',l:l,pts:[pt],start:pt,id:pid};
  painting=true; strokePid=pid;
}

/* ── Layout-Linse ────────────────────────────────────────────────── */
function beginLayout(t,l,pt,pid,dbl){
  if(t==='text'||t==='frame'||t==='bar'||t==='imgframe'){
    drag={kind:'mkEl',l:l,elKind:t,start:pt,id:pid}; return;
  }
  var h=hitEl(l,pt);
  if(h&&dbl){ overlaySel={layerId:l.id,idx:h.idx}; openTextWin(l,h.idx); req(); return; }
  overlaySel=h?{layerId:l.id,idx:h.idx}:null;
  if(h) drag={kind:'moveEl',l:l,idx:h.idx,start:pt,orig:cloneEl(l.data.els[h.idx]),id:pid};
  req();
}

function pressure(e){ return (e.pointerType==='pen'&&e.pressure)?Math.max(0.15,e.pressure):1; }
function cloneEl(e){ return JSON.parse(JSON.stringify(e)); }
function decimate(pts,minD){
  var out=[pts[0]];
  for(var i=1;i<pts.length;i++){
    var l=out[out.length-1];
    if(Math.hypot(pts[i].x-l.x,pts[i].y-l.y)>=minD) out.push(pts[i]);
  }
  if(out.length<2) out.push(pts[pts.length-1]);
  return out;
}

/* ══════════ LINEAL · SCHABLONE · SPIEGEL ══════════ */
var guide={rule:'aus',ang:0,vp:null,el:null,mirror:'aus',axes:6};
var lastTap={t:0,x:0,y:0};
function guideCenter(){ return {x:doc.w/2,y:doc.h/2}; }
function ensureVp(){ if(!guide.vp) guide.vp={x:doc.w/2,y:-doc.h*0.35}; return guide.vp; }
function ensureEl(){ if(!guide.el) guide.el={cx:doc.w/2,cy:doc.h/2,rx:doc.w*0.30,ry:doc.h*0.26}; return guide.el; }
function projDir(pt,start,ang){
  var dx=Math.cos(ang),dy=Math.sin(ang);
  var t=(pt.x-start.x)*dx+(pt.y-start.y)*dy;
  return {x:start.x+dx*t,y:start.y+dy*t};
}
function snapPt(pt,start){
  var r=guide.rule;
  if(r==='aus'||!start) return pt;
  if(r==='gerade') return projDir(pt,start,guide.ang*Math.PI/180);
  if(r==='winkel'){
    var a=Math.atan2(pt.y-start.y,pt.x-start.x);
    var step=Math.PI/12;                                  /* 15° */
    return projDir(pt,start,Math.round(a/step)*step);
  }
  if(r==='persp'){
    var vp=ensureVp();
    var a2=Math.atan2(start.y-vp.y,start.x-vp.x);
    return projDir(pt,start,a2);
  }
  if(r==='ellipse'){
    var el=ensureEl(), vx=(pt.x-el.cx)/el.rx, vy=(pt.y-el.cy)/el.ry;
    var n=Math.hypot(vx,vy)||1;
    return {x:el.cx+(vx/n)*el.rx, y:el.cy+(vy/n)*el.ry};
  }
  if(r==='kreis'){
    var c=guideCenter(), rad=Math.hypot(start.x-c.x,start.y-c.y)||1;
    var a3=Math.atan2(pt.y-c.y,pt.x-c.x);
    return {x:c.x+Math.cos(a3)*rad, y:c.y+Math.sin(a3)*rad};
  }
  return pt;
}
function mirrorPts(pt){
  var out=[pt], c=guideCenter();
  if(guide.mirror==='x') out.push({x:doc.w-pt.x,y:pt.y});
  else if(guide.mirror==='xy') out.push({x:doc.w-pt.x,y:pt.y},{x:pt.x,y:doc.h-pt.y},{x:doc.w-pt.x,y:doc.h-pt.y});
  else if(guide.mirror==='radial'){
    var n=Math.max(2,Math.min(24,guide.axes));
    for(var i=1;i<n;i++){
      var a=i*2*Math.PI/n, dx=pt.x-c.x, dy=pt.y-c.y;
      out.push({x:c.x+dx*Math.cos(a)-dy*Math.sin(a), y:c.y+dx*Math.sin(a)+dy*Math.cos(a)});
    }
  }
  return out;
}
function mirrorPaths(pts){
  var n=mirrorPts(pts[0]).length, out=[];
  for(var k=0;k<n;k++) out.push(pts.map(function(p){ return mirrorPts(p)[k]; }));
  return out;
}
function setGuide(k,v){
  guide[k]=v;
  if(k==='rule'&&v==='persp') ensureVp();
  if(k==='rule'&&v==='ellipse') ensureEl();
  try{ localStorage.setItem('koslinse_guide',JSON.stringify(guide)); }catch(e){}
  renderBadges(); radRelayout(); req();
}
function drawGuides(g){
  var r=guide.rule, dash=[10/view.scale,8/view.scale];
  g.save(); g.setLineDash(dash); g.lineWidth=1.6/view.scale; g.strokeStyle='#9fb0bb88';
  if(r==='gerade'){
    var c=guideCenter(), a=guide.ang*Math.PI/180, L=Math.max(doc.w,doc.h);
    var s=drag&&drag.start?drag.start:c;
    g.beginPath(); g.moveTo(s.x-Math.cos(a)*L,s.y-Math.sin(a)*L);
    g.lineTo(s.x+Math.cos(a)*L,s.y+Math.sin(a)*L); g.stroke();
  } else if(r==='persp'){
    var vp=ensureVp(), L2=Math.max(doc.w,doc.h)*2;
    for(var i=0;i<7;i++){
      var an=(-70+i*23)*Math.PI/180;
      g.beginPath(); g.moveTo(vp.x,vp.y); g.lineTo(vp.x+Math.cos(an)*L2,vp.y+Math.sin(an)*L2); g.stroke();
    }
  } else if(r==='ellipse'){
    var el=ensureEl();
    g.beginPath(); g.ellipse(el.cx,el.cy,el.rx,el.ry,0,0,Math.PI*2); g.stroke();
  } else if(r==='kreis'){
    var cc=guideCenter();
    g.beginPath(); g.arc(cc.x,cc.y,Math.min(doc.w,doc.h)*0.32,0,Math.PI*2); g.stroke();
  }
  if(guide.mirror!=='aus'){
    var c2=guideCenter();
    g.strokeStyle=LENS[lens].c+'99';
    if(guide.mirror==='x'||guide.mirror==='xy'){ g.beginPath(); g.moveTo(c2.x,0); g.lineTo(c2.x,doc.h); g.stroke(); }
    if(guide.mirror==='xy'){ g.beginPath(); g.moveTo(0,c2.y); g.lineTo(doc.w,c2.y); g.stroke(); }
    if(guide.mirror==='radial'){
      var n2=Math.max(2,Math.min(24,guide.axes)), R=Math.max(doc.w,doc.h);
      for(var j=0;j<n2;j++){
        var aa=j*2*Math.PI/n2;
        g.beginPath(); g.moveTo(c2.x,c2.y); g.lineTo(c2.x+Math.cos(aa)*R,c2.y+Math.sin(aa)*R); g.stroke();
      }
    }
  }
  g.setLineDash([]); g.restore();
}

/* Pixel-Werkzeuge */
function paintDot(l,pt,p,erase){
  mirrorPts(pt).forEach(function(q){ paintDot1(l,q,p,erase); });
}
function paintDot1(l,pt,p,erase){
  var g=l.data.cv.getContext('2d');
  g.save();
  g.globalCompositeOperation=erase?'destination-out':'source-over';
  g.globalAlpha=erase?1:VALS.draw.v2.val/100;
  g.fillStyle=color;
  g.beginPath(); g.arc(pt.x,pt.y,VALS.draw.v1.val*p/2,0,Math.PI*2); g.fill();
  g.restore();
}
function paintLine(l,a,b,p,erase){
  var d=Math.hypot(b.x-a.x,b.y-a.y), steps=Math.max(1,Math.ceil(d/(VALS.draw.v1.val*0.18)));
  for(var i=1;i<=steps;i++){
    paintDot(l,{x:a.x+(b.x-a.x)*i/steps,y:a.y+(b.y-a.y)*i/steps},p,erase);
  }
}
function fillAt(l,pt){
  var g=l.data.cv.getContext('2d');
  g.save(); g.globalAlpha=VALS.draw.v2.val/100; g.fillStyle=color;
  g.fillRect(0,0,doc.w,doc.h); g.restore();
  invalidate('pixel'); toast('Fläche gefüllt'); autosaveSoon(); req();
}
function pickAt(pt){
  var cv=document.createElement('canvas'); cv.width=1; cv.height=1;
  var g=cv.getContext('2d');
  g.translate(-pt.x,-pt.y);
  doc.stack.forEach(function(l){ if(l.visible){ g.globalAlpha=l.opacity; drawLayer(g,l,false); } });
  var d=g.getImageData?cv.getContext('2d').getImageData(0,0,1,1).data:[0,0,0,0];
  if(d[3]>10){ setColor('#'+[d[0],d[1],d[2]].map(function(v){return v.toString(16).padStart(2,'0');}).join('')); toast('Farbe aufgenommen'); }
}
function erasePathAt(l,pt){
  var h=hitPath(l,pt);
  if(h){ l.data.paths.splice(h.idx,1); overlaySel=null; invalidate('pfade'); autosaveSoon(); req(); }
}
var curveOpen=null;
function addCurvePoint(l,pt){
  if(!curveOpen||curveOpen.l!==l){
    curveOpen={l:l,path:{pts:[pt],w:VALS.vektor.v1.val,col:color,closed:false}};
    l.data.paths.push(curveOpen.path);
  } else {
    curveOpen.path.pts.push(pt);
  }
  overlaySel={layerId:l.id,idx:l.data.paths.indexOf(curveOpen.path),pt:curveOpen.path.pts.length-1};
  invalidate('pfade'); autosaveSoon(); req();
}

</script>
<script>
'use strict';
/* ══════════ WERKZEUGRAD (Prototyp VII) ══════════
   Modi: folgend (erscheint, wo der Stift 0,5 s ruht; Berühren blendet aus)
         fest    (immer da; beim Zeichnen 30 % Deckkraft; Kern halten+ziehen)
         aus
   Stiftknopf = Radierer (Ausnahme — holt nie das Rad).
   Kern gedrückt halten fixiert (→ fest), antippen löst (→ folgend).
   Zwei Wertregler links/rechts. 5 Werkzeuge + Alle. Fächer bei erneutem
   Antippen des aktiven Werkzeugs. Doppeltipp = Fenster.                  */
var rad={
  mode:'folgend',            /* folgend | fest | aus */
  x:0,y:0, shown:false, open:false, fan:null, big:false,
  hoverT:0, hx:0, hy:0, lastTap:{t:0,id:''}
};
try{ var rm=localStorage.getItem('koslinse_radmode'); if(rm) rad.mode=rm; }catch(e){}
var radEl=$('rad');

var RADHINT={
  folgend:'1 Finger schieben \u00B7 2 zoomen+drehen \u00B7 Rad nach 0,3 s Ruhe',
  fest:'1 Finger schieben \u00B7 2 zoomen+drehen \u00B7 Kern halten verschiebt das Rad',
  aus:'1 Finger schieben \u00B7 2 zoomen+drehen \u00B7 Rad aus (Befehlsfeld: K)'
};
function setRadMode(m){
  rad.mode=m;
  if($('hint')) $('hint').textContent=RADHINT[m]||'';
  try{ localStorage.setItem('koslinse_radmode',m); }catch(e){}
  $('rmF').classList.toggle('on',m==='folgend');
  $('rmX').classList.toggle('on',m==='fest');
  $('rmO').classList.toggle('on',m==='aus');
  if(m==='aus'){ hideRad(); }
  else if(m==='fest'){ if(!rad.x){ centerRad(); } showRad(); }
  else { hideRad(); }
}
function centerRad(){
  var r=$('stagewrap').getBoundingClientRect();
  rad.x=r.width*0.42; rad.y=r.height*0.5;
}
function showRad(){ rad.shown=true; radRelayout(); }
function hideRad(){ rad.shown=false; rad.open=false; rad.fan=null; rad.big=false; radRelayout(); }

/* Ruhe-Erkennung (Stift schwebt oder Maus steht) */
function radOnHover(e){
  if(rad.mode!=='folgend'||drag||gest||touchMode) return;
  if(e.pointerType==='touch') return;
  var moved=Math.hypot(e.clientX-rad.hx,e.clientY-rad.hy)>6;
  if(moved){
    rad.hx=e.clientX; rad.hy=e.clientY;
    clearTimeout(rad.hoverT);
    if(!rad.shown){
      rad.hoverT=setTimeout(function(){
        var r=$('stagewrap').getBoundingClientRect();
        rad.x=rad.hx-r.left; rad.y=rad.hy-r.top;
        rad.open=true; showRad();
      },300);            /* 0,3 s — Rad kommt schneller nach dem Absetzen */
    }
  }
}
function radOnTouch(){ /* Berühren zeichnet — Rad ist sofort weg (folgend) bzw. dimmt (fest) */
  clearTimeout(rad.hoverT);
  if(rad.mode==='folgend'){ if(rad.shown) hideRad(); }
  else if(rad.mode==='fest'){ radEl.classList.add('dim'); rad.open=false; rad.fan=null; rad.big=false; radRelayout(); }
}
stage.addEventListener('pointerup',function(){ radEl.classList.remove('dim'); });

/* ══════════ AUFBAU ══════════ */
function radRelayout(){
  radEl.innerHTML='';
  radEl.classList.toggle('fixed',rad.mode==='fest');
  if(!rad.shown||rad.mode==='aus'){ radEl.style.display='none'; return; }
  radEl.style.display='';
  radEl.style.left=rad.x+'px'; radEl.style.top=rad.y+'px';
  /* Kern */
  var core=document.createElement('div');
  core.className='rk';
  core.innerHTML='<span>'+(TOOLDEF[tool()]||{}).g+'</span><span class="pin">&#128204;</span>';
  bindCore(core);
  radEl.appendChild(core);
  if(!rad.open) return;
  var R=86;
  if(!rad.big){
    /* 5 Werkzeuge (oben, r-oben, r-unten, l-unten, l-oben) */
    var defs=RING[lens];
    var angs=[-90,-30,30,150,210];
    defs.forEach(function(t,i){
      var a=angs[i]*Math.PI/180;
      radEl.appendChild(mkSat(t,Math.cos(a)*R,Math.sin(a)*R));
      if(t===tool()){
        var lb=document.createElement('div'); lb.className='rlbl';
        lb.style.left=Math.cos(a)*R+'px'; lb.style.top=(Math.sin(a)*R+32)+'px';
        lb.textContent=(TOOLDEF[t]||{}).nm;
        radEl.appendChild(lb);
      }
    });
  }
  /* Unterer Sektor ist in jeder Linse „Alle“ — und schließt den großen Ring wieder */
  var all=document.createElement('div');
  all.className='rs all'+(rad.big?' on':'');
  all.style.left='0px'; all.style.top=R+'px';
  all.textContent=rad.big?'Zu':'Alle';
  all.addEventListener('click',function(ev){ ev.stopPropagation(); rad.big=!rad.big; rad.fan=null; radRelayout(); });
  radEl.appendChild(all);
  /* Regler links/rechts in der Lücke */
  radEl.appendChild(mkSlider('v1',-R*0.52,0));
  radEl.appendChild(mkSlider('v2',R*0.52,0));
  if(rad.fan) buildFan();
  if(rad.big) buildBig();
}
function mkSat(t,x,y,size){
  var el=document.createElement('div');
  var isCol=(t==='pick');
  var isAct=!!(TOOLDEF[t]&&TOOLDEF[t].act);
  el.className='rs'+(t===tool()&&!isAct?' on':'')+(isAct?' cmd':'');
  el.style.left=x+'px'; el.style.top=y+'px';
  if(size){ el.style.width=size+'px'; el.style.height=size+'px'; el.style.fontSize=Math.max(11,size*0.36)+'px'; }
  if(isCol){ el.style.background=color; el.style.borderColor='#0a0a0a55'; el.innerHTML='<span class="bnd" style="--c:'+color+'"></span>'; el.title='Farbe'; }
  else { el.textContent=(TOOLDEF[t]||{}).g; el.title=(TOOLDEF[t]||{}).nm; }
  el.addEventListener('click',function(ev){
    ev.stopPropagation();
    var now=Date.now();
    var dbl=(now-rad.lastTap.t<420&&rad.lastTap.id===t);
    rad.lastTap={t:now,id:t};
    if(dbl&&(t==='brush'||t==='pen'||t==='pick')){ openToolWin(t); return; }
    if(isAct){ TOOLDEF[t].act(); rad.fan=null; rad.big=false; radRelayout(); return; }
    if(isCol){
      if(rad.fan==='color'){ rad.fan=null; } else { rad.fan='color'; rad.big=false; }
      radRelayout(); return;
    }
    if(t===tool()){ /* aktives Werkzeug nochmal: Fächer */
      var f=fanKind(t);
      rad.fan=(rad.fan===f)?null:f; rad.big=false; radRelayout(); return;
    }
    setTool(t); rad.fan=null; radRelayout();
  });
  return el;
}
function fanKind(t){
  if(t==='brush'||t==='pen') return 'tips';
  if(t==='ruler') return 'ruler';
  return null;
}
/* Regler: aufsetzen und senkrecht ziehen */
function mkSlider(key,x,y){
  var el=document.createElement('div');
  el.className='rr'; el.style.left=x+'px'; el.style.top=y+'px';
  var s=VALS[lens][key];
  var f=document.createElement('div'); f.className='fill';
  f.style.height=Math.round((s.val-s.min)/(s.max-s.min)*100)+'%';
  el.appendChild(f);
  el.title=s.nm;
  var st=null, valEl=null;
  el.addEventListener('pointerdown',function(e){
    e.stopPropagation(); e.preventDefault();
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    st={y:e.clientY,val:VALS[lens][key].val};
    valEl=document.createElement('div'); valEl.className='rval';
    valEl.style.left='0px'; valEl.style.top='-92px';
    radEl.appendChild(valEl); updV();
  });
  el.addEventListener('pointermove',function(e){
    if(!st) return;
    var sp=VALS[lens][key];
    var range=sp.max-sp.min;
    setVal(key,st.val+(st.y-e.clientY)*range/140);
    f.style.height=Math.round((sp.val-sp.min)/range*100)+'%';
    updV();
  });
  function updV(){ if(valEl) valEl.textContent=VALS[lens][key].nm+' '+fmtVal(VALS[lens][key]); }
  function done(){ st=null; if(valEl){ valEl.remove(); valEl=null; } autosaveSoon(); }
  el.addEventListener('pointerup',done);
  el.addEventListener('pointercancel',done);
  return el;
}
/* Kern: tippen = Ring auf/zu bzw. Fixierung lösen · halten = fixieren + ziehen */
function bindCore(core){
  var st=null,fixT=0;
  core.addEventListener('pointerdown',function(e){
    e.stopPropagation(); e.preventDefault();
    try{ core.setPointerCapture(e.pointerId); }catch(err){}
    st={x:e.clientX,y:e.clientY,ox:rad.x,oy:rad.y,moved:false,fixed:false};
    fixT=setTimeout(function(){
      if(!st) return;
      st.fixed=true;
      if(rad.mode!=='fest') setRadMode('fest');
      showRad();
      toast('Rad fixiert — ziehen zum Platzieren, antippen löst');
    },480);
  });
  core.addEventListener('pointermove',function(e){
    if(!st) return;
    var dx=e.clientX-st.x, dy=e.clientY-st.y;
    if(!st.moved&&Math.hypot(dx,dy)>7){ st.moved=true; clearTimeout(fixT); if(rad.mode!=='fest'){ setRadMode('fest'); } }
    if(st.moved||st.fixed){
      rad.x=st.ox+dx; rad.y=st.oy+dy;
      radEl.style.left=rad.x+'px'; radEl.style.top=rad.y+'px';
    }
  });
  core.addEventListener('pointerup',function(){
    clearTimeout(fixT);
    if(!st) return;
    var s=st; st=null;
    if(s.fixed||s.moved){ persistRad(); return; }
    if(rad.mode==='fest'&&!rad.open&&!rad.big&&!rad.fan){ rad.open=true; radRelayout(); return; }
    if(rad.mode==='fest'&&(rad.open||rad.big||rad.fan)){
      /* kurz antippen löst die Fixierung */
      setRadMode('folgend'); hideRad(); toast('Fixierung gelöst — Rad folgt dem Stift');
      return;
    }
    rad.open=!rad.open; rad.fan=null; rad.big=false; radRelayout();
  });
  core.addEventListener('pointercancel',function(){ clearTimeout(fixT); st=null; });
}
function persistRad(){ try{ localStorage.setItem('koslinse_radpos',JSON.stringify({x:rad.x,y:rad.y})); }catch(e){} }
try{ var rp=JSON.parse(localStorage.getItem('koslinse_radpos')||'null'); if(rp){ rad.x=rp.x; rad.y=rp.y; } }catch(e){}

/* ══════════ FÄCHER ══════════ */
function buildFan(){
  var items=[];
  if(rad.fan==='color'){
    var pinned=pinCols.slice(0,4);
    var rest=recentCols.filter(function(c){return pinned.indexOf(c)<0&&c!=='#111111'&&c!=='#ffffff';});
    var cols=pinned.concat(rest).slice(0,4).concat(['#111111','#ffffff']);
    items=cols.map(function(c){ return {kind:'col',v:c,pin:pinCols.indexOf(c)>=0}; });
  } else if(rad.fan==='tips'){
    var pt2=pinTips.slice(0,5);
    var rt=recentTips.filter(function(t){return pt2.indexOf(t)<0;});
    items=pt2.concat(rt).slice(0,3).map(function(t){ return {kind:'tip',v:t,pin:pinTips.indexOf(t)>=0}; });
    items.push({kind:'dots'});
  } else if(rad.fan==='ruler'){
    items=[{kind:'rul',v:'Gerade',r:'gerade'},{kind:'rul',v:'Winkel',r:'winkel'},{kind:'rul',v:'Persp.',r:'persp'},{kind:'dots'}];
  } else return;
  var R=150, a0=-150, step=32;
  items.forEach(function(it,i){
    var a=(a0+i*step)*Math.PI/180;
    var el=document.createElement('div');
    el.className='fan'+(it.pin?'':'');
    el.style.left=Math.cos(a)*R+'px'; el.style.top=Math.sin(a)*R+'px';
    if(it.kind==='col'){ el.style.background=it.v; el.style.borderColor=it.v==='#ffffff'?'#999':it.v;
      if(it.v===color) el.classList.add('on');
      if(it.pin) el.innerHTML='<span class="pindot"></span>';
      el.addEventListener('click',function(ev){ ev.stopPropagation(); setColor(it.v); rad.fan=null; radRelayout(); });
    } else if(it.kind==='tip'){
      el.textContent=it.v[0].toUpperCase();
      if(it.v===curTip) el.classList.add('on');
      if(it.pin) el.innerHTML+='<span class="pindot"></span>';
      el.title=it.v;
      el.addEventListener('click',function(ev){ ev.stopPropagation(); setTip(it.v); rad.fan=null; radRelayout(); });
    } else if(it.kind==='rul'){
      el.textContent=it.v[0];
      el.title=it.v;
      if(guide.rule===it.r) el.classList.add('on');
      el.addEventListener('click',function(ev){
        ev.stopPropagation();
        setGuide('rule',guide.rule===it.r?'aus':it.r);
        toast('Lineal: '+(guide.rule==='aus'?'aus':it.v));
        rad.fan=null; radRelayout();
      });
    } else { /* … = Fenster */
      el.classList.add('dots'); el.textContent='\u22EF'; el.title='Fenster öffnen';
      el.addEventListener('click',function(ev){ ev.stopPropagation();
        openToolWin(rad.fan==='tips'?(lens==='vektor'?'pen':'brush'):'ruler'); });
    }
    radEl.appendChild(el);
  });
}
function setTip(t){
  curTip=t;
  recentTips=[t].concat(recentTips.filter(function(x){return x!==t;})).slice(0,8);
  toast('Spitze: '+t);
}

/* ══════════ GROSSER RING (Alle) — klappt an Ort und Stelle auf ══════════ */
/* Bildschirmrechteck des Blattes (dagegen wird gemessen, nicht gegen das Fenster) */
function sheetRect(){
  var ps=[{x:0,y:0},{x:doc.w,y:0},{x:doc.w,y:doc.h},{x:0,y:doc.h}].map(w2s);
  var xs=ps.map(function(p){return p.x;}), ys=ps.map(function(p){return p.y;});
  return {x0:Math.min.apply(null,xs),y0:Math.min.apply(null,ys),
          x1:Math.max.apply(null,xs),y1:Math.max.apply(null,ys)};
}
/* Großer Ring: im Uhrzeigersinn ab oben, Lücke zwischen den Gruppen,
   Radius und Zielgröße nach Anzahl, Beschriftungen versetzt.
   Klappt an Ort und Stelle auf und rückt nur ein, wenn er sonst
   über den Blattrand ragen würde.                                    */
function buildBig(){
  var groups=ALLTOOLS[lens], slots=[];
  groups.forEach(function(gr,gi){
    if(gi) slots.push(null);                 /* Lücke */
    gr[1].forEach(function(t){ slots.push({t:t,g:gi}); });
  });
  var n=slots.length;
  var step=360/n;                            /* 15–30° je nach Anzahl */
  var R=Math.round(clamp(52+n*7.0,120,240));
  var size=Math.round(clamp(46-n*0.45,34,44));
  var need=R+size/2+34;
  var sr=sheetRect(), vp=$('stagewrap').getBoundingClientRect();
  var bx0=sr.x0,by0=sr.y0,bx1=sr.x1,by1=sr.y1;
  if(bx1-bx0<2*need||by1-by0<2*need){ bx0=0; by0=0; bx1=vp.width; by1=vp.height; }
  var cx=clamp(rad.x,bx0+need,bx1-need);
  var cy=clamp(rad.y,by0+need,by1-need);
  rad.x=cx; rad.y=cy;
  radEl.style.left=cx+'px'; radEl.style.top=cy+'px';
  var lastG=-1;
  slots.forEach(function(f,i){
    if(!f) return;
    var a=(-90+i*step)*Math.PI/180;
    radEl.appendChild(mkSat(f.t,Math.cos(a)*R,Math.sin(a)*R,size));
    var lr=R+(i%2?38:22);                    /* versetzt, damit lange Namen nicht überlagern */
    var lb=document.createElement('div');
    lb.className='rlbl';
    lb.style.left=Math.cos(a)*lr+'px';
    lb.style.top=Math.sin(a)*lr+'px';
    lb.textContent=(TOOLDEF[f.t]||{}).nm;
    radEl.appendChild(lb);
    if(f.g!==lastG){                          /* Gruppenname am Anfang jeder Gruppe */
      lastG=f.g;
      var gl=document.createElement('div');
      gl.className='rlbl grp';
      gl.style.left=Math.cos(a-step*0.5*Math.PI/180)*(R+62)+'px';
      gl.style.top=Math.sin(a-step*0.5*Math.PI/180)*(R+62)+'px';
      gl.textContent=groups[f.g][0].toUpperCase();
      radEl.appendChild(gl);
    }
  });
}

/* ══════════ FENSTER ══════════ */
var WINS=['winColor','winBrush','winRuler','uebmenu','winfile','winText','winLayer'];
function openWin(id){
  WINS.forEach(function(w){ $(w).classList.remove('show'); });
  var el=$(id);
  if(id==='winColor') buildColorWin();
  if(id==='winBrush') buildBrushWin();
  if(id==='winRuler') buildRulerWin();
  el.style.left='50%'; el.style.top='60px'; el.style.transform='translateX(-50%)';
  if(id==='uebmenu'){ el.style.left=''; el.style.transform=''; el.style.right='10px'; el.style.top='52px'; }
  el.classList.add('show');
  rad.fan=null; rad.big=false; radRelayout();
}
function closeWins(){ WINS.forEach(function(w){ $(w).classList.remove('show'); }); }
function openToolWin(t){
  if(t==='pick') openWin('winColor');
  else if(t==='brush'||t==='pen') openWin('winBrush');
  else if(t==='ruler') openWin('winRuler');
}
function buildColorWin(){ buildColorPanel(); }
function buildBrushWin(){
  var w=$('winBrush');
  var html='<button class="wx" data-close="winBrush">\u2715</button><h5>SPITZE \u00B7 '+(lens==='vektor'?'PROFIL':'PINSEL')+'</h5><div class="tiprow">';
  TIPS.forEach(function(t){
    var inFan=pinTips.concat(recentTips).slice(0,3).indexOf(t.id)>=0;
    html+='<div class="tip'+(t.id===curTip?' on':'')+(inFan?' infan':'')+'" data-tip="'+t.id+'">'
        +'<canvas width="240" height="44" data-prev="'+t.id+'"></canvas><span class="nm">'+t.nm+'</span>'
        +'<span class="st'+(pinTips.indexOf(t.id)>=0?' on':'')+'" data-pintip="'+t.id+'">\u2605</span></div>';
  });
  html+='</div>';
  w.innerHTML=html;
  w.querySelectorAll('[data-prev]').forEach(function(cv){ drawTipPreview(cv); });
  w.querySelectorAll('[data-tip]').forEach(function(el){
    el.addEventListener('click',function(e){
      if(e.target.dataset.pintip) return;
      setTip(el.dataset.tip); buildBrushWin();
    });
  });
  w.querySelectorAll('[data-pintip]').forEach(function(el){
    el.addEventListener('click',function(e){
      e.stopPropagation();
      var t=el.dataset.pintip, i=pinTips.indexOf(t);
      if(i>=0) pinTips.splice(i,1);
      else if(pinTips.length>=5){ toast('F\u00E4cher voll \u2014 erst ein anderes <b>Sternchen l\u00F6sen</b>'); return; }
      else pinTips.push(t);
      buildBrushWin();
    });
  });
  wireClose(w);
}
function drawTipPreview(cv){
  var g=cv.getContext('2d'); if(!g) return;
  g.clearRect(0,0,cv.width,cv.height);
  g.strokeStyle=color; g.lineCap='round';
  var id=cv.dataset.prev;
  for(var x=8;x<cv.width-8;x+=3){
    var t=(x-8)/(cv.width-16);
    var wgt={tinte:6+10*Math.sin(t*Math.PI),weich:12,marker:14,airbrush:16,kohle:10,aquarell:14,kreide:9,punkt:5}[id]||8;
    g.globalAlpha={airbrush:0.25,aquarell:0.3,kreide:0.6}[id]||0.9;
    g.lineWidth=wgt*0.5;
    g.beginPath(); g.moveTo(x,22+Math.sin(t*6)*8); g.lineTo(x+3,22+Math.sin((t+0.02)*6)*8); g.stroke();
  }
  g.globalAlpha=1;
}
function buildRulerWin(){
  var w=$('winRuler');
  function grp(items,cur,key){
    return '<div class="frow">'+items.map(function(it){
      return '<button class="hbtn'+(cur===it[0]?' on':'')+'" data-set="'+key+'" data-v="'+it[0]+'"'
        +(cur===it[0]?' style="border-color:var(--ac);color:var(--ac)"':'')+'>'+it[1]+'</button>';
    }).join('')+'</div>';
  }
  var html='<button class="wx" data-close="winRuler">\u2715</button>'
    +'<h5>LINEAL</h5>'
    +grp([['aus','Aus'],['gerade','Gerade'],['winkel','Winkel'],['persp','Persp.']],guide.rule,'rule')
    +'<h5>WINKEL DER GERADEN</h5>'
    +grp([[0,'0\u00B0'],[15,'15\u00B0'],[30,'30\u00B0'],[45,'45\u00B0'],[90,'90\u00B0']],guide.ang,'ang')
    +'<h5>SCHABLONE</h5>'
    +grp([['ellipse','Ellipse'],['kreis','Kreis']],guide.rule,'rule')
    +'<h5>SPIEGEL</h5>'
    +grp([['aus','Aus'],['x','Achse 1'],['xy','Achse 2'],['radial','Radial']],guide.mirror,'mirror')
    +'<h5>RADIALACHSEN</h5>'

<script>
'use strict';
/* ══════════ ÜBERGABEN — nie löschen, Quelle wird Vorlage ══════════ */
function makeVorlage(l){
  l.vorlage=true; l.locked=true;
  if(l.name.indexOf('(Vorlage)')<0) l.name+=' (Vorlage)';
  invalidate(l.typ);
}
function insertAbove(refLayer,nl){
  var i=doc.stack.indexOf(refLayer);
  doc.stack.splice(i+1,0,nl);
}
/* Pixel → Pfade (Marching Squares auf Alphakanal + Vereinfachung) */
function vektorisieren(l){
  var g=l.data.cv.getContext('2d');
  var img=g.getImageData(0,0,doc.w,doc.h);
  var paths=traceAlpha(img,doc.w,doc.h);
  if(!paths.length){ toast('Nichts zu vektorisieren auf „'+l.name+'“'); return null; }
  var nl=mkLayer('pfade',l.name.replace(' (Vorlage)','')+' → Pfade',
    {paths:paths.map(function(p){ return {pts:p,w:VALS.vektor.v1.val,col:color,closed:true}; })});
  insertAbove(l,nl); makeVorlage(l);
  activeByLens.vektor=nl.id; invalidate('pfade');
  return nl;
}
function traceAlpha(img,W,H){
  var d=img.data, S=4;                       /* Raster: jede 4. Zelle */
  function a(x,y){ if(x<0||y<0||x>=W||y>=H) return 0; return d[(y*W+x)*4+3]>96?1:0; }
  var visited={}, out=[];
  for(var y=0;y<H-S;y+=S) for(var x=0;x<W-S;x+=S){
    if(!a(x,y)||a(x-S,y)) continue;          /* linke Kante einer Fläche */
    var key=Math.round(x/S)+'_'+Math.round(y/S);
    if(visited[key]) continue;
    var path=traceBoundary(a,x,y,S,W,H,visited);
    if(path&&path.length>7) out.push(simplify(path,S*1.4));
    if(out.length>=24) break;
  }
  return out;
}
function traceBoundary(a,sx,sy,S,W,H,visited){
  /* Moore-Nachbarschaft, Schrittweite S */
  var dirs=[[S,0],[S,S],[0,S],[-S,S],[-S,0],[-S,-S],[0,-S],[S,-S]];
  var x=sx,y=sy,dir=6,path=[],guard=0;
  do{
    path.push({x:x,y:y});
    visited[Math.round(x/S)+'_'+Math.round(y/S)]=1;
    var found=false;
    for(var i=0;i<8;i++){
      var nd=(dir+6+i)%8;
      var nx=x+dirs[nd][0], ny=y+dirs[nd][1];
      if(a(nx,ny)){ x=nx; y=ny; dir=nd; found=true; break; }
    }
    if(!found) break;
    if(++guard>4000) break;
  }while(!(x===sx&&y===sy));
  return path;
}
function simplify(pts,eps){
  /* Douglas-Peucker */
  if(pts.length<3) return pts;
  var keep=new Array(pts.length); keep[0]=keep[pts.length-1]=true;
  var stack=[[0,pts.length-1]];
  while(stack.length){
    var seg=stack.pop(), i0=seg[0], i1=seg[1];
    var A=pts[i0],B=pts[i1],maxD=0,maxI=-1;
    for(var i=i0+1;i<i1;i++){
      var dd=ptSeg(pts[i],A,B);
      if(dd>maxD){ maxD=dd; maxI=i; }
    }
    if(maxD>eps){ keep[maxI]=true; stack.push([i0,maxI],[maxI,i1]); }
  }
  return pts.filter(function(_,i){return keep[i];});
}
function ptSeg(p,a,b){
  var dx=b.x-a.x,dy=b.y-a.y,L=dx*dx+dy*dy;
  var t=L?Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/L)):0;
  return Math.hypot(p.x-(a.x+t*dx),p.y-(a.y+t*dy));
}
/* Pfade/Layout → Pixel */
function rastern(l){
  var nl=pixelLayer(l.name.replace(' (Vorlage)','')+' → Pixel');
  var g=nl.data.cv.getContext('2d');
  g.globalAlpha=1; drawLayer(g,l,false);
  insertAbove(l,nl); makeVorlage(l);
  activeByLens.draw=nl.id; invalidate('pixel');
  return nl;
}
/* Pixel/Pfade → Layout (als Bildrahmen) */
function alsRahmen(l){
  var cv=document.createElement('canvas'); cv.width=doc.w; cv.height=doc.h;
  var g=cv.getContext('2d'); drawLayer(g,l,false);
  var target=layersOf('layout').filter(function(x){return !x.vorlage;}).pop();
  if(!target){ target=mkLayer('layout','Layout',{els:[]}); doc.stack.push(target); }
  target.data.els.push({kind:'imgframe',x:doc.w*0.12,y:doc.h*0.12,w:doc.w*0.4,h:doc.h*0.4,col:'#3d4a56',img:cv,dash:true});
  makeVorlage(l);
  activeByLens.studio=target.id; invalidate('layout');
  return target;
}
/* Ausgabe: Gesamtstapel flach → PNG + Eintrag in stände */
function ausgabe(){
  var cv=document.createElement('canvas'); cv.width=doc.w; cv.height=doc.h;
  var g=cv.getContext('2d');
  g.fillStyle='#ffffff'; g.fillRect(0,0,doc.w,doc.h);
  doc.stack.forEach(function(l){ if(l.visible&&!l.vorlage){ g.globalAlpha=l.opacity; drawLayer(g,l,false); } });
  g.globalAlpha=1;
  var name='stand_'+new Date().toISOString().slice(0,16).replace(/[-:T]/g,'')+'.png';
  doc.staende.push({name:name,ts:Date.now()});
  if(cv.toBlob) cv.toBlob(function(b){
    if(!b) return;
    var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);},3000);
  },'image/png');
  toast('Ausgabe erzeugt: '+name+' (auch in st\u00E4nde/ des Containers)');
  return name;
}
/* imgframe im Layout-Renderer nachrüsten */
var _drawLayer=drawLayer;
drawLayer=function(g,l,asGhost){
  if(l.typ==='layout'){
    l.data.els.forEach(function(e){
      if(e.kind!=='imgframe') return;
      if(e.img) g.drawImage(e.img,e.x,e.y,e.w,e.h);
      g.strokeStyle=asGhost?'#8a94a0':e.col; g.lineWidth=3; g.setLineDash(e.dash?[14,10]:[]);
      g.strokeRect(e.x,e.y,e.w,e.h); g.setLineDash([]);

};
var UEB={

          {t:'Ausgabe erzeugen',d:'Gesamten Stapel flach als PNG (ohne Vorlagen)',fn:ausgabe}],

          {t:'Als Rahmen setzen',d:'Aktive Ebene als Bildrahmen ins Layout',fn:function(){var l=activeLayer(); if(l){ alsRahmen(l); setLens('studio'); toast('Als Rahmen gesetzt'); }}},

/* ══════════════════════════════════════════════════════════════════
   FARBSYSTEM — übernommen aus K-OS Draw / K-OS Vektor
   Fläche + Farbtonleiste, Hex, Bibliotheken, zuletzt benutzt,
   Paletten-Generator (Farbharmonien). Bibliotheken aus K-OS Draw
   werden beim ersten Start übernommen.
   ══════════════════════════════════════════════════════════════════ */
var hsv={h:0,s:0.82,v:0.85};
var libs=[], activeLib=0;
function clamp01(v){ return Math.max(0,Math.min(1,v)); }
function hexToRgb(h){
  if(!h) return null;
  var m=/^#?([0-9a-f]{6})$/i.exec(String(h).trim());
  if(!m) return null;
  var n=parseInt(m[1],16);
  return {r:(n>>16)&255,g:(n>>8)&255,b:n&255};
}
function rgbToHex(r,g,b){
  return '#'+[r,g,b].map(function(v){ return Math.max(0,Math.min(255,v|0)).toString(16).padStart(2,'0'); }).join('');
}
function hsvToRgb(h,s,v){
  var c=v*s, x=c*(1-Math.abs(((h/60)%2)-1)), m=v-c, r=0,g=0,b=0;
  if(h<60){r=c;g=x;} else if(h<120){r=x;g=c;} else if(h<180){g=c;b=x;}
  else if(h<240){g=x;b=c;} else if(h<300){r=x;b=c;} else {r=c;b=x;}
  return {r:Math.round((r+m)*255),g:Math.round((g+m)*255),b:Math.round((b+m)*255)};
}
function rgbToHsv(r,g,b){
  r/=255; g/=255; b/=255;
  var mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn, h=0;
  if(d){ if(mx===r) h=60*(((g-b)/d)%6); else if(mx===g) h=60*((b-r)/d+2); else h=60*((r-g)/d+4); }
  if(h<0) h+=360;
  return {h:h,s:mx?d/mx:0,v:mx};
}
function mkHsv(h,s,v){ var c=hsvToRgb(((h%360)+360)%360,clamp01(s),clamp01(v)); return rgbToHex(c.r,c.g,c.b); }
var GEN_LABELS={analog:'Analog',mono:'Monochrom',comp:'Komplement\u00E4r',split:'Split-Komplement\u00E4r',triad:'Triade',tetrad:'Tetrade'};
function generatePalette(h,s,v,mode){
  var o=[];
  if(mode==='analog'){ [-60,-30,0,30,60].forEach(function(d){ o.push(mkHsv(h+d,s,v)); }); }
  else if(mode==='mono'){ [[s*0.35,Math.min(1,v*1.35)],[s*0.65,Math.min(1,v*1.15)],[s,v],[s,v*0.76],[Math.min(1,s),v*0.54]]
    .forEach(function(p){ o.push(mkHsv(h,p[0],p[1])); }); }
  else if(mode==='comp'){ o.push(mkHsv(h,s,v*0.8),mkHsv(h,s,v),mkHsv(h,s*0.55,Math.min(1,v*1.18)),mkHsv(h+180,s,v),mkHsv(h+180,s*0.7,Math.min(1,v*1.15))); }
  else if(mode==='split'){ o.push(mkHsv(h,s,v),mkHsv(h,s*0.5,Math.min(1,v*1.18)),mkHsv(h+150,s,v),mkHsv(h+210,s,v),mkHsv(h+180,s*0.45,v*0.82)); }
  else if(mode==='triad'){ o.push(mkHsv(h,s,v),mkHsv(h,s*0.5,Math.min(1,v*1.18)),mkHsv(h+120,s,v),mkHsv(h+240,s,v),mkHsv(h+120,s*0.5,v*0.82)); }
  else if(mode==='tetrad'){ o.push(mkHsv(h,s,v),mkHsv(h+90,s,v),mkHsv(h+180,s,v),mkHsv(h+270,s,v),mkHsv(h,s*0.5,Math.min(1,v*1.18))); }
  return o;
}
function loadFarben(){
  try{
    var j=JSON.parse(localStorage.getItem('koslinse_farben')||'null');
    if(j&&j.libs){ libs=j.libs; activeLib=j.activeLib||0; if(j.recent) recentCols=j.recent; return; }
    var d=JSON.parse(localStorage.getItem('kos-draw-farben')||'null');   /* Bibliotheken aus K-OS Draw übernehmen */
    if(d&&d.libs){ libs=d.libs; activeLib=d.activeLib||0; if(d.recent&&d.recent.length) recentCols=d.recent.slice(0,10); return; }
  }catch(e){}
  libs=[{name:'K-OS Marke',colors:['#d92626','#f2af0d','#26b9d9','#26d97a','#111111','#ffffff','#e05050','#2a8fa8']},
        {name:'Standard',colors:['#1a1a1a','#ffffff','#FF2D78','#3DA9FC','#FFD23F','#22C55E','#9B5DE5','#F15BB5']}];
  activeLib=0;
}
function saveFarben(){
  try{ localStorage.setItem('koslinse_farben',JSON.stringify({libs:libs,activeLib:activeLib,recent:recentCols})); }catch(e){}
}
function setColorHex(hex){
  var rgb=hexToRgb(hex); if(!rgb) return;
  hsv=rgbToHsv(rgb.r,rgb.g,rgb.b);
  setColor(rgbToHex(rgb.r,rgb.g,rgb.b));
}
function applyHSV(){
  var c=hsvToRgb(hsv.h,clamp01(hsv.s),clamp01(hsv.v));
  setColor(rgbToHex(c.r,c.g,c.b),true);
  var pv=$('pkPrev'); if(pv) pv.style.background=color;
  var hx=$('pkHex'); if(hx) hx.value=color.toUpperCase();
  drawSV(); drawHue(); renderGen(); markChips();
}
function drawSV(){
  var cv=$('svsq'); if(!cv) return;
  var g=cv.getContext('2d'); if(!g) return;
  var W=cv.width,H=cv.height, base=hsvToRgb(hsv.h,1,1);
  var gx=g.createLinearGradient(0,0,W,0);
  gx.addColorStop(0,'#ffffff'); gx.addColorStop(1,'rgb('+base.r+','+base.g+','+base.b+')');
  g.fillStyle=gx; g.fillRect(0,0,W,H);
  var gy=g.createLinearGradient(0,0,0,H);
  gy.addColorStop(0,'rgba(0,0,0,0)'); gy.addColorStop(1,'#000000');
  g.fillStyle=gy; g.fillRect(0,0,W,H);
  var x=clamp01(hsv.s)*W, y=(1-clamp01(hsv.v))*H;
  g.beginPath(); g.arc(x,y,7,0,Math.PI*2); g.strokeStyle='#fff'; g.lineWidth=2; g.stroke();
  g.beginPath(); g.arc(x,y,8.5,0,Math.PI*2); g.strokeStyle='#0009'; g.lineWidth=1.5; g.stroke();
}
function drawHue(){
  var cv=$('hueBar'); if(!cv) return;
  var g=cv.getContext('2d'); if(!g) return;
  var W=cv.width,H=cv.height, gr=g.createLinearGradient(0,0,0,H);
  for(var i=0;i<=6;i++){ var c=hsvToRgb(i*60,1,1); gr.addColorStop(i/6,'rgb('+c.r+','+c.g+','+c.b+')'); }
  g.fillStyle=gr; g.fillRect(0,0,W,H);
  var y=(hsv.h/360)*H;
  g.fillStyle='#fff'; g.fillRect(0,y-2,W,4);
  g.strokeStyle='#0009'; g.lineWidth=1; g.strokeRect(0,y-2,W,4);
}
function mkChip(hex,onTap,onLong,pinned){

function buildColorPanel(){

function bindCanvasDrag(el,fn){
  if(!el) return;
  var on=false;
  el.addEventListener('pointerdown',function(e){
    e.preventDefault(); on=true;

  el.addEventListener('pointercancel',function(){ on=false; });
}

/* ══════════ TEXT IM LAYOUT BEARBEITEN ══════════ */
function selEl(){
  if(!overlaySel) return null;
  var l=layerById(overlaySel.layerId);
  if(!l||l.typ!=='layout') return null;
  return {l:l,e:l.data.els[overlaySel.idx],idx:overlaySel.idx};
}
function openTextWin(l,idx){
  var e=l.data.els[idx];
  if(!e) return;
  overlaySel={layerId:l.id,idx:idx};
  var w=$('winText');
  var isText=e.kind==='text';
  w.innerHTML='<button class="wx" data-close="winText">\u2715</button>'
    +'<h5>'+(isText?'TEXT':e.kind.toUpperCase())+' BEARBEITEN</h5>'
    +(isText?'<div class="hexrow"><input id="txIn" value="'+String(e.text).replace(/"/g,'&quot;')+'"><button id="txOk">OK</button></div>':'')
    +'<div class="frow"><button class="hbtn" id="txCol">Farbe anwenden</button><button class="hbtn" id="txDel">L\u00F6schen</button></div>'
    +'<div class="frow"><button class="hbtn" id="txUp">Nach vorn</button><button class="hbtn" id="txDown">Nach hinten</button></div>'
    +'<div class="mono" style="font-size:11px;color:var(--tx3);margin-top:8px">'
    +(isText?'Schrift und Laufweite wirken \u00FCber die Regler im Rad und im Panel.':'Gr\u00F6\u00DFe durch Ziehen an der Fl\u00E4che.')+'</div>';
  openWin('winText');
  if(isText){
    var inp=$('txIn');
    var apply=function(){ e.text=inp.value; invalidate('layout'); autosaveSoon(); req(); };
    $('txOk').addEventListener('click',function(){ apply(); closeWins(); });
    inp.addEventListener('input',apply);
    inp.addEventListener('keydown',function(ev){ if(ev.key==='Enter'){ apply(); closeWins(); } });
    setTimeout(function(){ try{ inp.focus(); inp.select(); }catch(err){} },30);
  }
  $('txCol').addEventListener('click',function(){ e.col=color; invalidate('layout'); autosaveSoon(); req(); toast('Farbe angewendet'); });
  $('txDel').addEventListener('click',function(){
    l.data.els.splice(idx,1); overlaySel=null; invalidate('layout'); closeWins(); autosaveSoon(); req(); toast('Element gel\u00F6scht');
  });
  $('txUp').addEventListener('click',function(){
    if(idx>=l.data.els.length-1) return;
    var m=l.data.els.splice(idx,1)[0]; l.data.els.splice(idx+1,0,m);
    overlaySel={layerId:l.id,idx:idx+1}; invalidate('layout'); autosaveSoon(); req(); closeWins();
  });
  $('txDown').addEventListener('click',function(){
    if(idx<=0) return;
    var m2=l.data.els.splice(idx,1)[0]; l.data.els.splice(idx-1,0,m2);
    overlaySel={layerId:l.id,idx:idx-1}; invalidate('layout'); autosaveSoon(); req(); closeWins();
  });
  wireClose(w);
}

setVal=function(key,v){

    invalidate('layout'); req();
  }
};

function commands(){
  var c=[];
  Object.keys(TOOLDEF).forEach(function(t){
    var inLens=RING[lens].indexOf(t)>=0||ALLTOOLS[lens].some(function(g){return g[1].indexOf(t)>=0;});
    if(!inLens) return;
    if(TOOLDEF[t].act) c.push({t:'Befehl: '+TOOLDEF[t].nm,k:LENS[lens].sicht,fn:TOOLDEF[t].act});
    else c.push({t:'Werkzeug: '+TOOLDEF[t].nm,k:LENS[lens].sicht,fn:function(){setTool(t);}});
  });
  UEB[lens].forEach(function(u){ c.push({t:'\u00DCbergabe: '+u.t,k:LENS[lens].sicht,fn:u.fn}); });
  c.push({t:'Ebene duplizieren',k:'Stapel',fn:dupLayer});
  c.push({t:'Neue Ebene',k:'Stapel',fn:addLayerCmd});
  c.push({t:'Ansicht einpassen',k:'Ansicht',fn:function(){fitView();req();}});
  c.push({t:'Datei speichern (.kos)',k:'Datei',fn:saveKos});
  c.push({t:'In die Ablage legen (Dropbox)',k:'Ablage',fn:dbxSaveKos});
  c.push({t:'Aus der Ablage \u00F6ffnen (Dropbox)',k:'Ablage',fn:function(){ closeWins(); $('winfile').classList.add('show'); dbxListKos(); }});
  c.push({t:'Ebene l\u00F6schen \u00B7 umbenennen \u00B7 Deckkraft',k:'Stapel',fn:function(){ var l=activeLayer(); if(l) openLayerWin(l); }});
  c.push({t:'Lineal \u00B7 Schablone \u00B7 Spiegel',k:'Hilfslinien',fn:function(){ openWin('winRuler'); }});
  c.push({t:'Lineal aus',k:'Hilfslinien',fn:function(){ setGuide('rule','aus'); setGuide('mirror','aus'); toast('Hilfslinien aus'); }});
  Object.keys(LENS).forEach(function(k){ c.push({t:'Linse: '+LENS[k].nm,k:LENS[k].sicht,fn:function(){setLens(k);}}); });
  return c;
}
function dupLayer(){
  var l=activeLayer(); if(!l) return;
  var nl;
  if(l.typ==='pixel'){ nl=pixelLayer(l.name+' Kopie'); nl.data.cv.getContext('2d').drawImage(l.data.cv,0,0); }
  else nl=mkLayer(l.typ,l.name+' Kopie',JSON.parse(JSON.stringify(l.data,function(k,v){return v&&v.getContext?undefined:v;})));
  nl.opacity=l.opacity;
  insertAbove(l,nl); activeByLens[lens]=nl.id;
  invalidate(l.typ); renderStack(); autosaveSoon(); req();
  toast('Ebene dupliziert');
}
function addLayerCmd(){
  var typ=LENS[lens].typ, nl;
  if(typ==='pixel') nl=pixelLayer('Pixel '+(layersOf('pixel').length+1));
  else if(typ==='pfade') nl=mkLayer('pfade','Pfade '+(layersOf('pfade').length+1),{paths:[]});
  else nl=mkLayer('layout','Layout '+(layersOf('layout').length+1),{els:[]});
  doc.stack.push(nl); activeByLens[lens]=nl.id;
  renderStack(); autosaveSoon(); req();
  toast('Neue Ebene: '+nl.name);
}
var cmdSel=0;
function cmdFilter(){
  var q=$('cmdIn').value.trim().toLowerCase();
  var list=$('cmdlist');
  if(!q){ list.classList.remove('show'); return; }
  var hits=commands().filter(function(c){return c.t.toLowerCase().indexOf(q)>=0;}).slice(0,8);
  if(!hits.length){ list.classList.remove('show'); return; }
  cmdSel=Math.min(cmdSel,hits.length-1);
  list.innerHTML=hits.map(function(c,i){
    return '<div class="ci'+(i===cmdSel?' sel':'')+'" data-i="'+i+'"><span>'+c.t+'</span><span class="k">'+c.k+'</span></div>';
  }).join('');
  list.classList.add('show');
  list.querySelectorAll('.ci').forEach(function(el){
    el.addEventListener('click',function(){ runCmd(hits[Number(el.dataset.i)]); });
  });
  list._hits=hits;
}
function runCmd(c){
  $('cmdlist').classList.remove('show'); $('cmdIn').value=''; $('cmdIn').blur();
  c.fn(); renderStack(); req();
}
$('cmdIn').addEventListener('input',function(){ cmdSel=0; cmdFilter(); });
$('cmdIn').addEventListener('keydown',function(e){
  var hits=$('cmdlist')._hits||[];
  if(e.key==='ArrowDown'){ cmdSel=Math.min(cmdSel+1,hits.length-1); cmdFilter(); e.preventDefault(); }
  else if(e.key==='ArrowUp'){ cmdSel=Math.max(cmdSel-1,0); cmdFilter(); e.preventDefault(); }
  else if(e.key==='Enter'&&hits[cmdSel]){ runCmd(hits[cmdSel]); }
  else if(e.key==='Escape'){ $('cmdlist').classList.remove('show'); $('cmdIn').blur(); }
});

/* ══════════ .KOS-CONTAINER (ZIP, unkomprimiert) ══════════ */
var CRC_T=(function(){ var t=[],c; for(var n=0;n<256;n++){ c=n;
  for(var k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; } return t; })();
function crc32(u8){ var c=0xFFFFFFFF;
  for(var i=0;i<u8.length;i++) c=CRC_T[(c^u8[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0; }
function zipStore(files){ /* files: [{name, data:Uint8Array}] → Uint8Array */
  var parts=[],central=[],off=0,enc=new TextEncoder();
  files.forEach(function(f){
    var nm=enc.encode(f.name), d=f.data, crc=crc32(d);
    var lh=new Uint8Array(30+nm.length), v=new DataView(lh.buffer);
    v.setUint32(0,0x04034b50,true); v.setUint16(4,20,true); v.setUint16(6,0,true); v.setUint16(8,0,true);
    v.setUint16(10,0,true); v.setUint16(12,0,true);
    v.setUint32(14,crc,true); v.setUint32(18,d.length,true); v.setUint32(22,d.length,true);
    v.setUint16(26,nm.length,true); v.setUint16(28,0,true);
    lh.set(nm,30);
    parts.push(lh,d);
    var ch=new Uint8Array(46+nm.length), cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint32(16,crc,true); cv.setUint32(20,d.length,true); cv.setUint32(24,d.length,true);
    cv.setUint16(28,nm.length,true);
    cv.setUint32(42,off,true);
    ch.set(nm,46);
    central.push(ch);
    off+=lh.length+d.length;
  });
  var cSize=central.reduce(function(s,c){return s+c.length;},0);
  var end=new Uint8Array(22), ev=new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,cSize,true); ev.setUint32(16,off,true);
  var total=off+cSize+22, out=new Uint8Array(total), p=0;
  parts.concat(central).concat([end]).forEach(function(u){ out.set(u,p); p+=u.length; });
  return out;
}
function zipRead(u8){ /* nur store-Einträge (eigene Container) */
  var v=new DataView(u8.buffer,u8.byteOffset,u8.byteLength), dec=new TextDecoder();
  var out={}, p=0;
  while(p+4<=u8.length&&v.getUint32(p,true)===0x04034b50){
    var method=v.getUint16(p+8,true);
    var size=v.getUint32(p+18,true);
    var nlen=v.getUint16(p+26,true), elen=v.getUint16(p+28,true);
    var name=dec.decode(u8.subarray(p+30,p+30+nlen));
    var start=p+30+nlen+elen;
    if(method!==0) throw new Error('Komprimierter Eintrag: '+name+' — dieser Container wurde nicht von K-OS geschrieben');
    out[name]=u8.subarray(start,start+size);
    p=start+size;
  }
  return out;
}
function pathsToSvg(l){
  var s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+doc.w+' '+doc.h+'">';
  l.data.paths.forEach(function(p){
    if(!p.pts.length) return;
    s+='<path d="M'+p.pts.map(function(q){return Math.round(q.x*10)/10+' '+Math.round(q.y*10)/10;}).join(' L');
    if(p.closed) s+=' Z';
    s+='" fill="none" stroke="'+p.col+'" stroke-width="'+p.w+'" stroke-linecap="round" stroke-linejoin="round"/>';
  });
  return s+'</svg>';
}
function svgToPaths(txt){
  var out=[], re=/<path d="M([^"]+)" fill="none" stroke="([^"]+)" stroke-width="([^"]+)"/g, m;
  while((m=re.exec(txt))){
    var d=m[1], closed=/ Z\s*$/.test(d);
    var pts=d.replace(/ Z\s*$/,'').split(' L').map(function(pp){
      var xy=pp.trim().split(/\s+/); return {x:parseFloat(xy[0]),y:parseFloat(xy[1])};
    });
    out.push({pts:pts,w:parseFloat(m[3]),col:m[2],closed:closed});
  }
  return out;
}
function dataUrlBytes(url){
  var b64=url.slice(url.indexOf(',')+1), bin=atob(b64), u=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  return u;
}
function buildContainer(){
  var enc=new TextEncoder(), files=[];
  var manifest={name:doc.name,w:doc.w,h:doc.h,durchblick:durchblick,staende:doc.staende,
    stack:doc.stack.map(function(l,i){
      var e={typ:l.typ,name:l.name,opacity:l.opacity,visible:l.visible,locked:l.locked,vorlage:l.vorlage};
      if(l.typ==='pixel') e.file='pixel/'+i+'.png';
      if(l.typ==='pfade') e.file='pfade/'+i+'.svg';
      if(l.typ==='layout') e.file='layout/'+i+'.json';
      if(l.typ==='material') e.file=l.data.src?('material/'+i+'.png'):null;
      return e;
    })};
  files.push({name:'manifest.json',data:enc.encode(JSON.stringify(manifest,null,1))});
  doc.stack.forEach(function(l,i){
    if(l.typ==='pixel') files.push({name:'pixel/'+i+'.png',data:dataUrlBytes(l.data.cv.toDataURL('image/png'))});
    else if(l.typ==='pfade') files.push({name:'pfade/'+i+'.svg',data:enc.encode(pathsToSvg(l))});
    else if(l.typ==='layout') files.push({name:'layout/'+i+'.json',
      data:enc.encode(JSON.stringify(l.data.els,function(k,v){return (k==='img')?undefined:v;}))});
    else if(l.typ==='material'&&l.data.src) files.push({name:'material/'+i+'.png',data:dataUrlBytes(l.data.src)});
  });
  return zipStore(files);
}
function saveKos(){
  try{
    var u8=buildContainer();
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([u8],{type:'application/zip'}));
    a.download=doc.name+'.kos'; a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);},3000);
    toast('Gespeichert: '+doc.name+'.kos ('+doc.stack.length+' Ebenen als Container)');
  }catch(err){ toast('Speichern fehlgeschlagen: '+(err.message||err)); }
}
function loadKosBytes(u8,done){
  var z=zipRead(u8), dec=new TextDecoder();
  var mf=JSON.parse(dec.decode(z['manifest.json']));
  newDoc(mf.name,mf.w,mf.h);
  doc.staende=mf.staende||[];
  var pend=0;
  mf.stack.forEach(function(e){
    var l;
    if(e.typ==='pixel'){
      l=pixelLayer(e.name);
      if(e.file&&z[e.file]){
        pend++;
        var img=new Image();
        img.onload=function(){ l.data.cv.getContext('2d').drawImage(img,0,0); invalidate('pixel'); if(--pend===0&&done) done(); req(); };
        img.src='data:image/png;base64,'+u8b64(z[e.file]);
      }
    } else if(e.typ==='pfade'){
      l=mkLayer('pfade',e.name,{paths:e.file&&z[e.file]?svgToPaths(dec.decode(z[e.file])):[]});
    } else if(e.typ==='layout'){
      l=mkLayer('layout',e.name,{els:e.file&&z[e.file]?JSON.parse(dec.decode(z[e.file])):[]});
    } else {
      l=mkLayer('material',e.name,{});
      if(e.file&&z[e.file]){
        pend++;
        var m2=new Image();
        m2.onload=function(){ l.data.img=m2; if(--pend===0&&done) done(); req(); };
        l.data.src='data:image/png;base64,'+u8b64(z[e.file]);
        m2.src=l.data.src;
      }
    }
    l.opacity=e.opacity; l.visible=e.visible; l.locked=e.locked; l.vorlage=e.vorlage;
    doc.stack.push(l);
  });
  ['pixel','pfade','layout'].forEach(invalidate);
  activeByLens={draw:null,vektor:null,studio:null};
  if(typeof mf.durchblick==='number') setDurchblick(mf.durchblick);
  if(pend===0&&done) done();
}
function u8b64(u8){
  var s=''; for(var i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));
  return btoa(s);
}

/* ══════════ ABLAGE · DROPBOX (Sitzung von K-OS Files, gleiche Origin) ══════════
   Kein zweiter Login: liest kosfiles_tokens/kosfiles_appkey und erneuert den
   Zugriff bei Bedarf selbst. Container landen in /Linse im App-Ordner.        */
var DBX_DIR='/Linse';
function dbxTokens(){
  try{ return JSON.parse(localStorage.getItem('kosfiles_tokens')||'null'); }catch(e){ return null; }
}
function dbxConnected(){ var t=dbxTokens(); return !!(t&&(t.access||t.refresh)); }
function dbxRefresh(){
  var t=dbxTokens(), key=localStorage.getItem('kosfiles_appkey')||'';
  if(!t||!t.refresh||!key) return Promise.reject(new Error('Sitzung abgelaufen — in K-OS Files neu verbinden'));
  return fetch('https://api.dropboxapi.com/oauth2/token',{
    method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams({grant_type:'refresh_token',refresh_token:t.refresh,client_id:key})
  }).then(function(r){
    if(!r.ok) throw new Error('Token-Refresh fehlgeschlagen ('+r.status+')');
    return r.json();
  }).then(function(j){
    var nt={access:j.access_token,refresh:t.refresh,exp:Date.now()+Math.max(60,(j.expires_in||14400)-60)*1000};
    try{ localStorage.setItem('kosfiles_tokens',JSON.stringify(nt)); }catch(e){}
    return nt.access;
  });
}
function dbxToken(){
  var t=dbxTokens();
  if(!t) return Promise.reject(new Error('Nicht verbunden — in K-OS Files mit Dropbox anmelden'));
  if(!t.access||(t.exp&&Date.now()>t.exp)) return dbxRefresh();
  return Promise.resolve(t.access);
}
function dbxRPC(ep,body){
  return dbxToken().then(function(at){
    return fetch('https://api.dropboxapi.com/2/'+ep,{
      method:'POST',headers:{'Authorization':'Bearer '+at,'Content-Type':'application/json'},
      body:JSON.stringify(body===undefined?null:body)
    });
  }).then(function(r){
    if(r.status===401) return dbxRefresh().then(function(){ return dbxRPC(ep,body); });
    if(!r.ok) return r.text().then(function(t){ throw new Error(ep+' \u2192 '+r.status+' '+t.slice(0,120)); });
    return r.json();
  });
}
function dbxSaveKos(){
  var u8;
  try{ u8=buildContainer(); }catch(err){ toast('Container fehlgeschlagen: '+(err.message||err)); return Promise.reject(err); }
  var path=DBX_DIR+'/'+doc.name+'.kos';
  $('dbxState').textContent='Lade hoch \u2026';
  return dbxToken().then(function(at){
    return fetch('https://content.dropboxapi.com/2/files/upload',{
      method:'POST',
      headers:{'Authorization':'Bearer '+at,
        'Dropbox-API-Arg':JSON.stringify({path:path,mode:'overwrite',mute:true}),
        'Content-Type':'application/octet-stream'},
      body:u8
    });
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw new Error(r.status+' '+t.slice(0,120)); });
    return r.json();
  }).then(function(j){
    $('dbxState').textContent='In der Ablage: '+path+' \u00B7 '+Math.round((j.size||u8.length)/1024)+' kB';
    toast('In die Ablage gelegt: '+doc.name+'.kos');
  }).catch(function(err){
    $('dbxState').textContent='Fehler: '+(err.message||err);
    toast('Ablage: '+(err.message||err));
  });
}
function dbxListKos(){
  $('dbxState').textContent='Ablage wird gelesen \u2026';
  $('dbxFiles').innerHTML='';
  return dbxRPC('files/list_folder',{path:DBX_DIR,recursive:false,limit:200})
    .catch(function(err){
      if(/not_found/.test(String(err))) return {entries:[]};
      throw err;
    })
    .then(function(res){
      var ent=(res.entries||[]).filter(function(e){ return e['.tag']==='file'&&/\.kos$/i.test(e.name); })
        .sort(function(a,b){ return (b.server_modified||'').localeCompare(a.server_modified||''); });
      if(!ent.length){ $('dbxState').textContent='Noch keine .kos-Container in '+DBX_DIR; return; }
      $('dbxState').textContent=ent.length+' Container in '+DBX_DIR;
      $('dbxFiles').innerHTML=ent.map(function(e){
        return '<div class="ui" data-p="'+e.path_lower+'" style="display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:9px;cursor:pointer">'
          +'<span class="t" style="font-size:12.5px">'+e.name+'</span>'
          +'<span class="d" style="font-size:11px;color:var(--tx3)">'+Math.round(e.size/1024)+' kB \u00B7 '+String(e.server_modified||'').slice(0,10)+'</span></div>';
      }).join('');
      $('dbxFiles').querySelectorAll('[data-p]').forEach(function(el){
        el.addEventListener('click',function(){ dbxOpenKos(el.dataset.p); });
      });
    })
    .catch(function(err){
      $('dbxState').textContent='Fehler: '+(err.message||err);
      toast('Ablage: '+(err.message||err));
    });
}
function dbxOpenKos(path){
  $('dbxState').textContent='Lade '+path+' \u2026';
  return dbxToken().then(function(at){
    return fetch('https://content.dropboxapi.com/2/files/download',{
      method:'POST',headers:{'Authorization':'Bearer '+at,'Dropbox-API-Arg':JSON.stringify({path:path})}
    });
  }).then(function(r){
    if(!r.ok) throw new Error('download '+r.status);
    return r.arrayBuffer();
  }).then(function(buf){
    loadKosBytes(new Uint8Array(buf),function(){
      afterDocLoad(); closeWins();
      toast('Aus der Ablage geladen: '+doc.name);
    });
  }).catch(function(err){
    $('dbxState').textContent='Fehler: '+(err.message||err);
    toast('Ablage: '+(err.message||err));
  });
}
function dbxState(){
  var el=$('dbxState');
  if(!el) return;
  el.textContent=dbxConnected()
    ? 'Dropbox verbunden \u00B7 Ordner '+DBX_DIR
    : 'Nicht verbunden \u2014 in K-OS Files (Taste 4) mit Dropbox anmelden';
}

/* ══════════ AUTOSAVE (IndexedDB) ══════════ */
var asT=0;
function autosaveSoon(){ clearTimeout(asT); asT=setTimeout(autosave,1500); }
function autosave(){
  try{
    var u8=buildContainer();
    var rq=indexedDB.open('koslinse',1);
    rq.onupgradeneeded=function(){ rq.result.createObjectStore('kv'); };
    rq.onsuccess=function(){
      var d=rq.result,t=d.transaction('kv','readwrite');
      t.objectStore('kv').put(u8,'auto');
      t.oncomplete=function(){ d.close(); };
    };
  }catch(e){}
}
function tryRestore(done){
  try{
    var rq=indexedDB.open('koslinse',1);
    rq.onupgradeneeded=function(){ rq.result.createObjectStore('kv'); };
    rq.onsuccess=function(){
      var d=rq.result,g=d.transaction('kv').objectStore('kv').get('auto');
      g.onsuccess=function(){
        d.close();
        if(g.result&&g.result.length){ try{ loadKosBytes(new Uint8Array(g.result),done); return; }catch(e){} }
        done(false);
      };
      g.onerror=function(){ d.close(); done(false); };
    };
    rq.onerror=function(){ done(false); };
  }catch(e){ done(false); }
}

/* Spine: tippen = wechseln · halten = durchsehen · files = zurück zur Ablage */
document.querySelectorAll('#spine .seg').forEach(function(s){
  var k=s.dataset.lens, holdT=0, held=false;
  s.addEventListener('pointerdown',function(e){
    e.preventDefault(); held=false;
    if(k==='files') return;
    holdT=setTimeout(function(){
      held=true; seeThrough=LENS[k].typ; req();
    },350);
  });
  function up(){
    clearTimeout(holdT);
    if(held){ seeThrough=null; req(); held=false; return; }
    if(k==='files'){ gotoFiles(); return; }
    setLens(k);
  }
  s.addEventListener('pointerup',up);
  s.addEventListener('pointercancel',function(){ clearTimeout(holdT); if(held){ seeThrough=null; req(); held=false; } });
});
function gotoFiles(){
  try{
    if(window.top!==window.self){ window.top.location.hash='#lens=files'; window.top.location.reload(); return; }
  }catch(e){}
  location.href='./index.html#lens=files';
}
/* Tasten: 1 Pixel · 2 Pfade · 3 Layout · 4 Ablage · K Befehlsfeld */
document.addEventListener('keydown',function(e){
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')) return;
  var k=e.key.toLowerCase();
  /* Linsen und Ablage */
  if(k==='1') setLens('draw');
  else if(k==='2') setLens('vektor');
  else if(k==='3') setLens('studio');
  else if(k==='4') gotoFiles();
  else if(k==='k'){ $('cmdIn').focus(); e.preventDefault(); }
  /* Werkzeuge — Belegung wie in K-OS Draw */
  else if(k==='b') setTool(lens==='vektor'?'pen':(lens==='studio'?'text':'brush'));
  else if(k==='e') setTool('eraser');
  else if(k==='g'&&lens==='draw') setTool('fill');
  else if(k==='i') setTool('pick');
  else if(k==='m') setTool(lens==='draw'?'selRect':'sel');
  else if(k==='v') setTool('move');
  else if(k==='l'){ openWin('winRuler'); }
  else if(k==='c'){ openWin('winColor'); }
  /* Ansicht */
  else if(k==='f'){ fitView(); req(); }
  else if(k==='r'){ rotateBy(e.shiftKey?-90:90); }
  else if(k==='0'){ view.scale=1; req(); }
  /* Rad */
  else if(k==='w'){ setRadMode(rad.mode==='fest'?'folgend':'fest'); }
  else if(k==='escape'){ closeWins(); rad.fan=null; rad.big=false; radRelayout(); }
  /* Datei */
  else if(k==='s'&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); saveKos(); }
});
/* Klick neben Fenster schließt sie */
document.addEventListener('pointerdown',function(e){
  if(e.target.closest&&(e.target.closest('.win')||e.target.closest('#uebBtn')||e.target.closest('#fileBtn')||e.target.closest('#cmd'))) return;
  closeWins();
  if(!e.target.closest||!e.target.closest('#cmd')) $('cmdlist').classList.remove('show');
},true);

/* ══════════ BOOT ══════════ */
function afterDocLoad(){
  $('docName').textContent=doc.name;
  fitView(); overlaySel=null;
  setLens(lens);
}
function boot(){
  sctx=stage.getContext('2d');
  loadFarben();
  try{ var db=localStorage.getItem('koslinse_db'); if(db!==null) durchblick=Number(db); }catch(e){}
  try{
    var gj=JSON.parse(localStorage.getItem('koslinse_guide')||'null');
    if(gj){ ['rule','ang','mirror','axes'].forEach(function(k){ if(k in gj) guide[k]=gj[k]; }); }
  }catch(e){}
  $('dbSl').value=durchblick; $('dbVal').textContent=durchblick+' %';
  tryRestore(function(ok){
    if(!ok) demoDoc();
    afterDocLoad();
    setRadMode(rad.mode);
    if(rad.mode==='fest'){ if(!rad.x) centerRad(); showRad(); }
  });
  window.addEventListener('resize',function(){ req(); });
}
boot();
